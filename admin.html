  --page:#f9f9f7; --surface:#fcfcfb; --field:#f1f0ec; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s1-soft:#cde2fb; --s2:#eb6834;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --warn-ink:#8a5a00; --crit:#d03b3b; --crit-ink:#b42d2d;
  --btn:#0b0b0b; --btn-ink:#fcfcfb; --focus:#2a78d6;
  --font:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --field:#242422; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s1-soft:#184f95; --s2:#d95926;
    --good-ink:#0ca30c; --warn-ink:#fab219; --crit-ink:#e66767;
    --btn:#f0efec; --btn-ink:#0d0d0d; --focus:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --field:#242422; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s1-soft:#184f95; --s2:#d95926;
  --good-ink:#0ca30c; --warn-ink:#fab219; --crit-ink:#e66767;
  --btn:#f0efec; --btn-ink:#0d0d0d; --focus:#3987e5;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.wrap{max-width:1180px;margin:0 auto;padding:20px max(16px, env(safe-area-inset-right)) 64px max(16px, env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-weight:800;flex:none}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.brand p{font-size:13px;color:var(--ink2)}
.top-actions{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border-radius:11px;border:0;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-2{background:var(--surface);color:var(--ink);border:1px solid var(--border)}
.btn-link{background:none;border:0;padding:4px 2px;min-height:36px;color:var(--ink2);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.btn-danger{background:none;border:1px solid var(--border);color:var(--crit-ink);min-height:36px;padding:0 12px;border-radius:10px;font-weight:700;font-size:13px}
.btn-danger.armed{background:var(--crit);border-color:var(--crit);color:#fff}
.btn-crit{background:var(--crit);color:#fff}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px, calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;background:var(--surface);border-radius:18px;padding:22px;z-index:41;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dialog h2{font-size:19px;line-height:1.3}
.dsum{margin:12px 0 4px;font-weight:700;font-size:15px}
.btn-sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:9px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px}
.card h2{font-size:17px;font-weight:800;line-height:1.25}
.card h3{font-size:15px;font-weight:800;margin-bottom:10px}
.card .sub{font-size:13px;color:var(--ink2);margin-top:3px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit, minmax(min(100%, 420px), 1fr))}
.g3{grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr))}
.g4{grid-template-columns:repeat(auto-fit, minmax(min(100%, 160px), 1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.note{font-size:13.5px;color:var(--ink2)}
.empty{font-size:14px;color:var(--ink2);padding:10px 0}
.alert{border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.5;border:1px solid var(--border);background:var(--surface)}
.alert b{display:block;margin-bottom:2px}
.alert.err{border-color:var(--crit);}
.alert.err b{color:var(--crit-ink)}
.alert code, .code{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12.5px;background:var(--field);padding:2px 6px;border-radius:6px;word-break:break-all}

/* login */
.login{max-width:420px;margin:8vh auto 0}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label, .flabel{font-size:13px;font-weight:700}
.input, select.input, textarea.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--axis);background:var(--surface);font-size:16px;min-height:44px}
textarea.input{min-height:110px;resize:vertical;line-height:1.4}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin:0;accent-color:var(--s1)}

/* tabs and filters */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;font-weight:700;font-size:14.5px;color:var(--ink2);min-height:44px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.filters{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-bottom:18px;font-size:14px}
.filters select{min-height:38px;border-radius:9px;border:1px solid var(--axis);background:var(--surface);padding:0 10px;font-size:14px}
.filters .spacer{flex:1}
.loaded{font-size:12.5px;color:var(--ink2)}

/* stat tiles */
.tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px}
.tile .tl{font-size:13px;color:var(--ink2);font-weight:600}
.tile .tv{font-size:30px;font-weight:800;line-height:1.15;margin-top:4px;letter-spacing:-.01em}
.tile .ts{font-size:12.5px;color:var(--ink2);margin-top:2px}

/* hypotheses */
.hyp{display:flex;flex-direction:column;gap:10px}
.hyp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hyp-tag{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.hyp h3{font-size:15px;font-weight:700;margin:2px 0 0;line-height:1.35}
.hyp-val{font-size:28px;font-weight:800;line-height:1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
.status .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none}
.status .dot .ic{width:13px;height:13px;stroke-width:3}
.status.good{color:var(--good-ink)} .status.good .dot{background:var(--good);color:#fff}
.status.warn{color:var(--warn-ink)} .status.warn .dot{background:var(--warn);color:#0b0b0b}
.status.none{color:var(--ink2)} .status.none .dot{background:var(--field);color:var(--ink2)}
.meter{position:relative;height:12px;border-radius:6px;background:var(--s1-soft)}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--s1)}
.meter .target{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
.meter-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2)}

/* bar lists */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0, 40%) minmax(0, 1fr) auto;align-items:center;gap:10px;font-size:14px}
.bl{min-width:0;overflow-wrap:anywhere;line-height:1.3}
.bt{position:relative;height:14px;border-left:1px solid var(--axis)}
.bt i{position:absolute;left:0;top:1px;bottom:1px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.bt i.s2{background:var(--s2)}
.bt i.zero{min-width:0}
.bv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:42px}
.bv small{font-weight:600;color:var(--ink2);margin-left:6px;font-size:12.5px}
.gb-row{display:grid;grid-template-columns:minmax(0, 32%) minmax(0, 1fr);gap:10px;align-items:center;font-size:14px}
.gb-bars{display:flex;flex-direction:column;gap:2px}
.gb-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.gb-bar .bt{height:11px}
.gb-bar .bv{min-width:38px;font-size:13px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--s1)}
.legend i.s2{background:var(--s2)}
.cols{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--axis);padding-top:18px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.col i{display:block;width:min(24px, 70%);background:var(--s1);border-radius:4px 4px 0 0;min-height:0}
.col b{position:absolute;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:3px;line-height:1}
.col-l{display:flex;gap:2px;margin-top:6px}
.col-l span{flex:1;min-width:0;text-align:center;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.mini{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px}
.mini div{display:flex;flex-direction:column}
.mini b{font-size:24px;font-weight:800;line-height:1.1}
.mini span{font-size:12.5px;color:var(--ink2)}
.list{display:flex;flex-direction:column;max-height:360px;overflow:auto;border-top:1px solid var(--grid)}
.list-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--grid);font-size:14px}
.list-row .lt{min-width:0;overflow-wrap:anywhere}
.list-row .lm{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--field);color:var(--ink2);white-space:nowrap}
.pill.key{background:var(--s1-soft);color:var(--ink)}

/* questions editor */
.q-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--grid)}
.q-num{width:30px;height:30px;border-radius:9px;background:var(--field);display:grid;place-items:center;font-weight:800;font-size:13px}
.q-text b{display:block;font-size:15px;line-height:1.35}
.q-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.q-row.off .q-text{opacity:.55}
.q-act{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.editor{border:2px solid var(--ink);border-radius:16px;padding:18px;margin:14px 0;background:var(--surface)}
.editor .row2{display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr));gap:0 14px}
.editor-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.err-text{color:var(--crit-ink);font-weight:700;font-size:14px}

/* table */
.table-wrap{overflow-x:auto;border-top:1px solid var(--grid)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--grid);white-space:nowrap;vertical-align:middle}
th{font-size:12px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
td.num{font-variant-numeric:tabular-nums;text-align:right}
tr.sel td{background:var(--field)}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px, 100%);background:var(--surface);z-index:41;overflow-y:auto;padding:20px;box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.timeline{display:flex;flex-direction:column;font-size:13px}
.tl-row{display:grid;grid-template-columns:58px 120px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--grid)}
.tl-row .t{font-variant-numeric:tabular-nums;color:var(--ink2)}
.tl-row .y{font-weight:700}
.tl-row .d{color:var(--ink2);overflow-wrap:anywhere}

.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);font-size:13px;font-weight:600;padding:7px 10px;border-radius:8px;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.loading{opacity:.55;transition:opacity .2s}
.status.crit{color:var(--crit-ink)} .status.crit .dot{background:var(--crit);color:#fff}
.hyp-val small{font-size:14px;font-weight:600;color:var(--ink2);margin-left:10px}
.crit-txt{font-size:13px;color:var(--ink2);line-height:1.45}
.meter-l{gap:12px}
.meter-l span:last-child{white-space:nowrap}
.guide{align-self:start}
#p-start{max-width:260px}
.crit-txt .btn-link{min-height:0;padding:0;font-size:13px}
.biz-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 10px}
.biz-head h2{font-size:18px;font-weight:800}
.hyp-inline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-bottom:14px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:inline-flex;align-items:center;min-height:38px;padding:6px 12px;border-radius:10px;border:1px solid var(--axis);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.opt input:checked + span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opt input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
fieldset.field{border:0;padding:0;margin:14px 0 0;min-width:0}
fieldset.field legend{padding:0;margin-bottom:6px;line-height:1.4}
.guide{border:1px solid var(--border);border-radius:12px;padding:10px 14px;background:var(--page)}
.guide summary{font-weight:700;cursor:pointer;font-size:14px}
.guide ol{margin:10px 0 0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.copy{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.strip{display:flex;height:18px;border-radius:5px;overflow:hidden;background:var(--field);gap:1px;flex:1;min-width:0}
.strip i{display:block;min-width:2px}
.strip-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px;color:var(--ink2);margin-top:8px}
.tl-head{font-size:14px;font-weight:800;margin:18px 0 6px}
.tl4 .tl-row{grid-template-columns:70px 64px 150px minmax(0,1fr)}
.tl4 .t2{color:var(--muted);font-variant-numeric:tabular-nums}
.tl4 .d small{display:block;color:var(--muted);font-size:12px}
.tl4 .ev-klick .y,.tl4 .ev-frust_klick .y{color:var(--s1)}
.tl4 .ev-ansicht .y{color:var(--good-ink)}
.tl4 .ev-frust_klick .y,.tl4 .ev-leer_klick .y,.tl4 .ev-fehler .y{color:var(--crit-ink)}
td.heat{background:color-mix(in srgb, var(--s1) calc(var(--h) * 38%), transparent)}
td.hit{background:color-mix(in srgb, var(--good) 22%, transparent);font-weight:800}
td.wrapcell{white-space:normal;min-width:220px;max-width:420px}
.pill.warnp{background:color-mix(in srgb, var(--s2) 22%, transparent);color:var(--ink)}
.pill.okp{background:var(--s1-soft);color:var(--ink)}
.tr-lang{border:1px solid var(--border);border-radius:12px;padding:6px 14px 14px;margin-top:12px}
.tr-lang legend{font-weight:800;font-size:13px;padding:0 6px}
.seg-a{display:inline-flex;gap:4px;padding:4px;background:var(--field);border-radius:12px;margin-bottom:12px;flex-wrap:wrap}
.seg-a button{border:0;background:none;border-radius:9px;padding:7px 14px;font-weight:700;color:var(--ink2);min-height:38px}
.seg-a button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.amap{position:relative;height:440px;border-radius:14px;overflow:hidden;background:#e9eaec;border:1px solid var(--border);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.am-view,.am-layer{position:absolute;inset:0}
.am-tile{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none}
.am-mk{position:absolute;transform:translate(-50%,-50%);min-width:30px;height:30px;padding:0 6px;border-radius:10px;border:2px solid #fff;background:#2a78d6;color:#fff;font-weight:800;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:grab;touch-action:none}
.am-mk.est{background:#eb6834}
.am-mk.start{background:#0b0b0b;border-radius:50%;min-width:26px;height:26px}
.am-ctrl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.am-ctrl button{width:38px;height:38px;border-radius:10px;border:0;background:#fff;color:#0b0b0b;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.am-attr{position:absolute;right:0;bottom:0;font-size:11px;padding:2px 6px;background:rgba(255,255,255,.85);color:#333;text-decoration:none}
@media (max-width:640px){
  .bar-row{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}
  .bar-row .bl{grid-column:1 / -1}
  .gb-row{grid-template-columns:1fr}
  .q-row{grid-template-columns:auto minmax(0,1fr)}
  .q-act{grid-column:1 / -1;justify-content:flex-start}
  .tl-row{grid-template-columns:52px minmax(0,1fr)}
  .tl-row .d{grid-column:2}
  .tl4 .tl-row{grid-template-columns:64px minmax(0,1fr)}
  .tl4 .t2{display:none}
  .tl4 .d{grid-column:2}
  .hyp-inline{grid-template-columns:1fr}
  .card{padding:16px}
}
</style>
</head>

<div id="app"></div>

<script>
(function(){
'use strict';

/* ================= Konfiguration ================= */
const RAW = (window.CAMPI_CONFIG && typeof window.CAMPI_CONFIG === 'object') ? window.CAMPI_CONFIG : null;
function b64urlJSON(part){ try { let s = part.replace(/-/g, '+').replace(/_/g, '/'); while(s.length % 4) s += '='; return JSON.parse(decodeURIComponent(escape(atob(s)))); } catch(e){ return null; } }
function isSecretKey(k){ if(/^sb_secret_/i.test(k)) return true; if(/^eyJ/.test(k)){ const p = b64urlJSON(k.split('.')[1] || ''); return !!(p && p.role === 'service_role'); } return false; }
const CONF = (() => {
  const c = {url:'', key:'', problem:''};
  if(!RAW){ c.problem = 'fehlt'; return c; }
  const url = String(RAW.supabaseUrl || '').trim().replace(/\/+$/, '');

}
function csv(rows, cols){ return '﻿' + [cols.join(';')].concat(rows.map(r => cols.map(c => csvCell(r[c])).join(';'))).join('\r\n'); }

function pilotUsers(d){
  const users = new Map();

    let u = users.get(s.pilot_id);
    if(!u){ u = {id: s.pilot_id, sessions: [], opens: [], first: s._start, meta: s, installed: false, geo: false}; users.set(s.pilot_id, u); }
    u.sessions.push(s);
    if(!u.opens.length || s._start - u.opens[u.opens.length - 1] >= OPEN_GAP_MS) u.opens.push(s._start);
    if(s.installiert) u.installed = true;
    if(s.standort_freigabe) u.geo = true;
    u.last = s._start;
  });
  const start = pilotStart(), now = Date.now();
  users.forEach(u => {
    const base = start || startOfDay(u.first);
    u.base = base;
    u.week = [0, 0, 0]; u.opens.forEach(t => { const w = Math.floor((t - base) / (7 * DAY)); if(w >= 0 && w < 3) u.week[w]++; });
    u.eligible = start ? u.first < start + 7 * DAY : true;
    u.w2done = now >= base + 14 * DAY;
    u.inW2 = now >= base + 7 * DAY && now < base + 14 * DAY;
    u.ended = u.sessions.some(s => false);

  const runningYes = running.filter(u => u.week[1] >= 3).length;

}

function businessHyps(v){
  const d = S.data;
  /* H2a: alle Fragen, die im Fragenkatalog H2a zugeordnet sind. Eine Person zählt als Zustimmung,
     wenn mindestens eine ihrer Antworten auf diese Fragen als Zustimmung gilt. */
  const q2a = h2aQuestions(v);
  const testIds = new Set(v.sess.filter(isTest).map(s => s.id));
  const per = new Map();
  q2a.forEach(q => answersFor(v, q).forEach(x => { if(testIds.has(x.sitzung_id)) per.set(x.sitzung_id, per.get(x.sitzung_id) || h2aYes(q, x.wert)); }));
  const yes2a = [...per.values()].filter(Boolean).length;
  const c = {n: per.size, yes: yes2a, value: pct(yes2a, per.size), target: HYP.h2a.t, missing: !q2a.length};
  const jaText = q2a.length === 1 && q2a[0].typ !== 'skala' ? ' (' + (q2a[0].wertung.ja || []).map(o => '„' + o + '“').join(' oder ') + ')'
    : q2a.length === 1 ? ' (' + q2a[0].wertung.ab + ' oder höher auf der Skala)' : q2a.length > 1 ? ' (Zustimmung bei einer der ' + q2a.length + ' zugeordneten Fragen)' : '';
  const e = h2b(pilotUsers(d));
  return [
    {key:'h2a', tag:'H2a · Studierende', title:'Studierende würden die App herunterladen',
      crit:'Bestätigt, wenn mindestens 30 % der Studierenden im App-Test angeben, dass sie Campi installieren würden' + jaText + '.',
      value: c.value, target: c.target, yes: c.yes, n: c.n, state: c.missing ? 'missing' : (c.n < 10 ? 'few' : (c.value >= c.target ? 'ok' : 'fail')),
      foot: c.missing ? 'Keine Frage ist H2a zugeordnet. Unter „Fragen bearbeiten“ bei einer Frage „Zählt für H2a“ anhaken.' : c.n + ' Antworten · ' + c.yes + ' würden installieren' + (q2a.length > 1 ? ' · aus ' + q2a.length + ' Fragen' : ''), link:'fragebogen'},
    {key:'h2b', tag:'H2b · Pilotphase', title:'Pilotnutzer öffnen die App in Woche 2 mindestens 3-mal',
      crit:'Bestätigt, wenn mindestens 30 % der Pilotnutzer die App in der zweiten Woche des 3-wöchigen Pilots noch mindestens 3-mal öffnen.',
      value: e.value, target: e.target, yes: e.yes, n: e.n, state: e.n < 5 ? (e.running ? 'running' : 'few') : (e.value >= e.target ? 'ok' : 'fail'),
      foot: e.n + ' Pilotnutzer mit abgeschlossener Woche 2 · ' + e.yes + ' davon ≥ 3 Öffnungen' + (e.running ? ' · ' + e.running + ' noch im Pilot' : ''), link:'pilot'}
  ];
}
function bizStatus(h){
  const s = (cls, ic, txt) => '<span class="status ' + cls + '"><span class="dot">' + icon(ic) + '</span>' + txt + '</span>';
  switch(h.state){
    case 'ok': return s('good', 'check', 'Bestätigt');
    case 'ok-early': return s('good', 'check', 'Bestätigt (vorzeitig)');
    case 'fail': return s('crit', 'alert', 'Nicht bestätigt');
    case 'fail-early': return s('crit', 'alert', 'Nicht mehr erreichbar');
    case 'missing': return s('none', 'minus', 'Frage fehlt');
    case 'running': return s('none', 'minus', 'Pilot läuft');
    case 'few': return s('none', 'minus', 'Zu wenig Daten');
    default: return s('none', 'minus', 'Läuft');
  }
}

function personList(v){
  const map = new Map();
  v.sess.forEach(s => {
    const key = isPilot(s) && s.pilot_id ? 'P:' + s.pilot_id : 'S:' + s.id;
    let p = map.get(key);
    if(!p){ p = {key, pilot: key[0] === 'P', sessions: [], meta: s}; map.set(key, p); }
    p.sessions.push(s);
  });
  map.forEach(p => {
    p.sessions.sort((a, b) => a._start - b._start);
    p.first = p.sessions[0]._start; p.last = p.sessions[p.sessions.length - 1]._start;
    p.pages = {}; p.clicks = 0; p.active = 0; p.events = 0;
    p.sessions.forEach(s => (v.evBy[s.id] || []).forEach(e => {
      p.events++;
      if(e.typ === 'klick') p.clicks++;
      if(e.typ === 'ansicht_ende' && e.daten){ const b = pageBase(e.daten.ansicht), ms = Number(e.daten.dauer_ms) || 0; p.pages[b] = (p.pages[b] || 0) + ms; p.active += ms; }
    }));
    p.label = (p.pilot ? 'Pilot ' : 'Test ') + p.key.slice(2, 10) + ' · ' + dShort(p.first);
  });
  return Array.from(map.values()).sort((a, b) => b.last - a.last);
}
function stripHTML(s, evs){

  const total = segs.reduce((x, e) => x + Number(e.daten.dauer_ms), 0);

function ortCurrent(){
  const db = new Map((S.data.orte || []).map(o => [o.id, o]));
  return ESS.orte.map(o => { const r = db.get(o.id); return Object.assign({}, o, r ? {ll: [r.lat, r.lon], est: false, quelle: r.quelle, geaendert: r.geaendert, db: true} : {db: false}); });

function llToPxA(ll, z){ const s = 256 * Math.pow(2, z), lat = ll[0] * Math.PI / 180; return [(ll[1] + 180) / 360 * s, (1 - Math.log(Math.tan(lat) + 1 / Math.cos(lat)) / Math.PI) / 2 * s]; }
function pxToLLA(p, z){ const s = 256 * Math.pow(2, z), n = Math.PI - 2 * Math.PI * p[1] / s; return [180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))), p[0] / s * 360 - 180]; }
function distM(a, b){ const R = 6371000, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r; const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(s)); }
function amapInner(){

  }

  });

}

async function saveOrt(id, ll, quelle){
  const body = {id, lat: +ll[0].toFixed(6), lon: +ll[1].toFixed(6), quelle: quelle || 'manuell', geaendert: new Date().toISOString()};
  await api('orte?on_conflict=id', {method:'POST', body, prefer:'resolution=merge-duplicates,return=minimal'});
  const arr = S.data.orte || []; const i = arr.findIndex(o => o.id === id);
  if(i >= 0) arr[i] = body; else arr.push(body);
  S.data.orte = arr;
}
async function geocodeCampus(){
  const k = MAPZ.campus, cp = ESS.campus[k], cur = ortCurrent().filter(o => o.campus === k && o.id.split(':')[1] === 'b');
  const jobs = [];
  if(cp.plan){ Object.keys(cp.groups).forEach(g => jobs.push({addr: cp.groups[g].addr, group: g, ids: cur.filter(o => cp.parts[o.id.split(':')[2]] === g).map(o => o.id)})); }
  else { const seen = new Map(); cur.forEach(o => { if(!o.addr) return; if(!seen.has(o.addr)) seen.set(o.addr, {addr: o.addr, ids: []}); seen.get(o.addr).ids.push(o.id); }); jobs.push.apply(jobs, Array.from(seen.values())); }
  S.geo = {busy: true, done: 0, total: jobs.length, campus: k, results: null}; render();
  const results = [];
  for(const j of jobs){
    let ll = null, name = '';
    try {
      const u = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=de&accept-language=de&street=' + encodeURIComponent(j.addr) + '&postalcode=' + cp.plz + '&city=' + encodeURIComponent(cp.city);
      const r = await fetch(u, {headers: {'Accept': 'application/json'}});
      const a = await r.json();
      if(Array.isArray(a) && a.length){ ll = [Number(a[0].lat), Number(a[0].lon)]; name = a[0].display_name || ''; }
    } catch(e){}
    const members = cur.filter(o => j.ids.includes(o.id));
    const centroid = members.length ? [members.reduce((s, o) => s + o.ll[0], 0) / members.length, members.reduce((s, o) => s + o.ll[1], 0) / members.length] : null;
    results.push({addr: j.addr, ids: j.ids, ll, name: name.split(',').slice(0, 3).join(','), shift: ll && centroid ? distM(ll, centroid) : 0, centroid, pick: !!ll, plan: !!cp.plan});
    S.geo.done++; render();
    await new Promise(res => setTimeout(res, 1100));
  }
  S.geo = {busy: false, done: jobs.length, total: jobs.length, campus: k, results}; render();
}
async function applyGeocode(){
  const cur = new Map(ortCurrent().map(o => [o.id, o]));
  S.busy = true; render();
  try {
    for(const r of S.geo.results.filter(x => x.pick && x.ll)){
      if(r.plan){ const d = [r.ll[0] - r.centroid[0], r.ll[1] - r.centroid[1]]; for(const id of r.ids){ const o = cur.get(id); await saveOrt(id, [o.ll[0] + d[0], o.ll[1] + d[1]], 'adresse'); } }
      else for(const id of r.ids) await saveOrt(id, r.ll, 'adresse');
    }
    S.notice = 'Positionen übernommen. Die App nutzt sie ab dem nächsten Öffnen.'; S.geo = null;
  } catch(x){ S.error = 'Speichern hat nicht geklappt: ' + x.message; }
  S.busy = false; render();
}

let amDrag = null;
document.addEventListener('pointerdown', e => {
  const map = e.target.closest && e.target.closest('#amap'); if(!map || e.target.closest('.am-ctrl, .am-attr')) return;
  const mk = e.target.closest('.am-mk');
  amDrag = {x: e.clientX, y: e.clientY, id: e.pointerId, mk: mk ? mk.dataset.ort : null, el: mk, moved: false, pan0: MAPZ.pan.slice()};
  try { (mk || map).setPointerCapture(e.pointerId); } catch(x){}
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if(!amDrag || e.pointerId !== amDrag.id) return;
  const dx = e.clientX - amDrag.x, dy = e.clientY - amDrag.y;
  if(Math.abs(dx) + Math.abs(dy) > 3) amDrag.moved = true;
  if(amDrag.mk){ amDrag.el.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))'; }
  else { MAPZ.pan = [amDrag.pan0[0] + dx, amDrag.pan0[1] + dy]; const l = $('am-layer'); if(l) l.style.transform = 'translate(' + MAPZ.pan[0] + 'px,' + MAPZ.pan[1] + 'px)'; }
});
async function amEnd(e){
  if(!amDrag || (e && e.pointerId !== amDrag.id)) return;
  const d = amDrag; amDrag = null;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if(d.mk){
    if(!d.moved) return;
    const o = ortCurrent().find(x => x.id === d.mk); if(!o) return;
    const p = llToPxA(o.ll, MAPZ.z), ll = pxToLLA([p[0] + dx, p[1] + dy], MAPZ.z);
    try { await saveOrt(o.id, ll, 'manuell'); S.notice = o.label + ' verschoben (' + nf(distM(o.ll, ll), 0) + ' m) und gespeichert.'; }
    catch(x){ S.error = 'Speichern hat nicht geklappt: ' + x.message; }
    render();
  } else if(d.moved){
    const c = llToPxA(MAPZ.center, MAPZ.z); MAPZ.center = pxToLLA([c[0] - MAPZ.pan[0], c[1] - MAPZ.pan[1]], MAPZ.z); MAPZ.pan = [0, 0];
    const v = $('am-view'); if(v) v.innerHTML = amapInner();
  }
}

/* ---------- Löschen mit Kennwort ----------
   Teilnahmen, Ereignisse, Antworten und Interviews lassen sich nur über die Datenbankfunktion daten_loeschen löschen.
   Sie prüft das Lösch-Kennwort (gespeichert ist nur ein Hash) und sperrt nach 5 Fehlversuchen für 15 Minuten. */
S.pw = null;
S.del = {v3: null, gesetzt: null, protokoll: null, bereich: 'test', bis: '', ziel: '', fehler: '', busy: false, change: false};
const DEL_ERR = {kennwort: 'Das Kennwort stimmt nicht.', gesperrt: 'Zu viele falsche Versuche. Löschen ist für 15 Minuten gesperrt.',
  kein_kennwort: 'Es ist noch kein Lösch-Kennwort festgelegt.', kein_admin: 'Dieses Konto ist kein Admin.', zu_kurz: 'Das Kennwort braucht mindestens 8 Zeichen.',
  bereich: 'Unbekannter Bereich.', ziel: 'Es fehlt, was gelöscht werden soll.'};
const DEL_BEREICH = {test: 'Alle App-Test-Teilnahmen', pilot: 'Alle Pilot-Sitzungen', sitzungen: 'Alle Teilnahmen (App-Test und Pilot)', interviews: 'Interviews aus einer früheren Version',
  alles: 'Alles löschen', person: 'Eine Pilotperson (Pilot-Nummer)', sitzung: 'Eine Teilnahme', interview: 'Ein Interview',
  'kennwort gesetzt': 'Lösch-Kennwort festgelegt', 'kennwort geändert': 'Lösch-Kennwort geändert'};
const rpc = (f, body) => api('rpc/' + f, {method: 'POST', body: body || {}});
function delErr(x){
  const m = (x && x.message) || String(x);
  return /daten_loeschen|loeschkennwort|PGRST202|schema cache|could not find the function/i.test(m)
    ? 'Die Datenbank kennt das Löschen mit Kennwort noch nicht. Führe die neue supabase-setup.sql (Version 3) im Supabase SQL Editor aus.' : m;
}
function anzahlText(n){
  if(!n) return '';
  const parts = [];
  const add = (k, one, many) => { const x = Number(n[k]) || 0; if(x) parts.push(nf(x, 0) + ' ' + (x === 1 ? one : many)); };
  add('sitzungen', 'Sitzung', 'Sitzungen'); add('ereignisse', 'Ereignis', 'Ereignisse'); add('antworten', 'Antwort', 'Antworten');
  add('ergebnisse', 'Aufgaben-Ergebnis', 'Aufgaben-Ergebnisse'); add('interviews', 'Interview', 'Interviews');
  return parts.join(' · ');
}
function dDate(iso){ return iso ? new Date(iso + 'T12:00:00').toLocaleDateString('de-DE') : ''; }
async function loadDelState(){
  try { S.del.gesetzt = (await rpc('loeschkennwort_gesetzt')) === true; S.del.v3 = true; }
  catch(x){ S.del.v3 = false; S.del.gesetzt = null; }
  if(S.del.v3){ try { S.del.protokoll = await api('loeschprotokoll?select=*&order=zeit.desc&limit=20'); } catch(x){ S.del.protokoll = null; } }
  if(S.tab === 'daten' || S.pw) render();
}
function openDelete(bereich, ziel, bis){
  S.armed = '';
  const p = S.pw = {bereich, ziel: ziel || null, bis: bis || null, anzahl: null, fehler: '', busy: false, kw: ''};
  render();
  rpc('daten_loeschen', {kennwort: null, bereich, bis: p.bis, ziel: p.ziel, nur_zaehlen: true}).then(r => {
    if(S.pw !== p) return;
    if(r && r.ok){ p.anzahl = r.anzahl; if(typeof r.kennwort_gesetzt === 'boolean'){ S.del.gesetzt = r.kennwort_gesetzt; S.del.v3 = true; } }
    else p.fehler = DEL_ERR[r && r.fehler] || 'Zählen hat nicht geklappt.';
    render();
  }).catch(x => { if(S.pw === p){ p.fehler = delErr(x); render(); } });
}

async function submitDelete(){
  const p = S.pw; if(!p || p.busy) return;
  if(!p.kw){ p.fehler = 'Bitte das Lösch-Kennwort eingeben.'; render(); return; }
  p.busy = true; p.fehler = ''; render();
  try {
    const r = await rpc('daten_loeschen', {kennwort: p.kw, bereich: p.bereich, bis: p.bis, ziel: p.ziel, nur_zaehlen: false});
    if(!r || !r.ok){
      p.busy = false; p.kw = ''; p.fehler = DEL_ERR[r && r.fehler] || 'Löschen hat nicht geklappt.';
      if(r && r.fehler === 'kein_kennwort') S.del.gesetzt = false;
      render(); return;
    }
    S.pw = null; S.error = '';
    S.notice = 'Gelöscht: ' + (anzahlText(r.anzahl) || 'nichts') + '.';
    const d = S.data;
    if(p.bereich === 'sitzung' && d){
      d.sitzungen = d.sitzungen.filter(s => s.id !== p.ziel); d.ergebnisse = d.ergebnisse.filter(x => x.sitzung_id !== p.ziel);
      d.antworten = d.antworten.filter(a => a.sitzung_id !== p.ziel); d.ereignisse = d.ereignisse.filter(e => e.sitzung_id !== p.ziel);
      if(S.detail === p.ziel) S.detail = null;
      render(); loadDelState();
    } else if(p.bereich === 'interview' && d && d.interviews){
      d.interviews = d.interviews.filter(x => x.id !== p.ziel); render(); loadDelState();
    } else loadData();
  } catch(x){ p.busy = false; p.fehler = delErr(x); render(); }
}

    '</tbody></table></div>' : '<p class="note">Noch nichts gelöscht.</p>');
  return html + '</section>';

async function submitSetPw(f, change){
  const D = S.del, neu = f.neu.value, wdh = f.wdh.value, alt = change ? f.alt.value : null;
  D.fehler = '';
  if(change && !alt) D.fehler = 'Bitte das bisherige Kennwort eingeben.';
  else if(neu.length < 8) D.fehler = 'Das neue Kennwort braucht mindestens 8 Zeichen.';
  else if(neu !== wdh) D.fehler = 'Die beiden Eingaben stimmen nicht überein.';
  if(D.fehler){ render(); return; }
  D.busy = true; render();
  try {
    const r = await rpc('loeschkennwort_setzen', {neu, alt});
    if(r && r.ok){ D.gesetzt = true; D.change = false; S.notice = change ? 'Lösch-Kennwort geändert.' : 'Lösch-Kennwort festgelegt. Ab jetzt lassen sich Daten nur noch damit löschen.'; loadDelState(); }
    else D.fehler = DEL_ERR[r && r.fehler] || 'Speichern hat nicht geklappt.';
  } catch(x){ D.fehler = delErr(x); }
  D.busy = false; render();
}
function submitPlan(f){
  const D = S.del; D.fehler = '';
  D.bereich = f.bereich.value; if(f.bis) D.bis = f.bis.value; if(f.ziel) D.ziel = f.ziel.value.trim();
  if(D.bereich === 'person'){
    const q = D.ziel.toLowerCase().replace(/[^0-9a-f-]/g, '');
    const ids = [...new Set(((S.data && S.data.sitzungen) || []).map(s => s.pilot_id).filter(Boolean))].filter(x => x.startsWith(q));
    if(q.length < 8){ D.fehler = 'Bitte mindestens die ersten 8 Zeichen der Pilot-Nummer eingeben.'; render(); return; }
    if(ids.length !== 1){ D.fehler = ids.length ? 'Die Nummer passt zu mehreren Personen. Bitte mehr Zeichen eingeben.' : 'Keine Pilotperson mit dieser Nummer gefunden.'; render(); return; }
    openDelete('person', ids[0]); return;

function extClick(a, b){
  const id = b.dataset.id;
  switch(a){
    case 'p-del': openDelete(id.slice(0, 2) === 'P:' ? 'person' : 'sitzung', id.slice(2)); return true;
    case 'pw-close': if(!(S.pw && S.pw.busy)){ S.pw = null; render(); } return true;
    case 'pw-goto': S.pw = null; S.tab = 'daten'; saveUI(); render(); window.scrollTo(0, 0); { const i = $('pw-neu'); if(i) i.focus(); } return true;
    case 'pw-change': S.del.change = !S.del.change; S.del.fehler = ''; render(); { const i = $('pw-alt'); if(i) i.focus(); } return true;
    case 'person': S.person = id; S.tab = 'personen'; saveUI(); render(); window.scrollTo(0, 0); return true;
    case 'csv-person': exportPerson(view()); return true;
    case 'csv-matrix': exportMatrix(view()); return true;
    case 'csv-pilot': exportPilot(); return true;
    case 'xlsx-all': exportXlsx(false); return true;
    case 'xlsx-ext': exportXlsx(true); return true;
    case 'copy': try { navigator.clipboard.writeText(b.dataset.text); S.notice = 'Link kopiert.'; } catch(x){ S.notice = 'Bitte den Link markieren und kopieren.'; } render(); return true;
    case 'orte-campus': MAPZ.campus = id; MAPZ.center = ESS.campus[id].center.slice(); MAPZ.z = 17; MAPZ.pan = [0, 0]; render(); return true;
    case 'am-zoom': MAPZ.z = Math.max(14, Math.min(19, MAPZ.z + Number(id))); { const v = $('am-view'); if(v) v.innerHTML = amapInner(); } return true;
    case 'geocode': if(!(S.geo && S.geo.busy)) geocodeCampus(); return true;
    case 'geo-apply': applyGeocode(); return true;
    case 'geo-clear': S.geo = null; render(); return true;
    case 'ort-reset': (async () => { try { await api('orte?id=eq.' + encodeURIComponent(id), {method:'DELETE', prefer:'return=minimal'}); S.data.orte = S.data.orte.filter(o => o.id !== id); S.notice = 'Auf die Schätzung zurückgesetzt.'; } catch(x){ S.error = x.message; } render(); })(); return true;
    case 'ort-here':
      if(!navigator.geolocation){ S.error = 'Dieses Gerät kann seinen Standort nicht bestimmen.'; render(); return true; }
      S.notice = 'Standort wird bestimmt …'; render();
      navigator.geolocation.getCurrentPosition(async p => { try { await saveOrt(id, [p.coords.latitude, p.coords.longitude], 'vor ort'); S.notice = 'Auf deinen Standort gesetzt (± ' + Math.round(p.coords.accuracy) + ' m).'; } catch(x){ S.error = x.message; } render(); },
        err => { S.notice = ''; S.error = err && err.code === 1 ? 'Standortzugriff wurde abgelehnt.' : 'Standort konnte nicht bestimmt werden.'; render(); }, {enableHighAccuracy:true, timeout:20000});
      return true;
  }
  return false;
}

/* ================= Excel-Export: alle Daten, Dashboard mit Diagrammen, Erklärungen =================

const XL_PAL = ['2A78D6', 'EB6834', '1BAF7A', 'EDA100', 'E87BA4', '008300', '6250D6', 'E34948'];
const XL_REF = '9AA3B5';
const XL_DATE = s => s === 'dt' || s === 'date';
const xlLines = (t, per) => Math.max(1, Math.ceil(String(t || '').length / per));

const xlJN = b => b ? 'ja' : 'nein';

function xlRaw(x, s){ if(x && typeof x === 'object') x = x.v; if(XL_DATE(s) && typeof x === 'number') return XLW.serial(x); return x === undefined ? null : x; }
function xlCell(x, s){
  if(x === null || x === undefined || x === '') return null;
  if(typeof x === 'object') return (x.s || !s) ? x : Object.assign({s}, x);
  if(XL_DATE(s) && typeof x === 'number') return {v: x, t: 'd', s};
  return s ? {v: x, s} : x;
}

/* ---------- data table: columns with explanations, rows, formula helpers ---------- */
function xTable(name, cols, about){
  const mk = c => ({k: c[0], h: c[1], w: c[2] || 12, s: c[3] || null, d: c[4] || ''});
  const t = {name, about, cols: cols.map(mk), data: []};
  let idx = {};
  const reindex = () => { idx = {}; t.cols.forEach((c, i) => idx[c.k] = i); };
  reindex();
  t.push = c => { t.cols.push(mk(c)); reindex(); };
  t.c = k => { if(!(k in idx)) throw new Error('Spalte „' + k + '“ fehlt im Blatt ' + name); return idx[k]; };
  t.L = k => XLW.col(t.c(k));
  t.add = o => { t.data.push(t.cols.map(c => { const x = o[c.k]; return x === undefined || x === '' ? null : x; })); return t.data.length - 1; };
  t.val = (r, k) => { const i = t.c(k); return xlRaw(t.data[r][i], t.cols[i].s); };
  t.range = k => { const i = t.c(k); return XLW.abs(name, i, 1, i, Math.max(1, t.data.length)); };
  t.sheet = tab => ({name, tab, freeze: 1, cols: t.cols.map(c => c.w), heights: {0: 40},
    filter: 'A1:' + XLW.cell(t.cols.length - 1, Math.max(1, t.data.length)),
    rows: [t.cols.map(c => ({v: c.h, s: 'head'}))].concat(t.data.map(r => r.map((x, i) => xlCell(x, t.cols[i].s))))});
  return t;
}
/* conditions: [column, value] with value = text (equal, ignoring case), number (equal) or {op, n} (comparison) */
function xlMatch(x, c){
  if(c && typeof c === 'object'){ if(typeof x !== 'number') return false; switch(c.op){ case '>=': return x >= c.n; case '>': return x > c.n; case '<=': return x <= c.n; case '<': return x < c.n; } return false; }
  if(typeof c === 'number') return typeof x === 'number' && x === c;
  return typeof x === 'string' && x.toLowerCase() === String(c).toLowerCase();
}
function xlRows(t, conds){ const out = []; for(let r = 0; r < t.data.length; r++) if(conds.every(([k, c]) => xlMatch(t.val(r, k), c))) out.push(r); return out; }
const xlLit = s => '"' + String(s).replace(/"/g, '""') + '"';
const xlCrit = c => typeof c === 'number' ? String(c) : (c && typeof c === 'object') ? xlLit(c.op + c.n) : xlLit(c);
/* COUNTIFS reads some texts as numbers, dates, wildcards or operators. Such texts are compared with SUMPRODUCT instead. */
const XL_SAFE = /^[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ .,()·\-–&'_]*$/;
const xlSafe = conds => conds.every(([k, c]) => typeof c !== 'string' || (XL_SAFE.test(c) && !/^(wahr|falsch|true|false)$/i.test(c) && c.length < 200));
function xlCnt(t, conds){
  const v = xlRows(t, conds).length;
  if(xlSafe(conds)) return {f: 'COUNTIFS(' + conds.map(([k, c]) => t.range(k) + ',' + xlCrit(c)).join(',') + ')', v};
  const terms = [];
  conds.forEach(([k, c]) => { const R = t.range(k);
    if(c && typeof c === 'object') terms.push('ISNUMBER(' + R + ')', '(' + R + c.op + c.n + ')');
    else terms.push('(' + R + '=' + (typeof c === 'number' ? c : xlLit(c)) + ')'); });
  return {f: 'SUMPRODUCT(' + terms.join('*') + (terms.length === 1 ? '*1' : '') + ')', v};
}
function xlAvg(t, valK, conds){
  const c2 = conds.concat([[valK, {op: '>=', n: 0}]]);
  if(!xlSafe(conds)) throw new Error('xlAvg: Bedingung nicht eindeutig');
  const rows = xlRows(t, c2), v = rows.length ? rows.reduce((s, r) => s + t.val(r, valK), 0) / rows.length : 0;
  const crit = c2.map(([k, c]) => t.range(k) + ',' + xlCrit(c)).join(',');
  return {f: 'IF(COUNTIFS(' + crit + ')=0,0,AVERAGEIFS(' + t.range(valK) + ',' + crit + '))', v};
}
function xlSumIf(t, valK, conds){
  const rows = xlRows(t, conds);
  return {f: 'SUMIFS(' + t.range(valK) + ',' + conds.map(([k, c]) => t.range(k) + ',' + xlCrit(c)).join(',') + ')', v: rows.reduce((s, r) => s + (typeof t.val(r, valK) === 'number' ? t.val(r, valK) : 0), 0)};
}
function xlCountA(t, k){ let v = 0; for(let r = 0; r < t.data.length; r++){ const x = t.val(r, k); if(x !== null && x !== '') v++; } return {f: 'COUNTA(' + t.range(k) + ')', v}; }
function xlSum(t, k){ let v = 0; for(let r = 0; r < t.data.length; r++){ const x = t.val(r, k); if(typeof x === 'number') v += x; } return {f: 'SUM(' + t.range(k) + ')', v}; }
function xlMedian(t, k){ const a = []; for(let r = 0; r < t.data.length; r++){ const x = t.val(r, k); if(typeof x === 'number') a.push(x); } const m = median(a); return {f: 'IFERROR(MEDIAN(' + t.range(k) + '),"–")', v: m === null ? '–' : m}; }
const xlShare = (a, b) => ({f: 'IF(' + b.f + '=0,0,' + a.f + '/' + b.f + ')', v: b.v ? a.v / b.v : 0});
const xlS = (x, s) => Object.assign({}, x, {s});
function xlGroup(t, k, conds, top){
  const m = new Map();
  xlRows(t, conds || []).forEach(r => { const x = t.val(r, k); if(x === null || x === '') return; const key = String(x).toLowerCase(); const o = m.get(key) || {label: String(x), n: 0}; o.n++; m.set(key, o); });
  return Array.from(m.values()).sort((a, b) => b.n - a.n || a.label.localeCompare(b.label, 'de')).slice(0, top || 1e9);

/* fixed order first, then everything else that occurs */
function xlCats(fixed, groups){ const seen = new Set(fixed.map(x => x.toLowerCase())); return fixed.concat(groups.map(g => g.label).filter(l => !seen.has(l.toLowerCase()) && seen.add(l.toLowerCase()))); }

/* ---------- sheet with the tables behind the charts ---------- */
function xlChartData(){
  const sh = {name: 'Diagrammdaten', rows: [], merges: [], heights: {}, cols: [42, 16, 16, 16, 16, 16], tab: XL_REF};
  sh.rows.push([{v: 'Diagrammdaten', s: 'title'}]); sh.heights[0] = 24;
  sh.rows.push([{v: 'Die Tabellen, aus denen die Diagramme im Dashboard gezeichnet werden. Alle Werte sind Formeln auf die Datenblätter: Änderst du dort etwas, rechnen sich Tabellen und Diagramme neu.', s: 'desc'}]); sh.merges.push('A2:F2'); sh.heights[1] = 28;
  sh.rows.push([]);
  sh.table = (title, note, head) => {
    const r0 = sh.rows.length;
    sh.rows.push([{v: title, s: 'section'}]); sh.heights[r0] = 20;
    sh.rows.push([{v: note, s: 'desc'}]); sh.merges.push('A' + (r0 + 2) + ':F' + (r0 + 2)); sh.heights[r0 + 1] = xlLines(note, 125) * 12 + 4;
    sh.rows.push(head.map(h => ({v: h, s: 'head'}))); sh.heights[r0 + 2] = 28;
    const t = {title, note, head, hr: r0 + 2, first: r0 + 3, n: 0, cats: [], vals: head.map(() => [])};
    t.row = (cat, cells) => { const r = sh.rows.length; sh.rows.push([{v: cat}].concat(cells)); t.cats.push(cat); cells.forEach((c, i) => t.vals[i + 1].push(c && typeof c === 'object' ? c.v : c)); t.n++; return r; };
    t.ref = (ci, i) => XLW.cell(ci, t.first + i);
    t.done = () => { if(!t.n) t.row('(keine Daten)', head.slice(1).map(() => ({v: 0, s: 'int'}))); sh.rows.push([]); return t; };
    t.chart = o => Object.assign({src: 'Blatt Diagrammdaten, Tabelle „' + title + '“'}, o, {cats: t.cats.map(String), catRef: XLW.abs(sh.name, 0, t.first, 0, t.first + t.n - 1),
      series: o.cols.map((ci, k) => ({name: head[ci], nameRef: XLW.abs(sh.name, ci, t.hr), valRef: XLW.abs(sh.name, ci, t.first, ci, t.first + t.n - 1), vals: t.vals[ci], color: (o.colors || XL_PAL)[k]}))});

function xlChartRows(ch){
  if(ch.type !== 'bar') return ch.wide ? 16 : 15;
  return Math.min(32, Math.max(14, Math.round(6 + ch.cats.length * (ch.series.length > 1 ? 1.9 : 1.3))));

/* ---------- dashboard ---------- */
function xlDashboard(meta, kpis, sections){
  const sh = {name: 'Dashboard', rows: [], merges: [], heights: {}, charts: [], grid: false, tab: XL_PAL[0], fit: 'portrait',
    cols: [2.5, 10.5, 10.5, 10.5, 10.5, 2.5, 10.5, 10.5, 10.5, 10.5, 2.5, 10.5, 10.5, 10.5, 10.5, 2.5, 10.5, 10.5, 10.5, 10.5]};
  const put = (r, c, x) => { while(sh.rows.length <= r) sh.rows.push([]); sh.rows[r][c] = x; };
  const box = (r, c1, c2, x, s) => { put(r, c1, Object.assign(typeof x === 'object' && x !== null ? Object.assign({}, x) : {v: x}, {s})); for(let c = c1 + 1; c <= c2; c++) put(r, c, {v: '', s}); if(c2 > c1) sh.merges.push(XLW.cell(c1, r) + ':' + XLW.cell(c2, r)); };
  put(0, 1, {v: meta.title, s: 'big'}); sh.heights[0] = 30;
  box(1, 1, 19, meta.sub, 'desc'); sh.heights[1] = xlLines(meta.sub, 175) * 12 + 4;
  box(2, 1, 19, meta.how, 'note'); sh.heights[2] = xlLines(meta.how, 175) * 12 + 6;
  let r = 4;
  const starts = [1, 6, 11, 16];
  for(let i = 0; i < kpis.length; i += 4){
    kpis.slice(i, i + 4).forEach((k, j) => { const c = starts[j];
      box(r, c, c + 3, k.label, 'kpiLabel'); box(r + 1, c, c + 3, k.cell, k.style); box(r + 2, c, c + 3, k.sub, 'kpiLabel'); });
    sh.heights[r] = 18; sh.heights[r + 1] = 34; sh.heights[r + 2] = 26;
    r += 4;
  }
  sections.forEach(sec => {
    if(!sec.charts.length) return;
    r += 1;
    put(r, 1, {v: sec.title, s: 'section'}); sh.heights[r] = 22; r++;
    if(sec.desc){ box(r, 1, 19, sec.desc, 'desc'); sh.heights[r] = xlLines(sec.desc, 175) * 12 + 4; r++; }
    r++;
    const list = sec.charts.slice();
    while(list.length){
      const a = list.shift(), pair = [a];
      if(!a.wide && list.length && !list[0].wide) pair.push(list.shift());
      const h = Math.max.apply(null, pair.map(xlChartRows));
      const lines = Math.max.apply(null, pair.map(ch => xlLines('Was zeigt das? ' + ch.note, ch.wide ? 170 : 82)));
      pair.forEach((ch, j) => {
        const c1 = ch.wide ? 1 : (j ? 11 : 1), c2 = ch.wide ? 20 : (j ? 20 : 10);
        ch.at = [c1, r, c2, r + h]; sh.charts.push(ch);
        box(r + h, c1, c2 - 1, 'Was zeigt das? ' + ch.note, 'note');
      });
      sh.heights[r + h] = lines * 12.5 + 8;
      r += h + 2;
    }
  });
  return sh;
}

    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'campi-auswertung-' + (ext ? 'erweitert-' : '') + new Date().toISOString().slice(0, 10) + '.xlsx';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
    S.notice = ext ? 'Die erweiterte Excel-Datei ist fertig: zusätzlich IP-Adressen, Tipp-Heatmaps, Scrollen, Eingaben und Technik.' : 'Die Excel-Datei ist fertig: Dashboard mit Diagrammen, Erklärungen und alle Daten.';
  } catch(e){ S.notice = ''; S.error = 'Die Excel-Datei konnte nicht erstellt werden: ' + e.message; }
  S.xlBusy = false; render();
}

/* ================= Darstellung ================= */
function render(){
  const app = $('app');
  const scrollY = window.scrollY;
  let body = '';
  const top = (right) => '<header class="top"><div class="brand"><span class="mark" aria-hidden="true">C</span><div><h1>Campi · Auswertung</h1><p>Hypothesen, App-Test und Pilotphase</p></div></div><div class="top-actions">' + (right || '') + '</div></header>';
  if(CONF.problem){
    const msg = {
      fehlt: 'Die Datei <span class="code">config.js</span> wurde nicht gefunden. Lade sie zusammen mit dieser Seite in dein GitHub-Repository.',
      url: 'In <span class="code">config.js</span> fehlt deine Supabase-Adresse (supabaseUrl), z. B. <span class="code">https://abcdefgh.supabase.co</span>.',
      key: 'In <span class="code">config.js</span> fehlt der publishable oder anon key (supabaseKey).',
      secret: 'In <span class="code">config.js</span> steht ein <b style="display:inline">geheimer Schlüssel</b> (secret oder service_role). Dieser Schlüssel darf niemals öffentlich sein. Ersetze ihn durch den publishable oder anon key und erzeuge den geheimen Schlüssel in Supabase sofort neu (Project Settings › API Keys).'
    }[CONF.problem];
    app.innerHTML = '<div class="wrap">' + top() + '<div class="alert err"><b>Einrichtung unvollständig</b>' + msg + '</div></div>';
    return;
  }
  if(!S.auth){
    app.innerHTML = '<div class="wrap">' + top('<a class="btn-link" href="index.html">Zur Testseite</a>') +
      '<form class="card login" data-form="login" novalidate><h2>Anmelden</h2><p class="sub">Mit dem Benutzer, den du in Supabase unter Authentication › Users angelegt hast.</p>' +
      '<div class="field"><label for="l-mail">E-Mail</label><input class="input" id="l-mail" name="email" type="email" autocomplete="username" required value="' + esc(S.loginEmail || '') + '"></div>' +
      '<div class="field"><label for="l-pw">Passwort</label><input class="input" id="l-pw" name="password" type="password" autocomplete="current-password" required></div>' +
      (S.loginError ? '<p class="err-text" role="alert" style="margin-top:12px">' + esc(S.loginError) + '</p>' : '') +
      '<button class="btn" type="submit" style="margin-top:18px;width:100%"' + (S.loginBusy ? ' disabled' : '') + '>' + (S.loginBusy ? 'Anmelden …' : 'Anmelden') + '</button></form></div>';
    return;
  }
  const right = (S.data && S.admin ? '<button class="btn btn-2 btn-sm" type="button" data-a="xlsx-all"' + (S.xlBusy ? ' disabled' : '') + ' title="Standard: Dashboard mit Diagrammen, Erklärungen und alle Datenarten bis Version 8">' + icon('down2') + 'Excel</button><button class="btn btn-2 btn-sm" type="button" data-a="xlsx-ext"' + (S.xlBusy ? ' disabled' : '') + ' title="Erweitert: zusätzlich IP-Adressen, Tipp-Positionen, Scrollen, Eingaben und Technik">' + icon('down2') + 'Excel erweitert</button>' : '') + '<span>' + esc(S.auth.email) + '</span><a class="btn-link" href="index.html" target="_blank" rel="noopener">Zur Testseite</a><button class="btn-link" type="button" data-a="logout">Abmelden</button>';
  if(S.admin === null){ app.innerHTML = '<div class="wrap">' + top(right) + '<p class="note">Einen Moment …</p></div>'; return; }
  if(S.admin === false){
    app.innerHTML = '<div class="wrap">' + top(right) + '<div class="alert err"><b>Kein Admin-Zugang</b>' + (S.error ? esc(S.error) + '<br>' : '') +
      'Das Konto <b style="display:inline">' + esc(S.auth.email) + '</b> ist nicht als Admin eingetragen. Führe im Supabase SQL Editor aus:<br><span class="code">insert into public.admins (email) values (\'' + esc(S.auth.email.toLowerCase()) + '\');</span><br>Danach diese Seite neu laden.</div></div>';
    return;
  }
  const v = view();
  const tabs = [['uebersicht','Übersicht'],['pilot','Pilot'],['personen','Personen'],['aufgaben','Aufgaben'],['verhalten','Verhalten'],['fragebogen','Fragebogen'],['fragen','Fragen bearbeiten'],['orte','Orte'],['daten','Daten']];
  const f = S.filter;
  const sel = (name, opts) => '<select name="' + name + '" aria-label="' + ({zeit:'Zeitraum', geraet:'Gerät', gruppe:'Gruppe', modus:'Art'})[name] + '">' + opts.map(o => '<option value="' + o[0] + '"' + (String(f[name]) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>';
  body += '<div class="tabs" role="tablist">' + tabs.map(t => '<button class="tab" role="tab" type="button" data-a="tab" data-t="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>').join('') + '</div>';
  if(!['fragen','pilot','orte'].includes(S.tab)) body += '<div class="filters" data-form="filter">' + sel('zeit', [['alle','Gesamter Zeitraum'],['heute','Heute'],['7','Letzte 7 Tage'],['30','Letzte 30 Tage']]) +
    sel('modus', [['alle','Test und Pilot'],['test','Nur App-Test'],['pilot','Nur Pilot']]) +
    sel('geraet', [['alle','Alle Geräte'],['Handy','Handy'],['Tablet','Tablet'],['Computer','Computer']]) + sel('gruppe', [['alle','Beide Gruppen'],['mit Quelle','Gruppe mit Quelle'],['ohne Quelle','Gruppe ohne Quelle']]) +
    '<label class="check"><input type="checkbox" name="fertig"' + (f.fertig ? ' checked' : '') + '>Nur abgeschlossene</label><span class="spacer"></span>' +
    '<label class="check"><input type="checkbox" name="auto"' + (S.auto ? ' checked' : '') + '>Alle 30 s aktualisieren</label>' +
    '<button class="btn btn-2 btn-sm" type="button" data-a="reload"' + (S.loading ? ' disabled' : '') + '>' + icon('refresh') + (S.loading ? 'Lädt …' : 'Aktualisieren') + '</button>' +
    (S.loadedAt ? '<span class="loaded">Stand ' + S.loadedAt.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit', second:'2-digit'}) + '</span>' : '') + '</div>';
  if(S.error) body += '<div class="alert err" style="margin-bottom:16px"><b>Fehler</b>' + esc(S.error) + '</div>';
  if(S.notice) body += '<div class="alert" style="margin-bottom:16px" role="status">' + esc(S.notice) + '</div>';
  if(!v){ body += '<p class="note">Daten werden geladen …</p>'; }
  else if(S.tab === 'uebersicht') body += viewOverview(v);
  else if(S.tab === 'aufgaben') body += viewTasks(v);
  else if(S.tab === 'verhalten') body += viewBehavior(v);
  else if(S.tab === 'fragebogen') body += viewSurvey(v);
  else if(S.tab === 'fragen') body += viewQuestions();
  else if(S.tab === 'daten') body += viewData(v);
  else if(S.tab === 'pilot') body += viewPilot();
  else if(S.tab === 'personen') body += viewPersons(v);
  else if(S.tab === 'orte') body += viewOrte();
  else body += viewOverview(v);
  app.innerHTML = '<div class="wrap' + (S.loading && S.data ? ' loading' : '') + '">' + top(right) + body + '</div>' + (S.detail && v ? detailHTML(v) : '') + (S.pw ? pwDialogHTML() : '');
  window.scrollTo(0, scrollY);
  afterRender();
}

/* ================= Aktionen ================= */
async function onLogin(form){
  const email = form.email.value.trim(), password = form.password.value;
  S.loginEmail = email;
  if(!email || !password){ S.loginError = 'Bitte E-Mail und Passwort eingeben.'; return render(); }
  S.loginBusy = true; S.loginError = ''; render();
  try { const j = await authCall('password', {email, password}); setAuth(j, email); S.loginBusy = false; await start(); }
  catch(e){ S.loginBusy = false; S.loginError = e.message; render(); }
}
async function start(){
  S.admin = null; S.error = ''; render();
  await checkAdmin(); render();
  if(S.admin) await loadData();
}
function editFrom(q){
  const w = q && q.wertung && q.wertung.hypothese === 'h2a' ? q.wertung : (q && !('wertung' in q) && q.schluessel === 'installieren' ? H2A_DEFAULT : null);
  return q ? {id: q.id, frage: q.frage, typ: q.typ, hinweis: q.hinweis || '', optionen: (q.optionen || []).join('\n'), skala_min: q.skala_min || '', skala_max: q.skala_max || '', pflicht: q.pflicht, aktiv: q.aktiv, uebersetzungen: q.uebersetzungen || {},
      h2a: !!w, h2aJa: w && Array.isArray(w.ja) ? w.ja.slice() : [], h2aAb: w && w.ab ? Number(w.ab) : 4}
  : {id: null, frage: '', typ: 'einfach', hinweis: '', optionen: '', skala_min: '', skala_max: '', pflicht: true, aktiv: true, uebersetzungen: {}, h2a: false, h2aJa: [], h2aAb: 4}; }
function readEditor(form){
  const e = S.edit;
  e.frage = form.frage.value; e.typ = form.typ.value; e.hinweis = form.hinweis.value;
  if(form.optionen) e.optionen = form.optionen.value;
  if(form.skala_min) e.skala_min = form.skala_min.value;
  if(form.skala_max) e.skala_max = form.skala_max.value;
  e.pflicht = form.pflicht.checked; e.aktiv = form.aktiv.checked;
  if(form.h2a){ e.h2a = form.h2a.checked; if(form.querySelector('#q-h2a-opts')) e.h2aJa = Array.from(form.querySelectorAll('input[name="h2a_ja"]:checked')).map(x => x.value); if(form.h2a_ab) e.h2aAb = Number(form.h2a_ab.value); }
  if(form.querySelector('.tr-lang')){ e.uebersetzungen = readTranslations(form); const det = form.querySelector('details'); e.trOpen = !!(det && det.open); }
}
async function saveQuestion(form){
  readEditor(form);
  const e = S.edit, choice = e.typ === 'einfach' || e.typ === 'mehrfach';
  const opts = Array.from(new Set(e.optionen.split('\n').map(x => x.trim()).filter(Boolean)));
  const err = !e.frage.trim() ? 'Bitte gib eine Frage ein.' : (choice && opts.length < 2) ? 'Bitte gib mindestens zwei Antwortmöglichkeiten ein, jede in einer eigenen Zeile.' : (opts.length > 20) ? 'Höchstens 20 Antwortmöglichkeiten.' : opts.some(o => o.length > 150) ? 'Eine Antwortmöglichkeit ist zu lang (höchstens 150 Zeichen).'
    : (e.h2a && e.typ === 'text') ? 'Freitext kann nicht für H2a zählen. Nimm das Häkchen bei „Zählt für H2a“ heraus oder wähle einen anderen Antworttyp.'
    : (e.h2a && choice && !(e.h2aJa || []).some(o => opts.includes(o))) ? 'Wähle unter „Auswertung“ mindestens eine Antwort, die als Zustimmung zählt.' : '';
  if(err){ S.editError = err; return render(); }
  const body = {frage: e.frage.trim().slice(0, 300), typ: e.typ, hinweis: e.hinweis.trim() || null, optionen: choice ? opts : [], skala_min: e.typ === 'skala' ? (e.skala_min.trim() || null) : null, skala_max: e.typ === 'skala' ? (e.skala_max.trim() || null) : null, pflicht: e.pflicht, aktiv: e.aktiv};
  if(S.data.v2) body.uebersetzungen = e.uebersetzungen || {};
  if(S.data.fragen.some(q => 'wertung' in q) || S.del.v3) body.wertung = !e.h2a ? null : e.typ === 'skala' ? {hypothese: 'h2a', ab: Number(e.h2aAb) || 4} : {hypothese: 'h2a', ja: (e.h2aJa || []).filter(o => opts.includes(o))};
  S.busy = true; S.editError = ''; render();
  try {
    if(e.id) await api('fragen?id=eq.' + encodeURIComponent(e.id), {method:'PATCH', body, prefer:'return=minimal'});
    else { body.position = S.data.fragen.reduce((m, q) => Math.max(m, q.position || 0), 0) + 1; await api('fragen', {method:'POST', body, prefer:'return=minimal'}); }
    await reloadQuestions(); S.edit = null; S.notice = 'Gespeichert. Die Frage gilt ab sofort für neue Tests.';
  } catch(x){ S.editError = 'Speichern hat nicht geklappt: ' + x.message; }
  S.busy = false; render();
}
async function moveQuestion(id, dir){
  const qs = S.data.fragen.slice(), i = qs.findIndex(q => q.id === id), j = i + dir;
  if(i < 0 || j < 0 || j >= qs.length) return;
  [qs[i], qs[j]] = [qs[j], qs[i]];
  S.busy = true; render();
  try {
    for(let k = 0; k < qs.length; k++){ if(qs[k].position !== k + 1) await api('fragen?id=eq.' + encodeURIComponent(qs[k].id), {method:'PATCH', body:{position: k + 1}, prefer:'return=minimal'}); }
    await reloadQuestions();
  } catch(x){ S.error = 'Die Reihenfolge konnte nicht gespeichert werden: ' + x.message; }
  S.busy = false; render();
}
async function toggleQuestion(id){
  const q = S.data.fragen.find(x => x.id === id); if(!q) return;
  S.busy = true; render();
  try { await api('fragen?id=eq.' + encodeURIComponent(id), {method:'PATCH', body:{aktiv: !q.aktiv}, prefer:'return=minimal'}); await reloadQuestions(); S.notice = q.aktiv ? 'Die Frage wird im Test nicht mehr gezeigt.' : 'Die Frage wird im Test wieder gezeigt.'; }
  catch(x){ S.error = 'Ändern hat nicht geklappt: ' + x.message; }
  S.busy = false; render();
}
async function deleteQuestion(id){
  S.busy = true; render();
  try { await api('fragen?id=eq.' + encodeURIComponent(id), {method:'DELETE', prefer:'return=minimal'}); await reloadQuestions(); S.notice = 'Frage gelöscht. Vorhandene Antworten bleiben unter „Fragebogen“ erhalten.'; }
  catch(x){ S.error = 'Löschen hat nicht geklappt: ' + x.message; }
  S.armed = ''; S.busy = false; render();
}
let armTimer = null;
function arm(key){ S.armed = key; clearTimeout(armTimer); armTimer = setTimeout(() => { if(S.armed === key){ S.armed = ''; render(); } }, 5000); render(); }

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if(!f) return;
  e.preventDefault();
  if(f.dataset.form === 'login') onLogin(f);
  if(f.dataset.form === 'q-save') saveQuestion(f);
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.closest('[data-form="filter"]')){
    if(t.name === 'auto'){ S.auto = t.checked; return; }
    S.filter[t.name] = t.type === 'checkbox' ? t.checked : t.value; saveUI(); S.notice = ''; render();
  }
  if(t.form && t.form.dataset.form === 'q-save' && t.name === 'typ'){ readEditor(t.form); S.editError = ''; render(); const s = $('q-typ'); if(s) s.focus(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if(a !== 'q-del' && a !== 's-del' && a !== 'iv-del' && S.armed){ S.armed = ''; }
  if(extClick(a, b)) return;
  switch(a){
    case 'tab': S.tab = b.dataset.t; S.notice = ''; S.error = ''; saveUI(); render(); window.scrollTo(0, 0); break;
    case 'reload': S.notice = ''; loadData(); break;
    case 'logout': fetch(CONF.url + '/auth/v1/logout', {method:'POST', headers: hdrs(S.auth && S.auth.access_token)}).catch(() => {}); logout(''); break;
    case 'q-new': S.edit = editFrom(null); S.editError = ''; S.notice = ''; render(); { const i = $('q-frage'); if(i) i.focus(); } break;
    case 'q-edit': S.edit = editFrom(S.data.fragen.find(q => q.id === id)); S.editError = ''; S.notice = ''; render(); { const i = $('q-frage'); if(i) i.focus(); } break;
    case 'q-cancel': S.edit = null; S.editError = ''; render(); break;
    case 'q-up': moveQuestion(id, -1); break;
    case 'q-down': moveQuestion(id, 1); break;
    case 'q-toggle': toggleQuestion(id); break;
    case 'q-del': if(S.armed === 'q:' + id) deleteQuestion(id); else arm('q:' + id); break;
    case 's-del': openDelete('sitzung', id); break;
    case 'detail': S.detail = id; render(); { const c = document.querySelector('.drawer [data-a="detail-close"]'); if(c) c.focus(); } break;
    case 'detail-close': S.detail = null; render(); break;
    case 'csv-sess': exportSessions(view()); break;
    case 'csv-ev': { const v = view(); download('campi-ereignisse-' + new Date().toISOString().slice(0, 10) + '.csv', csv(v.ev, ['sitzung_id','erstellt','zeitpunkt','zeit_ms','typ','schritt','ansicht','daten'])); break; }
    case 'csv-ans': { const v = view(); download('campi-antworten-' + new Date().toISOString().slice(0, 10) + '.csv', csv(v.ans, ['sitzung_id','erstellt','frage','typ','wert'])); break; }
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && S.detail){ S.detail = null; render(); } });
/* tooltip */
const tip = $('tip');
function showTip(el, x, y){
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2)) + 'px';
  tip.style.top = Math.max(8, y - h - 12) + 'px';
}
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if(el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener('pointerleave', () => { tip.hidden = true; });
const typing = () => { const a = document.activeElement; return !!(a && a.closest && a.closest('[data-keep]')); };
setInterval(() => { if(S.auto && S.admin && !S.loading && !S.edit && !S.ivEdit && !S.pw && !typing() && !amDrag && document.visibilityState === 'visible') loadData(); }, 30000);

/* ================= Start ================= */
render();
if(S.auth && !CONF.problem) start();
})();
</script>
