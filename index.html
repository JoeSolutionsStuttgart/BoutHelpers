const SW_SETS = {}; Object.keys(SW).forEach(l => SW_SETS[l] = new Set(SW[l].split(' ')));
function detectLang(q, fallback){
  const raw = String(q).toLowerCase(), n = fold(raw);
  const sc = {de:0, en:0, es:0, it:0, fr:0, tr:0};
  if(/[ğış]/.test(raw)) sc.tr += 3;
  if(/[ñ¿¡]/.test(raw)) sc.es += 3;
  if(/ß/.test(raw)) sc.de += 3;
  if(/[äöü]/.test(raw)){ sc.de += 1.5; sc.tr += 0.8; }
  if(/ç/.test(raw)){ sc.fr += 1; sc.tr += 1; }
  if(/[êâîôûœë]/.test(raw)) sc.fr += 2;
  if(/[èàù]/.test(raw)){ sc.it += 1; sc.fr += 1; }
  if(/[áíóú]/.test(raw)) sc.es += 1.5;
  if(/\b(qu|j|d|l|n|c|s)['’]/.test(raw)) sc.fr += 1.2;
  if(/\b(dell|all|dall|nell|un|l)['’]/.test(raw)) sc.it += 1;
  if(/[é]/.test(raw)){ sc.fr += 0.6; sc.es += 0.4; }
  if(/\bil y a\b|est-ce|c['’]est|j['’]ai|aujourd['’]hui|s['’]il|qu['’]on|m['’]inscrire/.test(raw)) sc.fr += 2;
  if(/c['’]è|dov['’]è|cos['’]è|qual è|ci sono|un['’]/.test(raw)) sc.it += 2;
  if(/\bhay\b|¿/.test(raw)) sc.es += 1;
  n.split(/[^a-z0-9]+/).filter(Boolean).forEach(w => LANGS.forEach(l => { if(SW_SETS[l].has(w)) sc[l] += 1; }));
  if(/\w(mi|mu|misin|miyim|dir|nerede)\b/.test(n) || /\b\w+(da|de|ta|te|dan|den)\b.*\?/.test(n) && sc.tr > 0) sc.tr += 0.5;
  const fb = fallback || LANG;
  let best = fb, top = sc[fb] || 0;
  LANGS.forEach(l => { if(sc[l] > top){ top = sc[l]; best = l; } });
  return top < 1 ? fb : best;
}

function fill(s, vars){ return s.replace(/\{(\w+)\}/g, (m, k) => vars[k] !== undefined ? vars[k] : m); }
function T(key, lang, vars){ return fill(L(TPL[key], lang), vars || {}); }
function capFirst(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function campusFromText(n){
  if(/stadtmitte|kanalstr|city cent|centro citta|centre ville|sehir merkezi/.test(n)) return 'SM';
  if(/flandern/.test(n)) return 'FL';
  if(/goppingen|goeppingen/.test(n)) return 'GP';
  return null;
}
function roomFromText(q, hay){
  const m = String(q).match(/(?:^|[^\w])(?:([sfg])\s?(\d{1,2})\s?[.,]?\s?(\d{3})|(\d{1,2})\s?[.,]\s?(\d{3}))(?!\d)/i);
  if(!m) return null;
  const nr = String(m[2] || m[4]).padStart(2, '0') + '.' + (m[3] || m[5]);
  const letter = m[1] ? m[1].toUpperCase() : null;
  const want = letter ? CAMPUS_IDS.find(k => CAMPUS[k].letter === letter) : (campusFromText(hay) || null);
  const hits = ROOM_LIST.filter(r => r.nr === nr && (!want || r.c === want));
  hits.sort((a, b) => (b.c === state.campus) - (a.c === state.campus));
  return {id: hits.length ? hits[0].id : null, code: (letter ? letter + ' ' : '') + nr};
}
function placeFromText(hay, prefer){
  const nameHit = r => r.name && LANGS.some(l => { const k = fold(L(r.name, l)).replace(/\s*\(.*\)$/, ''); return k.length >= 6 && hay.includes(k); });
  const cands = ROOM_LIST.filter(r => (r.al || []).some(a => hay.includes(fold(a))) || nameHit(r));
  const pc = prefer || state.campus;
  cands.sort((a, b) => (b.c === pc) - (a.c === pc));
  return cands.length ? cands[0].id : null;
}
function fromSentence(r, lang){
  const c = CAMPUS[r.c];
  const sId = r.c === state.campus && c.starts[state.start] ? state.start : c.defStart;
  const rt = routeTo(r.id, sId, state.bf);
  return T('from', lang, {from: L(c.starts[sId].name, lang), m: fmtDist(rt.meters, lang), min: rt.minutes});
}
function routeAnswer(r, lang, topic){
  const c = CAMPUS[r.c], h = roomHours(r, lang, ', ');
  const name = r.name && r.code ? roomName(r, lang) + ' · ' + r.code : roomName(r, lang);
  let text = T('place_at', lang, {name, campus: L(c.name, lang), where: roomWhere(r, lang)}) +
    ' ' + fromSentence(r, lang) + (h ? ' ' + T('hours', lang, {h}) : '');
  if(r.lib && r.c === 'SM') text += ' ' + T('lib_sm', lang);
  return {topic: topic || 'Raumsuche', ok:true, msg:{role:'bot', lang, text, source: L(r.lib ? SRC.library : SRC.rooms, lang), action:{act:'route', room:r.id, icon:'pin', label: t('show_route', null, lang)}}};
}
function placeAnswer(r, lang){
  if(r.id === 'SM-IC'){ const res = routeAnswer(r, lang, 'International'); res.msg.text += ' ' + T('intl', lang); res.msg.source = L(SRC.intl, lang); return res; }
  if(/-ASTA$/.test(r.id)){ const res = routeAnswer(r, lang, 'AStA'); res.msg.source = L(SRC.asta, lang); return res; }
  return routeAnswer(r, lang, r.lib ? 'Bibliothek' : 'Raumsuche');
}
function dishLine(d, lang){
  const k = d.k && !/^(haupt)?(gericht|essen|men(u|ü)|linie|ausgabe|theke|tagesgericht)(?=[\s\d.:-]|$)/i.test(d.k.de) ? L(d.k, lang) : '';
  const extra = [d.p ? euro(d.p, lang) : '', d.o ? t('counter', {n: d.o}, lang) : k].filter(Boolean).join(', ');
  return L(d.n, lang) + (extra ? ' (' + extra + ')' : '');
}
function mensaAnswer(c, lang, U){
  const msg = o => Object.assign({role:'bot', lang}, o);
  if(!c.mensa){
    const cf = c.cafes[0];
    return {topic:'Mensa', ok:true, msg: msg({text: L(c.mensaNote, lang) + ' ' + cf.name + ': ' + L(cf.offer, lang) + ' ' + T('hours', lang, {h: fmtOH(cf.open, lang, ', ')}) + ' ' + capFirst(L(HINT.temp_caf, lang)) + '.', source: L(SRC.mensa, lang), action:{act:'tab', tab:'mensa', icon:'cutlery', label: t('cafeteria', null, lang)}})};
  }
  const vegan = U.c.has('VEGAN'), veg = U.c.has('VEGGIE');
  const day = mensaDay(c, menuDate());
  const pool = (vegan || veg) ? day.dishes : mainDishes(day);
  const list = (vegan ? pool.filter(d => d.t === 'vegan') : veg ? pool.filter(d => d.t === 'vegan' || d.t === 'vegetarisch') : pool).slice(0, 5);
  const pre = T(WEEKEND ? 'mensa_weekend' : 'mensa_today', lang, {mensa: c.mensa.name});
  const body = list.length ? ' ' + list.map(d => dishLine(d, lang)).join('; ') + '.' : ' ' + (day.closed ? t('closed_day', null, lang) : day.missing ? t('no_menu_day', null, lang) : T('mensa_none', lang));
  return {topic:'Mensa', ok:true, msg: msg({text: pre + body + ' ' + T('serve', lang, {h: fmtOH(c.mensa.serve, lang, ', ')}), source: c.mensa.live ? t('mensa_src_live', {stand: standText(lang, 'mensa')}, lang).replace(/^[^:]*:\s*/, '') : L(SRC.mensa, lang), action:{act:'tab', tab:'mensa', icon:'cutlery', label: t('all_dishes', null, lang)}})};
}
/* evening: what is on today in this town (from the event calendar), then general tips */
function nightAnswer(c, lang){
  const today = isoDay(NOW);
  const ev = eventList().filter(e => (e.when === 'today' || e.when === today) && (!e.time || e.time >= '16:00') && (!e.c || CAMPUS[e.c].city === c.city)).slice(0, 2);
  const line = e => { const x = [e.time, e.s && L(e.s, lang)].filter(Boolean).join(', '); return L(e.n, lang) + (x ? ' (' + x + ')' : ''); };

}
function eventsAnswer(c, lang, night){

}
function examAnswer(lang){
  const pa = ROOMS['SM-PA'], f = fristByKey('pruefungsanmeldung');
  const vars = {room: pa.code, h: roomHours(pa, lang, ', '), range: f ? fmtRangeL(f.von, f.bis, lang) : ''};
  const past = f && (f.bis || f.von) < isoDay(NOW);
  return {topic:'Prüfungen', ok:true, msg:{role:'bot', lang, text: T(past ? 'exam_past' : 'exam', lang, vars), source: L(SRC.exams, lang), action:{act:'discover', seg:'studi', icon:'calendar', label: t('deadlines', null, lang)}}};
}

function answer(q){
  const lang = detectLang(q), n = fold(q);
  const hay = n + ' | ' + n.replace(/ae/g, 'a').replace(/oe/g, 'o').replace(/ue/g, 'u');
  const named = campusFromText(hay);
  const c = CAMPUS[named || state.campus], city = c.city;
  const msg = o => Object.assign({role:'bot', lang}, o);
  const U = understand(q), has = k => U.c.has(k);
  const topicWords = ['EXAM','FOOD','FOODPLACE','VEGAN','VEGGIE','REREG','LIBRARY','WIFI','NIGHT','EVENTS','SPORT','CERT','INTL','ASTA','ADDROFF','TRANSIT','TERM','ROOMW'];
  const anyTopic = topicWords.some(has);

  const rm = roomFromText(q, hay);
  if(rm){
    if(rm.id) return routeAnswer(ROOMS[rm.id], lang, 'Raumsuche');
    return {topic:'Raumsuche', ok:false, msg: msg({unsure:true, text: T('no_room', lang, {code: rm.code, ex: C().ex}), action:{act:'tab', tab:'rooms', icon:'search', label: t('rooms_title', null, lang)}})};
  }
  if(has('THANKS') && !anyTopic && U.words <= 6) return {topic:'Begrüßung', ok:true, msg: msg({text: T('thanks', lang)})};
  /* questions about Campi itself: how it works, what it can do, how to put it on the home screen */
  if(has('INSTALL') && !anyTopic) return {topic:'App-Hilfe', ok:true, msg: msg({text: T('app_install', lang), action:{act:'guide', src:'chat', icon:'install', label: t('g_title', null, lang)}})};
  if((has('APPHELP') || (has('HELP') && U.words <= 6)) && !anyTopic) return {topic:'App-Hilfe', ok:true, msg: msg({text: T('app_help', lang, {city}), action:{act:'tab', tab:'help', icon:'help', label: t('help_open', null, lang)}})};
  if((has('GREET') || has('HELP')) && !anyTopic && U.words <= 6) return {topic:'Begrüßung', ok:true, msg: msg({text: T('hello', lang, {city})})};
  /* exams: problems (postpone, illness, grades) go to the examination office, registration questions get the dates */
  if(has('EXAM') && has('POSTPONE')) return unsureAnswer('pa', lang, 'Prüfungen: verschieben');
  if(has('EXAM') && (has('REGISTER') || has('DEADLINE') || has('WHEN'))) return examAnswer(lang);
  const place = placeFromText(hay, named);
  /* "where is …" for a known place: show the way, unless the question is about something the place offers */
  const ownTopic = ['EXAM','FOOD','VEGAN','VEGGIE','CERT','REREG','DEADLINE','ADDROFF','WIFI','NIGHT','EVENTS','SPORT','TERM'].some(has);
  if(place && has('WHERE') && !ownTopic) return placeAnswer(ROOMS[place], lang);
  if(has('EXAM')) return place ? placeAnswer(ROOMS[place], lang) : unsureAnswer('pa', lang, 'Prüfungen: sonstiges');
  if(has('ADDROFF') || (has('REGISTER') && has('ADDRESS')) || (has('REGISTER') && has('WHERE') && !['LIBRARY','SPORT','INTL','ASTA','FOOD','FOODPLACE','CERT'].some(has))){
    return {topic:'Wohnen und Stadt', ok:true, msg: msg({text: T('addr', lang, {city}), source: fill(L(SRC.city, lang), {city})})};
  }
  if(has('FOOD') || has('FOODPLACE') || has('VEGAN') || has('VEGGIE')) return mensaAnswer(c, lang, U);
  if(has('CERT')){
    const s = ROOMS['SM-SSV'];
    return {topic:'Studienorganisation', ok:true, msg: msg({text: T('cert', lang, {room: s.code, h: roomHours(s, lang, ', ')}), source: L(SRC.ssv, lang), action:{act:'route', room:s.id, icon:'pin', label: t('show_route', null, lang)}})};
  }
  if(has('TERM')){
    const f = fristByKey('vorlesungsende');
    if(f) return {topic:'Fristen und Rückmeldung', ok:true, msg: msg({text: T('lectures_end', lang, {date: fmtDateL(f.von || f.bis, lang)}), source: L(SRC.deadlines, lang), action:{act:'discover', seg:'studi', icon:'calendar', label: t('deadlines', null, lang)}})};
  }
  if(has('REREG') || has('DEADLINE')){
    const f = fristByKey('rueckmeldung');
    return {topic:'Fristen und Rückmeldung', ok:true, msg: msg({text: T('deadline', lang, {date: f ? fmtDateL(f.bis || f.von, lang) : ''}), source: L(SRC.deadlines, lang), action:{act:'discover', seg:'studi', icon:'calendar', label: t('deadlines', null, lang)}})};
  }
  if(has('LIBRARY')){
    const r = (named && ROOM_LIST.find(x => x.lib && x.c === named)) || ROOM_LIST.find(x => x.lib && x.c === c.id);
    return routeAnswer(r, lang, 'Bibliothek');
  }
  if(has('WIFI')) return {topic:'IT', ok:true, msg: msg({text: T('wifi', lang), source: L(SRC.wifi, lang)})};
  if(has('EVENTS') && !has('SPORT')) return eventsAnswer(c, lang, has('NIGHT'));
  if(has('NIGHT')) return nightAnswer(c, lang);
  if(has('SPORT')) return {topic:'Hochschulsport', ok:true, msg: msg({text: T('sport', lang), source: 'hs-esslingen.de · Hochschulsport', action:{act:'route', room:'FL-02010', icon:'pin', label: t('show_route', null, lang)}})};
  if(has('INTL')){
    const res = routeAnswer(ROOMS['SM-IC'], lang, 'International');
    res.msg.text += ' ' + T('intl', lang); res.msg.source = L(SRC.intl, lang);
    return res;
  }
  if(has('ASTA')){
    const r = ROOM_LIST.find(x => x.id === c.id + '-ASTA') || ROOMS['SM-ASTA'];
    const res = routeAnswer(r, lang, 'AStA'); res.msg.source = L(SRC.asta, lang);
    return res;
  }
  if(place && (has('WHERE') || has('HOURS') || has('TRANSIT') || U.words <= 4)) return placeAnswer(ROOMS[place], lang);
  if(has('TRANSIT') || (has('WHERE') && named)){
    return {topic:'Anfahrt', ok:true, msg: msg({text: L(c.name, lang) + ' (' + c.addr + '): ' + L(c.transit, lang), source: L(SRC.transit, lang), action:{act:'tab', tab:'rooms', icon:'pin', label: t('rooms_title', null, lang)}})};
  }
  if(place) return placeAnswer(ROOMS[place], lang);
  if(has('ROOMW') && (has('WHERE') || U.words <= 4)) return {topic:'Raumsuche', ok:true, msg: msg({text: T('which_room', lang, {ex: C().ex}), action:{act:'tab', tab:'rooms', icon:'search', label: t('rooms_title', null, lang)}})};
  if((has('GREET') || has('HELP') || has('THANKS')) && U.words <= 8) return {topic:'Begrüßung', ok:true, msg: msg({text: T('hello', lang, {city})})};
  /* no verified source: refer to the responsible office */
  const office = has('POSTPONE') ? 'pa' : has('IT') ? 'it' : has('HOUSING') ? 'housing' : 'ssv';
  return unsureAnswer(office, lang, 'Ohne Quelle');
}
function unsureAnswer(office, lang, topic){
  let r = null, label, where;
  if(office === 'housing'){ label = 'Studierendenwerk Stuttgart'; where = L(TPL.housing_where, lang); }
  else {
    r = office === 'pa' ? ROOMS['SM-PA'] : office === 'it' ? (ROOM_LIST.find(x => x.c === state.campus && /RZ|IT$/.test(x.id)) || ROOMS['SM-RZ']) : ROOMS['SM-SSV'];
    const h = roomHours(r, lang, ', ');
    label = roomName(r, lang); where = (r.code ? r.code + ', ' : '') + buildingLabel(r, lang) + ', ' + L(CAMPUS[r.c].short, lang) + (h ? ', ' + h : '');
  }
  return {topic, ok:false, msg:{role:'bot', lang, unsure:true, text: T('unsure', lang, {office: label, where}),
    action: r ? {act:'route', room:r.id, icon:'pin', label: t('show_route', null, lang)} : null}};
}

function readLog(){ try { const a = JSON.parse(lsGet(LOG_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch(e){ return []; } }
function addLog(entry){ const a = readLog(); a.unshift(entry); lsSet(LOG_KEY, JSON.stringify(a.slice(0, 40))); }

function ask(q, src){
  q = (q || '').trim();
  if(!q || state.typing) return;
  state.chat.push({role:'user', text:q});
  studyOnAsk(q, src);
  const res = answer(q);
  addLog({q: q.slice(0,140), ok: res.ok, topic: res.topic, lang: res.msg.lang, t: Date.now()});
  state.typing = true;
  const log = $('chat-log');
  if(log){
    log.insertAdjacentHTML('beforeend', msgHTML({role:'user', text:q}) + typingHTML());
    log.scrollTop = log.scrollHeight;
    const sg = $('suggest'); if(sg) sg.innerHTML = suggestHTML();
  }
  setTimeout(() => {
    state.typing = false;
    state.chat.push(res.msg);
    const lg = $('chat-log');
    if(lg){
      const ty = $('typing'); if(ty) ty.remove();
      lg.insertAdjacentHTML('beforeend', msgHTML(res.msg));
      lg.scrollTop = lg.scrollHeight;
      const sg = $('suggest'); if(sg) sg.innerHTML = suggestHTML();
    }
    studyOnAnswer(res);
  }, REDUCED ? 150 : 650 + Math.min(900, q.length * 14));
}

function renderScreen(keepScroll){
  const sc = $('screen'); if(!sc) return;
  studySampleScroll();

  if(!(state.tab === 'rooms' && state.view === 'live')) geoStop();

}
function go(tab, opts){

/* ================= Fragen verstehen (ohne KI-Dienst) =================
   Jedes Thema hat Begriffe in sechs Sprachen. Eine Frage wird in Wörter zerlegt und mit den Begriffen verglichen:
   Wortanfang ("prufung*" passt auf "Prüfungsanmeldung"), Wortteile in deutschen Zusammensetzungen ("~frist" in
   "Anmeldefrist"), feste Wendungen ("bis wann") und kleine Tippfehler (ab 6 Buchstaben ein Fehler erlaubt).

/* words that must not count for a topic (office names contain "Prüfung", "example" starts like "exam") */
const LEX_EXCLUDE = {EXAM: ['prufungsamt', 'pruefungsamt', 'exampl', 'testen', 'testat'], FOOD: ['essential'], WIFI: ['netzt'], ROOMW: ['salle de sport'], NIGHT: ['marche']};
const NLU = (() => {
  const out = {};
  Object.keys(LEX).forEach(c => {
    const o = {words: new Set(), stems: [], subs: [], phrases: []};
    LEX[c].forEach(e => {
      if(e.includes(' ')) o.phrases.push(' ' + e.replace(/\*$/, '') + (e.endsWith('*') ? '' : ' '));
      else if(e[0] === '~') o.subs.push(e.slice(1));
      else if(e.endsWith('*')) o.stems.push(e.slice(0, -1));
      else o.words.add(e);
    });
    out[c] = o;
  });
  return out;
})();
/* Damerau-Levenshtein distance with an early stop */
function editDist(a, b, max){
  if(Math.abs(a.length - b.length) > max) return max + 1;
  const d = [];
  for(let i = 0; i <= a.length; i++){ d[i] = [i]; }
  for(let j = 0; j <= b.length; j++) d[0][j] = j;
  for(let i = 1; i <= a.length; i++){
    let rowMin = Infinity;
    for(let j = 1; j <= b.length; j++){
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if(i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      if(d[i][j] < rowMin) rowMin = d[i][j];
    }
    if(rowMin > max) return max + 1;
  }
  return d[a.length][b.length];
}
function nluText(q){
  let s = fold(q).replace(/[^a-z0-9]+/g, ' ').trim();
  /* names of offices are places, not topics */
  s = s.replace(/\b(prufungsamt\w*|pruefungsamt\w*|examination office|exam office|examinations office|oficina de examenes|ufficio esami|service des examens|sinav ofisi|sinav burosu)\b/g, ' pamt ');
  /* German separable verbs: "melde mich … ab" means "abmelden", "trage mich … aus" means "austragen" */
  if(/\b(melde|meldet|melden|meldest)\b.*\bab\b/.test(s)) s += ' abmelden';
  if(/\b(trage|tragt|tragen|tragst)\b.*\baus\b/.test(s)) s += ' austragen';
  if(/\b(trage|tragt|tragen|tragst)\b.*\bein\b/.test(s)) s += ' eintragen';
  if(/\b(melde|meldet|melden|meldest)\b.*\ban\b/.test(s)) s += ' anmelden';
  return s.replace(/\s+/g, ' ').trim();
}
function understand(q){
  const base = nluText(q), variant = base.replace(/ae/g, 'a').replace(/oe/g, 'o').replace(/ue/g, 'u');
  const text = ' ' + base + ' ' + (variant !== base ? variant + ' ' : '');
  const toks = Array.from(new Set(text.split(' ').filter(Boolean)));
  const found = new Set(), explained = new Set();
  const concepts = Object.keys(NLU);
  /* pass 1: exact words, word beginnings, compound parts and phrases */
  concepts.forEach(c => {
    const L0 = NLU[c], ex = LEX_EXCLUDE[c] || [];
    if(L0.phrases.some(p => text.includes(p))){ found.add(c); }
    toks.forEach(tk => {
      if(ex.some(x => tk.startsWith(x))) return;
      if(L0.words.has(tk) || L0.stems.some(st => tk.startsWith(st)) || L0.subs.some(st => tk.length > st.length && tk.includes(st))){ found.add(c); explained.add(tk); }
    });
  });
  /* pass 2: small typos, only for words that matched nothing exactly */
  toks.filter(tk => tk.length >= 6 && !explained.has(tk) && !/\d/.test(tk)).forEach(tk => {
    concepts.forEach(c => {
      if(found.has(c)) return;
      const L0 = NLU[c], ex = LEX_EXCLUDE[c] || [];
      if(ex.some(x => tk.startsWith(x))) return;
      const tol = tk.length >= 9 ? 2 : 1;
      for(const w of L0.words){ if(w.length >= 6 && editDist(tk, w, tol) <= tol){ found.add(c); return; } }
      for(const st of L0.stems){
        if(st.length < 6 || tk.length < st.length - 1) continue;
        const part = tk.length >= st.length ? tk.slice(0, st.length) : tk, t2 = st.length >= 9 ? 2 : 1;
        if(editDist(part, st, t2) <= t2){ found.add(c); return; }
      }
    });
  });
  return {c: found, words: base ? base.split(' ').length : 0, text: base};
}

  } else {

async function save(){
  if(saving) return;
  const dirty = !sameBranding(state.draft, SHARED);
  if(!dirty && !LOCAL) return;
  const b = cleanBranding(dirty ? state.draft : SHARED);
  const ts = new Date().toISOString();
  saving = true; saveMsg = ''; saveErr = false; renderSaveBar();

  // 1. copy on this device
  const localOk = writeLocal(b, ts);
  // 2. republish the page for everyone
  const api = await waitApi(12000);
  let code = null;
  if(!api) code = 'unavailable';
  else if(readOnly) code = 'not_writer';
  else {
    ssSet(AFTER_SAVE_KEY, '1');
    for(let attempt = 0; attempt < 2; attempt++){
      try { await api.publish(buildDocument(b, ts)); code = null; break; }
      catch(e){
        code = (e && typeof e.code === 'string') ? e.code : 'upstream_error';
        if(code !== 'upstream_error' || attempt) break;
        await new Promise(r => setTimeout(r, 600 + Math.random() * 900));
      }
    }
    if(code) ssDel(AFTER_SAVE_KEY);
  }
  saving = false;

  if(!code){
    PAGE = b; PAGE_SAVED_AT = ts; LOCAL = null; SHARED = b;
    state.draft = b; ssDel(DRAFT_KEY);
    saveMsg = 'Gespeichert, für alle und dauerhaft. Die App lädt gleich neu.';
    renderSaveBar(); return;
  }
  if(NO_WRITE.includes(code)) readOnly = true;
  if(!localOk){
    saveErr = true;
    saveMsg = 'Speichern hat nicht geklappt (' + code + '). ' + (code === 'too_large' ? 'Bitte ein kleineres Logo wählen.' : 'Bitte die App als Besitzer auf claude.ai öffnen, im Browser oder in der Desktop-App, und dort speichern.');
    renderSaveBar(); return;
  }
  LOCAL = {b, savedAt: ts}; SHARED = b; state.draft = b; state.b = state.mode === 'admin' ? b : SHARED; ssDel(DRAFT_KEY);
  const pre = 'Auf diesem Gerät gespeichert. ';
  if(code === 'unavailable' || NO_WRITE.includes(code)) saveMsg = pre + 'Für alle speichern geht in dieser Ansicht nicht (' + code + '). Öffne die App dafür als Besitzer auf claude.ai, im Browser oder in der Desktop-App.';
  else if(code === 'conflict') saveMsg = pre + 'Gleichzeitig wurde eine andere Version gespeichert, die Seite lädt neu. Tippe danach auf „Für alle speichern“.';
  else if(code === 'too_large') saveMsg = pre + 'Für alle ging es nicht: Mit diesem Logo wird die Seite zu groß. Bitte ein kleineres Logo wählen.';
  else if(code === 'rate_limited') saveMsg = pre + 'Für alle bitte in einer Minute noch einmal auf „Für alle speichern“ tippen.';
  else saveMsg = pre + 'Für alle hat es gerade nicht geklappt (' + code + '). Bitte gleich noch einmal auf „Für alle speichern“ tippen.';
  renderSaveBar();
}

function readFile(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); }); }
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function handleLogo(file){
  const st = $('logo-status');
  const say = (t, err) => { if(st){ st.textContent = t; st.classList.toggle('status', true); st.classList.toggle('error', !!err); } };
  if(!file) return;
  if(!/^image\/(png|jpeg|webp|gif|svg\+xml)$/.test(file.type)){ say('Diese Datei ist kein Bild. Bitte PNG, SVG oder JPG wählen.', true); return; }
  try {
    const url = await readFile(file);
    if(file.type === 'image/svg+xml'){
      if(url.length > 350000){ say('Die SVG-Datei ist zu groß. Bitte eine kleinere Datei oder ein PNG wählen.', true); return; }
      update({logo:url}); say('Logo übernommen.'); return;
    }
    const img = await loadImg(url);
    const s = Math.min(1, 480 / img.naturalWidth, 192 / img.naturalHeight);
    const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    let out = c.toDataURL('image/png');
    if(out.length > 350000) out = c.toDataURL('image/webp', 0.9);
    update({logo:out}); say('Logo übernommen.');
  } catch(e){ say('Das Bild konnte nicht gelesen werden. Bitte eine andere Datei versuchen.', true); }
}

/* ================= Karte und echter Standort =================
   Kartenbilder von OpenStreetMap, ohne Bibliothek. Der Standort wird nur nach einem Tipp auf
   „Meinen Standort verwenden“ oder nach der freiwilligen Einwilligung im Test abgefragt.
   Gespeichert wird er nur mit dieser Einwilligung und auf 4 Nachkommastellen gerundet (etwa 10 m). */
const TILE = 256, MAP_W = 300, MAP_H = 200;
const GEO = {watch:null, pos:null, status:'off', keep:false, z:17, center:null, pan:[0,0], key:'', opts:null, follow:true,
  arrived:{}, lastTrack:null, autoLive:false, failed:0, loaded:0, renderAt:0, renderTimer:null, startedAt:0};
function llToPx(ll, z){
  const s = TILE * Math.pow(2, z), lat = Math.max(-85, Math.min(85, ll[0])) * Math.PI / 180;
  return [(ll[1] + 180) / 360 * s, (1 - Math.log(Math.tan(lat) + 1 / Math.cos(lat)) / Math.PI) / 2 * s];
}
function pxToLL(p, z){
  const s = TILE * Math.pow(2, z), n = Math.PI - 2 * Math.PI * p[1] / s;
  return [180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))), p[0] / s * 360 - 180];
}
function mPerPx(lat, z){ return 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, z); }
function fitZoom(points){

    const w = Math.max(...px.map(p => p[0])) - Math.min(...px.map(p => p[0])), h = Math.max(...px.map(p => p[1])) - Math.min(...px.map(p => p[1]));

function midLL(points){ return [points.reduce((s, p) => s + p[0], 0) / points.length, points.reduce((s, p) => s + p[1], 0) / points.length]; }

  geoTrack();

  if(first && !GEO.autoLive && state.tab === 'rooms' && state.view === 'plan' && haversine([GEO.pos.lat, GEO.pos.lon], C().center) < 1500){
    GEO.autoLive = true; state.view = 'live'; track('live_automatisch', {}); renderScreen(true); return;

let drag = null;
document.addEventListener('pointerdown', e => {
  const m = e.target.closest && e.target.closest('#gmap'); if(!m || e.target.closest('.gm-ctrl, .gm-attr')) return;
  drag = {x: e.clientX, y: e.clientY, px: GEO.pan[0], py: GEO.pan[1], moved: false, id: e.pointerId};

function geoAction(a, el){

    case 'geo-zoom': { const z = Math.max(13, Math.min(19, GEO.z + (+el.dataset.d))); if(z !== GEO.z){ GEO.z = z; track('karte', {aktion: 'zoom', zoom: z}); gmapRender(); } return true; }

  async rpc(fn, body, keepalive){

    if(!r.ok){ const err = new Error('HTTP ' + r.status); err.status = r.status; throw err; }

function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const a = new Uint8Array(16); crypto.getRandomValues(a); a[6] = (a[6] & 15) | 64; a[8] = (a[8] & 63) | 128;

/* outbox: everything waits here until the database confirms it (or stays here without database) */
const OB = (() => {
  const empty = {sitzungen:[], ereignisse:[], ergebnisse:[], antworten:[], gesendet:[]};
  try { const o = JSON.parse(lsGet(OUTBOX_KEY) || 'null'); if(o && typeof o === 'object') Object.keys(empty).forEach(k => { if(Array.isArray(o[k])) empty[k] = o[k]; }); } catch(e){}
  return empty;
})();
let persistTimer = null;
function persistOutbox(now){
  clearTimeout(persistTimer);
  const write = () => { OB.ereignisse = OB.ereignisse.slice(-4000); OB.gesendet = OB.gesendet.slice(-200); lsSet(OUTBOX_KEY, JSON.stringify(OB)); };
  if(now) write(); else persistTimer = setTimeout(write, 400);
}
function enqueue(table, row){ if(ST.preview) return; OB[table].push(row); persistOutbox(); scheduleFlush(); }
function pendingCount(){ return OB.sitzungen.length + OB.ereignisse.length + OB.ergebnisse.length + OB.antworten.length; }
let flushing = null, flushTimer = null;
function scheduleFlush(ms){ if(!REMOTE) return; clearTimeout(flushTimer); flushTimer = setTimeout(() => { flush(); }, ms == null ? 2500 : ms); }
function flush(keepalive){
  if(!REMOTE || !pendingCount()) return Promise.resolve(!pendingCount());
  if(flushing) return flushing;
  const sess = OB.sitzungen.slice(0, 5);
  const allowed = new Set(OB.gesendet.concat(sess.map(s => s.id)));
  const pick = (arr, n, key) => { const out = []; for(const it of arr){ if(out.length >= n) break; if(allowed.has(it[key])) out.push(it); } return out; };
  const batch = {sitzungen: sess, ereignisse: pick(OB.ereignisse, keepalive ? 60 : 250, 'sitzung_id'), ergebnisse: pick(OB.ergebnisse, 5, 'sitzung_id'), antworten: pick(OB.antworten, 100, 'sitzung_id')};
  const n = batch.sitzungen.length + batch.ereignisse.length + batch.ergebnisse.length + batch.antworten.length;
  if(!n) return Promise.resolve(false);
  const drop = () => {
    ['sitzungen','ereignisse','ergebnisse','antworten'].forEach(k => { const s = new Set(batch[k]); OB[k] = OB[k].filter(x => !s.has(x)); });
    sess.forEach(s => { if(!OB.gesendet.includes(s.id)) OB.gesendet.push(s.id); });
    persistOutbox(true);
  };
  flushing = SB.rpc('test_speichern', {daten: batch}, keepalive)
    .then(() => { drop(); return true; })
    .catch(e => { if(e && e.status === 400) drop(); return false; })
    .then(ok => { flushing = null; if(ok && pendingCount() && !keepalive) return flush(); return ok && !pendingCount(); });
  return flushing;
}

function screenKey(){
  if(state.mode !== 'app') return 'einstellungen';
  const base = state.tab === 'discover' ? 'entdecken-' + state.discover : state.tab === 'rooms' ? 'raeume-' + state.view : ({start:'start', chat:'chat', mensa:'mensa', help:'hilfe'})[state.tab] || state.tab;
  return base + ($('map-overlay') ? '+karte' : '') + (state.sheet ? '+' + ({lang:'sprache', campus:'standort', name:'name', install:'app-anleitung'}[state.sheet] || state.sheet) : '');
}
function studySampleScroll(){
  if(!ST.tracking) return;
  const sc = $('mo-scroll') || $('chat-log') || $('screen');
  if(!sc) return;
  const ratio = sc.scrollHeight > sc.clientHeight ? (sc.scrollTop + sc.clientHeight) / sc.scrollHeight : 1;
  if(ratio > ST.maxScroll) ST.maxScroll = Math.min(1, ratio);
}
/* the user's own name never leaves the device: it is removed from everything that gets recorded */
function scrubName(v){
  const n = userName();
  if(typeof v !== 'string' || !n || n.length < 2) return v;
  return v.replace(new RegExp(n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '[Name]');
}
function clipData(d){
  const out = {};
  Object.keys(d || {}).slice(0, 24).forEach(k => { const v = d[k]; out[k] = typeof v === 'string' ? scrubName(v).slice(0, 200) : v; });
  return out;
}
function track(typ, daten){
  if(!ST.tracking || ST.preview) return;
  OB.ereignisse.push({id: uuid(), sitzung_id: ST.sid, zeit_ms: Math.max(0, Math.round(performance.now() - ST.tStart)), zeitpunkt: new Date().toISOString(),
    typ, schritt: ST.step || (ST.mode === 'pilot' ? 'pilot' : 'danach'), ansicht: screenKey(), daten: clipData(daten)});
  persistOutbox(); scheduleFlush();
}
/* page time: one "ansicht" when a view opens, one "ansicht_ende" with the active time when it closes or the app goes to the background */
function endScreen(why){
  if(!ST.tracking || !ST.screenKey) return;
  const now = performance.now();
  studySampleScroll();
  track('ansicht_ende', {ansicht: ST.screenKey, dauer_ms: Math.round(now - ST.screenSince), scrolltiefe: Math.round(ST.maxScroll * 100), grund: why || 'wechsel'});
  ST.screenKey = '';
}
function beginScreen(why){
  if(!ST.tracking) return;
  const k = screenKey();
  ST.screenKey = k; ST.screenSince = performance.now(); ST.maxScroll = 0;
  track('ansicht', {ansicht: k, campus: state.campus, sprache: LANG, grund: why || 'wechsel', raum: state.tab === 'rooms' ? state.room : undefined});
  studySampleScroll();
}

function resetAppState(){
  closeMapOverlay();
  const c = CAMPUS[state.campus];
  Object.assign(state, {tab:'start', room:c.next.room, roomQuery:'', start:c.defStart, bf:false, view:'plan', day:TODAY_IDX,
    filters:{vegan:false, veggie:false, nogluten:false}, discover:'studi', cat:'alle', chat:[], typing:false, sheet:null});
  renderSheet();
  ST.resetting = true; renderScreen(false); ST.resetting = false;
}
function startStudy(preview){
  clearInterval(ST.timer); ST.timer = null;
  if(ST.tracking){ endScreen('neu'); flush(); }
  if(!preview) setUserName('');   /* new test person on a shared device: no name from the last one */
  Object.assign(ST, {active:true, preview:!!preview, tracking:false, mode:'test', sent:'', sid: uuid(), qs:null, qsSource:'', qPage:0, answers:{}, screenKey:'', step:'', geoOk:false});
  ST.rec = {gruppe: Math.random() < 0.5 ? 'mit Quelle' : 'ohne Quelle'};
  if(studyWanted() || previewWanted()){ try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} }
  resetAppState();
  setStep('intro');
}
function endStudy(){
  clearInterval(ST.timer); ST.timer = null;
  ST.active = false; ST.step = '';
  resetAppState(); renderStudy();
}
function setStep(step){
  const prev = ST.step, now = performance.now();
  if(prev !== step) track('schritt', {von: prev || '-', nach: step, dauer_ms: Math.round(now - (ST.stepSince || now))});
  ST.step = step; ST.stepSince = now;
  clearInterval(ST.timer); ST.timer = null;
  if(step === 't1' || step === 't2' || step === 't3'){
    resetAppState();
    ST.t0 = now; ST.taps = 0; ST.ways = []; ST.visited = []; ST.questions = 0;
    track('aufgabe', {nr: +step.slice(1), phase:'start', ziel: step === 't1' ? ST.t1room : undefined});
    if(step === 't3') ST.timer = setInterval(updateStudyClock, 1000);
  }
  renderStudy();
}
function secs(){ return Math.round((performance.now() - ST.t0) / 100) / 10; }
function inTask(){ return ST.active && (ST.step === 't1' || ST.step === 't2' || ST.step === 't3'); }
function noteWay(w){ if(ST.active && ST.step === 't1' && !ST.ways.includes(w)) ST.ways.push(w); }
function noteVisit(v){ if(v && ST.active && ST.step === 't3' && !ST.visited.includes(v)) ST.visited.push(v); }

/* hooks called from the app */
function studyAfterScreen(){
  if(state.mode !== 'app' || ST.resetting) return;
  if(ST.tracking && screenKey() !== ST.screenKey){ endScreen('wechsel'); beginScreen('wechsel'); }
  if(!ST.active) return;
  if(ST.step === 't1' && state.tab === 'rooms' && state.room === ST.t1room) finishTask1(true);
  else if(ST.step === 't3') noteVisit({start:'Start', rooms:'Räume', chat:'Frag Campi', mensa:'Mensa', help:'Hilfe', discover: state.discover === 'stadt' ? 'Stadtleben' : 'Studileben'}[state.tab]);
}
function studyOnAsk(q, src){ noteWay('Frag Campi'); noteVisit('KI-Frage gestellt'); track('chat_frage', {text: q, laenge: q.length, quelle: src || 'eingabe'}); }
function studyOnAnswer(res){
  track('chat_antwort', {thema: res.topic, beantwortet: !!res.ok, quelle_gezeigt: !!(res.msg && res.msg.source) && !(ST.rec && ST.rec.gruppe === 'ohne Quelle' && ST.mode === 'test'),
    sprache: res.msg && res.msg.lang, app_sprache: LANG});
  if(!ST.active || ST.step !== 't2') return;
  ST.questions++;
  if(res.topic === 'Prüfungen'){
    Object.assign(ST.rec, {a2_ergebnis:'beantwortet', a2_sekunden: secs(), a2_fragen: ST.questions, a2_sprache: res.msg.lang});
    track('aufgabe', {nr:2, phase:'ende', ergebnis:'beantwortet', sekunden: ST.rec.a2_sekunden, sprache: res.msg.lang});
    setStep('t2-done');
  }
}
function studyOnAction(a, el){
  if(a === 'room') track('raum_gewaehlt', {raum: el.dataset.room, ueber: el.closest('.result') ? 'Suche' : 'Schnellauswahl'});

function studyOnSearch(text){
  noteWay('Suche');

function finishTask1(found){
  Object.assign(ST.rec, {a1_ergebnis: found ? 'gefunden' : 'aufgegeben', a1_sekunden: secs(), a1_tipps: ST.taps, a1_weg: ST.ways.join(', ')});
  track('aufgabe', {nr:1, phase:'ende', ergebnis: ST.rec.a1_ergebnis, sekunden: ST.rec.a1_sekunden, tipps: ST.taps, ziel: ST.t1room});
  setStep(found ? 't1-done' : 't2-brief');
}

/* questionnaire from the database, shown in the app language; answers are stored with the German wording */
function validQuestion(q){
  return q && typeof q.frage === 'string' && ['einfach','mehrfach','skala','text'].includes(q.typ) &&
    (q.typ === 'skala' || q.typ === 'text' || (Array.isArray(q.optionen) && q.optionen.length > 0));
}
async function loadQuestions(){
  if(!REMOTE){ ST.qs = DEFAULT_QUESTIONS; ST.qsSource = 'standard'; return; }
  try {
    const rows = await SB.get('fragen?select=id,position,typ,frage,hinweis,optionen,skala_min,skala_max,pflicht,schluessel,uebersetzungen&aktiv=is.true&order=position.asc,erstellt.asc');
    ST.qs = (Array.isArray(rows) ? rows : []).filter(validQuestion); ST.qsSource = 'datenbank';
  } catch(e){
    try {
      const rows = await SB.get('fragen?select=id,position,typ,frage,hinweis,optionen,skala_min,skala_max,pflicht,schluessel&aktiv=is.true&order=position.asc,erstellt.asc');
      ST.qs = (Array.isArray(rows) ? rows : []).filter(validQuestion); ST.qsSource = 'datenbank';
    } catch(e2){ ST.qs = DEFAULT_QUESTIONS; ST.qsSource = 'standard'; }
  }
}
function qText(q){
  const tr = (q.uebersetzungen && typeof q.uebersetzungen === 'object' && q.uebersetzungen[LANG]) || {};
  const opts = (q.optionen || []).map((v, i) => ({v, l: (Array.isArray(tr.optionen) && typeof tr.optionen[i] === 'string' && tr.optionen[i].trim()) ? tr.optionen[i] : v}));
  return {frage: (LANG !== 'de' && tr.frage) || q.frage, hinweis: (LANG !== 'de' && tr.hinweis) || q.hinweis || '', opts,
    lo: (LANG !== 'de' && tr.skala_min) || q.skala_min || t('scale_lo'), hi: (LANG !== 'de' && tr.skala_max) || q.skala_max || t('scale_hi'), uebersetzt: LANG !== 'de' && !!tr.frage};
}
const Q_PER_PAGE = 5;
function qPages(){ const qs = ST.qs || []; const pages = []; for(let i = 0; i < qs.length; i += Q_PER_PAGE) pages.push(qs.slice(i, i + Q_PER_PAGE).map((q, j) => ({q, idx: i + j}))); return pages; }
async function startQuestionnaire(){
  if(!ST.qs){ setStep('laden'); await loadQuestions(); }
  ST.qPage = 0; ST.qStart = performance.now();
  if(!ST.qs.length) return finishStudy();
  track('fragebogen', {phase:'start', fragen: ST.qs.length, quelle: ST.qsSource, sprache: LANG});
  setStep('fragen');
}
function questionHTML(item){
  const q = item.q, name = 'q' + item.idx, x = qText(q);
  let inner = '';
  if(q.typ === 'einfach') inner = stRadio(name, x.opts);
  else if(q.typ === 'mehrfach') inner = '<p class="st-hint">' + esc(t('multi')) + '</p>' + stRadio(name, x.opts, 'checkbox');
  else if(q.typ === 'skala') inner = stScale(name, esc(x.lo), esc(x.hi));
  else inner = '<textarea class="st-text" name="' + name + '" rows="3" maxlength="1000" placeholder="' + esc(t('no_names')) + '"></textarea>';
  return stQ(esc(x.frage) + (x.hinweis ? '<span class="st-qhint">' + esc(x.hinweis) + '</span>' : ''), inner, !q.pflicht);
}

/* results */
async function finishStudy(){
  endScreen('ende');
  const dur = Math.round((performance.now() - ST.tStart) / 100) / 10;
  const r = ST.rec;
  const result = {sitzung_id: ST.sid, a1_ergebnis: r.a1_ergebnis || null, a1_sekunden: r.a1_sekunden ?? null, a1_tipps: r.a1_tipps ?? null, a1_weg: r.a1_weg || null,
    a1_verstaendlich: r.a1_verstaendlich ?? null, a2_ergebnis: r.a2_ergebnis || null, a2_sekunden: r.a2_sekunden ?? null, a2_fragen: r.a2_fragen ?? null,
    a2_vertrauen: r.a2_vertrauen ?? null, a2_lieber: r.a2_lieber || null, a3_sekunden: r.a3_sekunden ?? null, a3_bereiche: r.a3_bereiche || [],
    dauer_sekunden: dur, fragebogen_sekunden: ST.qStart ? Math.round((performance.now() - ST.qStart) / 100) / 10 : null};
  enqueue('ergebnisse', result);
  (ST.qs || []).forEach((q, i) => {
    const v = ST.answers[i];
    if(v === undefined || v === '' || (Array.isArray(v) && !v.length)) return;
    enqueue('antworten', {id: uuid(), sitzung_id: ST.sid, frage_id: q.id || null, frage: q.frage.slice(0, 300), typ: q.typ, wert: v});
  });
  track('abgeschlossen', {dauer_sekunden: dur});
  if(!ST.preview) lsSet(STUDY_DONE_KEY, new Date().toISOString());
  setStep('sending');
  let ok = false;
  if(REMOTE && !ST.preview){ ok = await flush(); if(!ok){ await new Promise(res => setTimeout(res, 1500)); ok = await flush(); } }
  ST.sent = ST.preview ? 'preview' : (REMOTE ? (ok ? 'ok' : 'queued') : 'local');
  setStep('thanks');
  ST.screenKey = ''; beginScreen('danach');
}

/* pilot phase: every opening of the app is a session with the same random pilot number */
function startPilotSession(why){
  const info = pilotInfo(); if(!info || info.ended) return;
  if(ST.tracking){ endScreen('neu'); persistOutbox(true); flush(true); }
  Object.assign(ST, {active:false, preview:false, tracking:true, mode:'pilot', step:'', sid: uuid(), screenKey:'', geoOk: !!info.geo, pilot: info});
  ST.rec = {gruppe:'pilot'};
  ST.tStart = performance.now(); ST.stepSince = ST.tStart;
  GEO.keep = !!info.geo;
  enqueue('sitzungen', Object.assign({id: ST.sid}, sessionMeta(), {modus:'pilot', pilot_id: info.id, standort: state.campus, standort_freigabe: !!info.geo}));
  track('app_geoeffnet', {grund: why || 'start', anzeige: standalone() ? 'home-bildschirm' : 'browser', tage_seit_beitritt: Math.floor((Date.now() - Date.parse(info.seit)) / 864e5)});
  beginScreen('start');
  renderStudy();
  if(state.tab === 'start') renderScreen(true);
  if(why === 'start') maybeShowGuide();
}
function joinPilot(d){
  const info = {id: uuid(), seit: new Date().toISOString(), geo: d.standort_freigabe === 'ja'};
  lsSet(PILOT_KEY, JSON.stringify(info));
  pilotUrl(info.id);
  ST.active = false; ST.step = '';
  startPilotSession('beitritt');
  track('pilot_beigetreten', {standort_freigabe: info.geo});
  if(info.geo) geoStart('einwilligung');
  renderStudy();
  if(maybeShowGuide()) ST.guideToast = true; else toast(t('pi_welcome'));
}
/* keeps the pilot number in the address, so a copy of Campi on the home screen (own storage on iOS) stays the same person */
function pilotUrl(id){ try { const u = new URL(location.href); u.searchParams.set('pilot', '1'); u.searchParams.set('pid', id); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch(e){} }
function pilotFromUrl(){
  try {
    const q = new URLSearchParams(location.search), pid = q.get('pid') || '';
    if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(pid) || pilotInfo()) return false;
    lsSet(PILOT_KEY, JSON.stringify({id: pid, seit: new Date().toISOString(), geo: false, wiederhergestellt: true}));
    return true;
  } catch(e){ return false; }
}
function endPilot(){
  const info = pilotInfo(); if(!info) return;
  track('pilot_beendet', {tage_seit_beitritt: Math.floor((Date.now() - Date.parse(info.seit)) / 864e5)});
  endScreen('ende'); persistOutbox(true); flush(true);
  info.ended = new Date().toISOString(); lsSet(PILOT_KEY, JSON.stringify(info));
  ST.tracking = false; ST.mode = ''; ST.geoOk = false; GEO.keep = false; geoStop(true);
  renderScreen(true); toast(t('pilot_ended'));
}
function showPilotIntro(){
  Object.assign(ST, {active:true, preview:false, tracking:false, mode:'pilot', step:'pilot-intro'});
  renderStudy();
}

/* how to put Campi on the home screen: shown once at the start of the pilot, re-readable from the start page */
const GUIDE_PLATS = ['ios', 'android', 'desktop'];
function guessPlat(){ if(isIOS()) return 'ios'; if(/Android/i.test(navigator.userAgent || '')) return 'android'; return 'desktop'; }
function installGuideHTML(again){
  const p = GUIDE_PLATS.includes(ST.guidePlat) ? ST.guidePlat : (ST.guidePlat = guessPlat());
  const steps = {
    ios: [['share', 'g_ios1', 'g_ios1s'], ['plussq', 'g_ios2', 'g_ios2s'], ['check', 'g_ios3', 'g_ios3s']],

    desktop: [['install', 'g_desk1', 'g_desk1s'], ['plussq', 'g_desk2', 'g_desk2s'], ['star', 'g_desk3', 'g_desk3s']]

function maybeShowGuide(){

/* CSV export of the data that is still on this device (mode without database) */
function csvCell(v){
  let s = typeof v === 'number' ? String(v).replace('.', ',') : Array.isArray(v) ? v.join(', ') : (v && typeof v === 'object') ? JSON.stringify(v) : String(v === undefined || v === null ? '' : v);
  if(/^[=+\-@]/.test(s)) s = "'" + s;
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

async function downloadCSV(filename, data){

/* after "Start task": the task card glides up and turns into the bar at the top; the app appears below it.
   Only transform and opacity are animated (no layout during the motion), so it stays smooth on phones. */
function reducedMotion(){ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
function takeBrief(){
  const ov = $('st-layer'), card = ov && ov.querySelector('.st-task');
  if(!ov || !card || reducedMotion() || typeof ov.animate !== 'function') return null;
  const rect = card.getBoundingClientRect();
  ov.removeAttribute('id'); ov.removeAttribute('role'); ov.removeAttribute('aria-modal'); ov.setAttribute('aria-hidden', 'true');
  ov.inert = true; ov.classList.add('st-leaving');
  ov.querySelectorAll('[id]').forEach(x => x.removeAttribute('id'));
  return {ov, card, rect};
}
function briefToBar(s){
  if(!s) return;
  const app = $('app'), bar = $('st-bar');
  if(!app || !bar){ s.ov.remove(); return; }
  bar.classList.add('st-bar-morph');
  requestAnimationFrame(() => {
    const ar = app.getBoundingClientRect(), br = bar.getBoundingClientRect(), cr = s.rect;
    if(!br.height || !cr.height){ s.ov.remove(); bar.classList.remove('st-bar-morph'); return; }
    const cs = getComputedStyle(app), v = (n, d) => cs.getPropertyValue(n).trim() || d;
    const surf = v('--a-surface', '#FFFFFF'), prim = v('--a-primary', '#14213D'), accent = v('--a-accent', '#E8572A'), line = v('--a-line', '#E2DED6');
    const place = (el, r) => { Object.assign(el.style, {left: (r.left - ar.left) + 'px', top: (r.top - ar.top) + 'px', width: r.width + 'px', height: r.height + 'px'}); app.appendChild(el); return el; };
    /* the card's background becomes the bar's background */
    const plate = place(document.createElement('div'), br); plate.className = 'st-plate'; plate.setAttribute('aria-hidden', 'true');
    /* the card's text travels along and fades out, the bar's text fades in */
    const ccs = getComputedStyle(s.card), txt = s.card.cloneNode(true);
    ['fontFamily', 'fontSize', 'fontWeight', 'lineHeight', 'letterSpacing', 'color', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth', 'borderStyle', 'textAlign']
      .forEach(k => { txt.style[k] = ccs[k]; });
    txt.style.boxSizing = 'border-box'; place(txt, cr); txt.classList.add('st-fly-text'); txt.setAttribute('aria-hidden', 'true');
    s.card.style.visibility = 'hidden';
    const dx = (cr.left + cr.width / 2) - (br.left + br.width / 2), dy = (cr.top + cr.height / 2) - (br.top + br.height / 2);
    const D = 900, E = 'cubic-bezier(.45,0,.2,1)';
    const inner = s.ov.querySelector('.st-inner');
    const anims = [
      /* movement: one even, eased glide from the card to the bar */
      plate.animate([
        {transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + (cr.width / br.width) + ',' + (cr.height / br.height) + ')'},
        {transform: 'translate(0px,0px) scale(1,1)'}], {duration: D, easing: E, fill: 'both'}),
      /* look: stays a card for the first third, then turns into the bar */
      plate.animate([
        {backgroundColor: surf, borderRadius: '14px', boxShadow: 'inset 4px 0 0 0 ' + accent + ', inset 0 0 0 1px ' + line, offset: 0},
        {backgroundColor: surf, borderRadius: '14px', boxShadow: 'inset 4px 0 0 0 ' + accent + ', inset 0 0 0 1px ' + line, offset: 0.3},
        {backgroundColor: prim, borderRadius: '0px', boxShadow: 'inset 0 -4px 0 0 #D6006F, inset 0 0 0 0 ' + line, offset: 0.8},
        {backgroundColor: prim, borderRadius: '0px', boxShadow: 'inset 0 -4px 0 0 #D6006F, inset 0 0 0 0 ' + line, offset: 1}], {duration: D, easing: 'linear', fill: 'both'}),
      /* the card's text rides along, then gives way to the bar's text */
      txt.animate([{transform: 'translate(0px,0px)'}, {transform: 'translate(' + (-dx) + 'px,' + (-dy) + 'px)'}], {duration: D, easing: E, fill: 'both'}),
      txt.animate([{opacity: 1}, {opacity: 1, offset: 0.3}, {opacity: 0, offset: 0.58}, {opacity: 0}], {duration: D, easing: 'linear', fill: 'both'}),
      bar.animate([{opacity: 0}, {opacity: 0, offset: 0.5}, {opacity: 1, offset: 0.85}, {opacity: 1}], {duration: D, easing: 'linear', fill: 'both'}),
      /* the rest of the task page: first its text fades, then its background, so nothing shows through twice */
      inner ? inner.animate([{opacity: 1, transform: 'translateY(0px)'}, {opacity: 0, transform: 'translateY(-24px)'}], {duration: D * 0.3, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards'}) : null,
      s.ov.animate([{opacity: 1}, {opacity: 1, offset: 0.25}, {opacity: 0}], {duration: D * 0.62, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards'})
    ].filter(Boolean);
    let gone = false;
    const done = () => {
      if(gone) return; gone = true;
      bar.classList.remove('st-bar-morph'); anims.forEach(a => { try { a.cancel(); } catch(e){} });
      plate.remove(); txt.remove(); s.ov.remove();
    };
    anims[0].onfinish = done; setTimeout(done, D + 3500);
  });
}

  if(k === 'intro'){
    const d = requireFields(f, ['semester','standort','letzte_raumsuche','einwilligung']); if(!d) return;
    onConsent(d);
  } else if(k === 'pilot'){
    const d = requireFields(f, ['einwilligung']); if(!d) return;
    joinPilot(d);
  } else if(k === 't1'){
    const d = requireFields(f, ['a1_verstaendlich']); if(!d) return;
    ST.rec.a1_verstaendlich = +d.a1_verstaendlich;
    setStep('t2-brief');
  } else if(k === 't2'){
    const d = requireFields(f, ['a2_vertrauen','a2_lieber']); if(!d) return;
    Object.assign(ST.rec, {a2_vertrauen: +d.a2_vertrauen, a2_lieber: d.a2_lieber});
    setStep('t3-brief');
  } else if(k === 'fragen'){
    const page = qPages()[ST.qPage] || [];
    const d = requireFields(f, page.filter(it => it.q.pflicht).map(it => 'q' + it.idx)); if(!d) return;
    page.forEach(it => {
      const raw = d['q' + it.idx];
      if(raw === undefined) return;
      if(it.q.typ === 'mehrfach') ST.answers[it.idx] = [].concat(raw);
      else if(it.q.typ === 'skala') ST.answers[it.idx] = +raw;
      else if(it.q.typ === 'text'){ const s = String(raw).trim().slice(0, 1000); if(s) ST.answers[it.idx] = s; }
      else ST.answers[it.idx] = String(raw);
    });
    if(ST.qPage < qPages().length - 1){ ST.qPage++; track('fragebogen', {phase:'seite', seite: ST.qPage + 1}); renderStudy(); }
    else finishStudy();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(!el.closest || !el.closest('#st-layer') || el.type !== 'checkbox' || !el.checked || !el.form) return;
  const excl = v => /^(nichts|keine|keins|nein)\b/i.test(v);
  el.form.querySelectorAll('input[type="checkbox"][name="' + el.name + '"]').forEach(x => { if(x !== el && (excl(el.value) || excl(x.value))) x.checked = false; });
});
function describeEl(el){
  if(!el || !el.tagName) return '';
  const cls = (typeof el.className === 'string' ? el.className.trim().split(/\s+/)[0] : '') || '';
  return el.tagName.toLowerCase() + (cls ? '.' + cls : '');
}
function labelOf(el){ return ((el.getAttribute && el.getAttribute('aria-label')) || el.innerText || el.textContent || el.value || '').trim().replace(/\s+/g, ' ').slice(0, 60); }
document.addEventListener('click', e => {
  const tg = e.target;
  if(!tg.closest || !tg.closest('#app') || tg.closest('#st-bar') || tg.closest('#st-layer')) return;
  if(inTask()) ST.taps++;
  if(!ST.tracking) return;
  const app = $('app'), r = app.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) / r.width * 100), y = Math.round((e.clientY - r.top) / r.height * 100);
  const el = tg.closest('button, a, input, label, select, textarea, [data-act], [role="tab"]');
  const since = ST.screenKey ? Math.round(performance.now() - ST.screenSince) : null;
  if(el){
    const d = {element: describeEl(el), text: labelOf(el), x, y, ms_in_ansicht: since};
    if(el.dataset){ ['act','tab','room','seg','cat','f','day','start','q','i','view','lang','campus','sheet','ext'].forEach(k => { if(el.dataset[k] !== undefined) d[k === 'act' ? 'aktion' : k] = el.dataset[k]; }); }
    if(el.getAttribute && el.getAttribute('aria-pressed') !== null) d.vorher_aktiv = el.getAttribute('aria-pressed') === 'true';
    track('klick', d);
  } else {
    track('leer_klick', {element: describeEl(tg), text: labelOf(tg).slice(0, 40), x, y, ms_in_ansicht: since});
  }
  const now = performance.now();
  ST.clicks = ST.clicks.filter(c => now - c.t < 800 && Math.abs(c.x - e.clientX) < 40 && Math.abs(c.y - e.clientY) < 40);
  ST.clicks.push({t: now, x: e.clientX, y: e.clientY});
  if(ST.clicks.length === 3) track('frust_klick', {element: describeEl(el || tg), text: labelOf(el || tg).slice(0, 40), x, y});
}, true);
document.addEventListener('scroll', e => {
  if(!ST.tracking) return;
  const s = e.target;
  if(!s || !s.closest || !s.closest('#app') || s.closest('#st-layer')) return;
  const ratio = s.scrollHeight > s.clientHeight ? (s.scrollTop + s.clientHeight) / s.scrollHeight : 1;
  if(ratio > ST.maxScroll) ST.maxScroll = Math.min(1, ratio);
}, true);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){
    if(!ST.tracking) return;
    ST.hiddenAt = performance.now();
    endScreen('hintergrund'); track('verlassen', {}); persistOutbox(true); flush(true);
  } else if(ST.hiddenAt){
    const away = Math.round(performance.now() - ST.hiddenAt); ST.hiddenAt = 0;
    if(ST.mode === 'pilot' && !ST.active && away >= NEW_OPEN_AFTER_MS && pilotInfo()){ startPilotSession('zurueck'); return; }
    if(!ST.tracking) return;
    track('zurueck', {weg_ms: away});
    beginScreen('zurueck');
  }
});
window.addEventListener('pagehide', () => {
  if(!ST.tracking) return;
  endScreen('geschlossen');
  if(ST.active && ST.mode === 'test' && ST.step !== 'thanks') track('abbruch', {schritt: ST.step});
  persistOutbox(true); flush(true);
});
window.addEventListener('error', e => { track('fehler', {meldung: String(e.message || '').slice(0, 160), zeile: e.lineno || null}); });
let resizeTimer = null;
window.addEventListener('resize', () => { if(!ST.tracking) return; clearTimeout(resizeTimer); resizeTimer = setTimeout(() => track('fenster', {breite: window.innerWidth, hoehe: window.innerHeight}), 1000); });
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-st]'); if(!b || !ST.active) return;
  switch(b.dataset.st){
    case 'skip': endStudy(); break;
    case 'pilot-skip': ST.active = false; ST.step = ''; ST.mode = ''; renderStudy(); break;
    case 'close': track('danach', {}); endStudy(); break;
    case 'restart': startStudy(ST.preview); break;
    case 'begin': { const next = {'t1-brief':'t1', 't2-brief':'t2', 't3-brief':'t3'}[ST.step]; if(next){ const snap = takeBrief(); setStep(next); briefToBar(snap); } break; }
    case 'guide-ok': if(ST.step === 'pilot-install') closeGuideOverlay(); break;
    case 'next': if(ST.step === 't1-done') setStep('t1-q'); else if(ST.step === 't2-done') setStep('t2-q'); break;
    case 'giveup1': if(ST.step === 't1') finishTask1(false); break;
    case 'giveup2':
      if(ST.step === 't2'){
        Object.assign(ST.rec, {a2_ergebnis:'aufgegeben', a2_sekunden: secs(), a2_fragen: ST.questions});
        track('aufgabe', {nr:2, phase:'ende', ergebnis:'aufgegeben', sekunden: ST.rec.a2_sekunden});
        setStep('t3-brief');
      } break;
    case 'done3':
      if(ST.step === 't3'){
        Object.assign(ST.rec, {a3_sekunden: Math.round(secs()), a3_bereiche: ST.visited.slice()});
        track('aufgabe', {nr:3, phase:'ende', sekunden: ST.rec.a3_sekunden, bereiche: ST.visited.join(', ')});
        startQuestionnaire();
      } break;
  }
});


/* ================= Mode switching ================= */
function wantsAdmin(){ return /^#(einstellungen|settings|admin)$/i.test(location.hash || ''); }
function render(){
  state.mode = wantsAdmin() ? 'admin' : 'app';
  document.documentElement.setAttribute('data-mode', state.mode);
  const root = $('root');
  if(state.mode === 'admin'){
    state.b = state.draft;
    root.innerHTML = adminHTML();
    if(state.adminTab === 'branding'){ mountApp(); syncForm(); }
    else applyBranding();
  } else {
    state.b = SHARED;
    root.innerHTML = '<div class="stage">' + deviceHTML() + '</div>';
    mountApp();
  }
  renderStudy();
}
function openAdmin(){ if(!wantsAdmin()) location.hash = 'einstellungen'; else render(); }
function openApp(){
  if(wantsAdmin()){
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e){ location.hash = ''; }
  }
  render();
}

/* ================= Events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act;
  studyOnAction(a, el);
  if(geoAction(a, el)) return;
  switch(a){
    case 'tab': go(el.dataset.tab); break;
    case 'route': state.roomQuery = ''; go('rooms', {room:el.dataset.room}); break;
    case 'room': setRoom(el.dataset.room); state.roomQuery = ''; renderScreen(true); break;
    case 'start': state.start = el.dataset.start; renderScreen(true); break;
    case 'bf': state.bf = !state.bf; renderScreen(true); break;
    case 'map-zoom': openMapOverlay(); break;
    case 'map-close': closeMapOverlay(); { const z = document.querySelector('[data-act="map-zoom"]'); if(z) z.focus(); } break;
    case 'discover': go('discover', {seg:el.dataset.seg}); break;
    case 'seg': state.discover = el.dataset.seg; renderScreen(true); break;
    case 'cat': state.cat = el.dataset.cat; renderScreen(true); break;
    case 'day': state.day = +el.dataset.day; renderScreen(true); break;
    case 'filter': { const k = el.dataset.f; state.filters[k] = !state.filters[k]; if(k === 'vegan' && state.filters.vegan) state.filters.veggie = false; if(k === 'veggie' && state.filters.veggie) state.filters.vegan = false; renderScreen(true); break; }
    case 'suggest': ask(el.dataset.q, 'vorschlag'); break;
    case 'sheet': openSheet(el.dataset.sheet); break;
    case 'sheet-close': { const was = state.sheet; if(was === 'install') track('installation', {aktion: 'anleitung_zu', quelle: 'nachlesen', plattform: ST.guidePlat, sekunden: Math.round((performance.now() - (ST.guideSince || performance.now())) / 1000)});
      closeSheet(); const b = document.querySelector(was === 'name' ? '.name-btn' : was === 'install' ? '.guide-link, .install-card [data-act="guide"]' : '.lang-btn'); if(b) b.focus(); } break;
    case 'guide': openGuide(el.dataset.src); break;
    case 'help-ask': go('chat'); ask(el.dataset.q, 'hilfe'); break;
    case 'help-faq': break;
    case 'guide-plat': setGuidePlat(el.dataset.plat); break;
    case 'name-clear': setUserName(''); track('name', {gesetzt: false}); closeSheet(); renderScreen(true); { const b = document.querySelector('.name-btn'); if(b) b.focus(); } break;
    case 'lang': setLang(el.dataset.lang); break;
    case 'campus': setCampus(el.dataset.campus); break;
    case 'install': doInstall(); break;
    case 'install-later': lsSet(INSTALL_LATER_KEY, String(Date.now())); track('installation', {aktion:'spaeter'}); renderScreen(true); break;
    case 'pilot-end': endPilot(); break;
    case 'to-app': openApp(); break;
    case 'admin-tab': state.adminTab = el.dataset.t; render(); break;
    case 'admin-view': state.adminView = el.dataset.v; { const g = document.querySelector('.admin-grid'); if(g) g.dataset.view = state.adminView; document.querySelectorAll('[data-act="admin-view"]').forEach(btn => btn.setAttribute('aria-selected', String(btn.dataset.v === state.adminView))); } break;
    case 'preset': { const p = PRESETS[+el.dataset.i]; update({primary:p.primary, accent:p.accent, background:p.background}); break; }
    case 'remove-logo': update({logo:null}); { const st = $('logo-status'); if(st){ st.textContent = 'Logo entfernt.'; st.classList.remove('error'); } } break;
    case 'drop-local': lsDel(LOCAL_KEY); LOCAL = null; SHARED = PAGE; state.draft = SHARED; ssDel(DRAFT_KEY); saveMsg = ''; saveErr = false; render(); break;
    case 'discard': state.draft = SHARED; state.b = SHARED; ssDel(DRAFT_KEY); saveMsg = ''; applyBranding(); if(state.tab === 'chat' || state.tab === 'discover') renderScreen(true); syncForm(); break;
    case 'save': save(); break;
    case 'clear-log': lsDel(LOG_KEY); render(); break;
    case 'study-csv': downloadCSV('campi-app-test-sitzungen-' + new Date().toISOString().slice(0,10) + '.csv', studyCSV()); break;
    case 'study-csv-events': downloadCSV('campi-app-test-ereignisse-' + new Date().toISOString().slice(0,10) + '.csv', csvFrom(OB.ereignisse, ['sitzung_id','zeitpunkt','zeit_ms','typ','schritt','ansicht','daten'])); break;
    case 'study-clear':
      if(studyClearArmed){ ['sitzungen','ereignisse','ergebnisse','antworten'].forEach(k => OB[k] = []); persistOutbox(true); studyClearArmed = false; }
      else { studyClearArmed = true; setTimeout(() => { if(!studyClearArmed) return; studyClearArmed = false; if(state.mode === 'admin' && state.adminTab === 'radar') render(); }, 6000); }
      render(); break;
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if(!f) return;
  e.preventDefault();
  if(f.dataset.form === 'name'){
    const v = f.querySelector('#name-in'); setUserName(v ? v.value : '');
    track('name', {gesetzt: !!userName()});
    closeSheet(); renderScreen(true); { const b = document.querySelector('.name-btn'); if(b) b.focus(); }
    return;
  }
  const input = f.querySelector('input'); const q = input ? input.value : '';
  if(!q.trim()) return;
  if(f.dataset.form === 'ask-home'){ go('chat'); ask(q, 'start'); }
  else { input.value = ''; ask(q, 'eingabe'); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.id === 'room-q'){ studyOnSearch(el.value); state.roomQuery = el.value; const r = $('room-results'); if(r) r.innerHTML = roomResults(el.value); return; }
  if(el.id === 'f-name'){ update({name: el.value.trim() ? el.value : BASE.name}); return; }
  if(el.id === 'f-city'){ update({city: el.value.trim() ? el.value : BASE.city}); return; }
  if(el.dataset.color){ update({[el.dataset.color]: el.value}); return; }
  if(el.dataset.hex){
    const h = normHex(el.value);
    if(h && el.value.replace('#','').length === 6){ el.removeAttribute('aria-invalid'); update({[el.dataset.hex]: h}); }
    else el.setAttribute('aria-invalid', 'true');
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'f-logo'){ handleLogo(el.files && el.files[0]); el.value = ''; }
  if(el.dataset.hex){ const h = normHex(el.value); if(h){ el.value = h; el.removeAttribute('aria-invalid'); update({[el.dataset.hex]: h}); } else { el.value = state.draft[el.dataset.hex]; el.removeAttribute('aria-invalid'); } }
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.remove('over'); handleLogo(e.dataTransfer.files && e.dataTransfer.files[0]); } });

/* hidden way into the settings: hold the university name in the app bar for 1.5 seconds */
let pressTimer = null;
document.addEventListener('pointerdown', e => {
  if(state.mode !== 'app' || ST.active || !e.target.closest('#brand')) return;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => { pressTimer = null; openAdmin(); }, 1500);
});
['pointerup','pointercancel','pointerleave'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(pressTimer); pressTimer = null; }, true));
document.addEventListener('contextmenu', e => { if(e.target.closest && e.target.closest('#brand')) e.preventDefault(); });

document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('map-overlay')){ closeMapOverlay(); const z = document.querySelector('[data-act="map-zoom"]'); if(z) z.focus(); }
  else if(state.sheet) closeSheet();
});
window.addEventListener('hashchange', render);
window.addEventListener('hashchange', () => {
  if(wantsAdmin()) return;
  if(previewWanted()) startStudy(true);
  else if(studyWanted()) startStudy(false);
  else if(/^#pilot$/i.test(location.hash) && !pilotInfo()) showPilotIntro();
  else if(/^#(hilfe|help)$/i.test(location.hash)){ go('help'); clearHash(); }
  else if(/^#app-tipp$/i.test(location.hash)){ previewGuide(); clearHash(); }
});
function clearHash(){ try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} }
window.addEventListener('storage', e => {
  if(e.key === LOG_KEY && state.mode === 'admin' && state.adminTab === 'radar') render();
  if(e.key === LOCAL_KEY && !saving){
    const dirty = !sameBranding(state.draft, SHARED);
    LOCAL = readLocal(); SHARED = pickShared();
    if(!dirty){ state.draft = SHARED; ssDel(DRAFT_KEY); }
    render();
  }
});
document.addEventListener('dblclick', e => { if(state.mode === 'app' && !ST.active && e.target.closest && e.target.closest('#brand')) openAdmin(); });

/* ================= Boot ================= */
function tick(){ const sb = $('sb-time'); if(sb){ const d = new Date(); sb.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); } }
setInterval(tick, 30000);
if(ssGet(AFTER_SAVE_KEY)){
  ssDel(AFTER_SAVE_KEY);
  if(!wantsAdmin()){ try { history.replaceState(null, '', '#einstellungen'); } catch(e){} }
  setTimeout(() => toast('Gespeichert, für alle und dauerhaft.'), 300);
}
render();
if(state.mode === 'app'){
  const restored = pilotWanted() && pilotFromUrl();
  const pi = pilotInfo();
  if(pi && !pi.ended && !restored) pilotUrl(pi.id);
  if(previewWanted()) startStudy(true);
  else if(pi && !pi.ended) startPilotSession('start');
  else if(pilotWanted() && !pi) showPilotIntro();
  else if(studyWanted() || (CFG.studie && !studyDone() && !pilotWanted())) startStudy(false);
  if(!ST.active && /^#(hilfe|help)$/i.test(location.hash)){ go('help'); clearHash(); }
  else if(!ST.active && /^#app-tipp$/i.test(location.hash)){ previewGuide(); clearHash(); }
}
if(REMOTE && pendingCount()) flush();
/* current menu, deadlines and events: daten.json (GitHub workflow, every night), the claude.ai database
   (Claude every morning) and the menu straight from OpenMensa; the newest wins */
loadDaten().then(loadOpenMensa, loadOpenMensa);
loadDb();
/* hook for automated tests of the chat (only when a test page sets window.__CAMPI_TEST__ before loading) */
if(window.__CAMPI_TEST__ && typeof window.__CAMPI_TEST__ === 'object') Object.assign(window.__CAMPI_TEST__, {answer, detectLang, understand, roomMatches, applyDaten, state, scrubName, setUserName, LIVE});
/* calibrated building positions (admin page, table "orte") */
if(REMOTE){
  SB.get('orte?select=id,lat,lon').then(rows => {
    if(!Array.isArray(rows)) return;
    lsSet(ORT_KEY, JSON.stringify(rows)); applyOrte(rows);
    if(state.mode === 'app' && state.tab === 'rooms') renderScreen(true);
  }).catch(() => {});
}
/* offline support and installation for the pilot (only on the GitHub version) */
if('serviceWorker' in navigator && window.isSecureContext && document.querySelector('link[rel="manifest"]')){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
