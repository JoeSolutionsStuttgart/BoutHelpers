/* Two views on one page: the plain link shows only the app; the link ending in #einstellungen opens the university settings (branding + question radar). App colors come from the three brand colors. */
:root{
  --page-bg:#E8EAEE;
  --page-surface:#FFFFFF;
  --page-field:#F4F5F7;
  --page-fg:#15171C;
  --page-muted:#596070;
  --page-line:#D5D9E0;
  --focus:#2F6FEB;
  --danger:#C23A2B;
  --device:#0D0E11;
  --font:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page-bg:#0E1013;--page-surface:#181B20;--page-field:#21252C;--page-fg:#ECEEF2;--page-muted:#A3AAB8;--page-line:#2C313A;--focus:#7AA7FF;--danger:#FF8A7A;--device:#000000;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page-bg:#0E1013;--page-surface:#181B20;--page-field:#21252C;--page-fg:#ECEEF2;--page-muted:#A3AAB8;--page-line:#2C313A;--focus:#7AA7FF;--danger:#FF8A7A;--device:#000000;color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--page-bg);color:var(--page-fg);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#root{min-height:100%}

/* ---------- phone frame (default) ---------- */
.device{width:392px;max-width:100%;height:min(844px, calc(100vh - 56px));min-height:560px;flex:none;padding:11px;border-radius:56px;background:var(--device);box-shadow:0 34px 70px -28px rgba(12,16,28,.55)}
.device .app{border-radius:46px}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 30px 2px;font-size:14px;font-weight:700;background:var(--a-bg);color:var(--a-fg);flex:none}
.statusbar .sb-icons{display:flex;gap:6px;align-items:center}
.statusbar .sb-icons i{display:block;background:currentColor;border-radius:2px}
.device .tabbar{padding-bottom:20px}

/* ---------- app-only view ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:28px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px))}
@media (max-width:959.98px){
  html[data-mode="app"], html[data-mode="app"] body{overflow:hidden}
  html[data-mode="app"] body{background:var(--a-page, var(--page-bg))}
  html[data-mode="app"] #root{height:100%}
  .stage{height:100%;padding:0;display:block}
  .stage .device{width:100%;max-width:560px;height:100%;min-height:0;margin-inline:auto;padding:0;border-radius:0;background:none;box-shadow:none}
  .stage .device .app{border-radius:0}
  .stage .statusbar{display:none}
  .stage .device .tabbar{padding-bottom:8px}
}

/* ---------- app shell (colors set from branding) ---------- */
.app{
  --a-primary:#14213D;--a-on-primary:#FFFFFF;--a-primary-ink:#14213D;--a-primary-soft:#E5E7EC;--a-primary-on-soft:#14213D;
  --a-accent:#E8572A;--a-on-accent:#15171C;--a-accent-ink:#A9401C;--a-accent-soft:#FBE4DA;--a-accent-on-soft:#963A19;
  --a-bg:#F7F5F0;--a-surface:#FDFCFA;--a-surface-2:#EEECE7;--a-fg:#171A22;--a-muted:#5A5F6A;--a-line:#E2DED6;--a-hero-muted:#C9CDD6;
  display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative;background:var(--a-bg);color:var(--a-fg);font-family:var(--font)
}
.appbar{flex:none;display:flex;align-items:center;gap:12px;padding:12px max(16px, env(safe-area-inset-right,0px)) 12px max(16px, env(safe-area-inset-left,0px));background:var(--a-bg);border-bottom:1px solid var(--a-line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.logo{display:flex;align-items:center;height:38px;flex:none}
.logo img{height:38px;width:auto;max-width:140px;object-fit:contain;display:block;-webkit-user-drag:none}
.logo.plate{background:#FFFFFF;border-radius:10px;padding:4px 8px}
.logo.plate img{height:30px}
.logo.mono{width:38px;border-radius:11px;background:var(--a-primary);color:var(--a-on-primary);justify-content:center;font-weight:800;font-size:14px;letter-spacing:.03em}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-name{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:12px;color:var(--a-muted)}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.screen.is-chat{overflow:hidden;display:flex;flex-direction:column}
.pad{padding:18px max(16px, env(safe-area-inset-right,0px)) 28px max(16px, env(safe-area-inset-left,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--a-muted)}
.screen-head{display:flex;flex-direction:column;gap:4px}
.screen-head h1{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.screen-head p{font-size:14px}

/* start */
.hero{position:relative;overflow:hidden;background:var(--a-primary);color:var(--a-on-primary);border-radius:24px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:4px}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:132px;height:132px;border-radius:50%;background:var(--a-accent)}
.hero > *{position:relative;z-index:1}
.hero-date{font-size:13px;color:var(--a-hero-muted);padding-right:70px}
.hero-title{font-size:25px;font-weight:800;line-height:1.15;letter-spacing:-.01em;padding-right:70px;margin-bottom:12px}
.ask{display:flex;align-items:center;gap:8px;background:var(--a-surface);color:var(--a-fg);border-radius:15px;padding:5px 5px 5px 12px}
.ask .ic{color:var(--a-accent-ink)}
.ask input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--a-fg);padding:9px 0;outline:none}
.ask input::placeholder,.composer input::placeholder,.search input::placeholder{color:var(--a-muted);opacity:1}
.ask button{width:42px;height:42px;border-radius:12px;border:0;background:var(--a-accent);color:var(--a-on-accent);display:grid;place-items:center;flex:none}
.card{background:var(--a-surface);border:1px solid var(--a-line);border-radius:20px;padding:16px}
.label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--a-accent-ink)}
.card h2{font-size:19px;font-weight:700;line-height:1.25;margin-top:4px}
.card .sub{font-size:14px;color:var(--a-muted);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:13px;border:0;font-weight:700;font-size:15px}
.btn .ic{width:20px;height:20px}
.btn-primary{background:var(--a-primary);color:var(--a-on-primary)}
.btn-block{width:100%;margin-top:14px}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--a-accent-soft);color:var(--a-fg);border-radius:20px;padding:14px 16px}
.notice-ico{width:38px;height:38px;border-radius:11px;background:var(--a-accent);color:var(--a-on-accent);display:grid;place-items:center;flex:none}
.notice-ico .ic{width:20px;height:20px}
.notice strong{display:block;font-size:15px}
.notice p{font-size:14px;margin-top:2px}
.link{background:none;border:0;padding:0;min-height:34px;font-weight:700;font-size:14px;color:var(--a-primary-ink);text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center}
.notice .link{color:var(--a-accent-on-soft)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.sec-head h3{font-size:16px;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:18px;background:var(--a-surface);border:1px solid var(--a-line);text-align:left;color:var(--a-fg);min-height:108px}
.tico{width:40px;height:40px;border-radius:12px;background:var(--a-primary-soft);color:var(--a-primary-on-soft);display:grid;place-items:center}
.tile b{font-size:15px;line-height:1.2}
.tile .tsub{font-size:13px;color:var(--a-muted);margin-top:2px;display:block}
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--a-line)}
.row:first-child{border-top:0;padding-top:2px}
.row .rt{min-width:0}
.row .rt b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.row .rt span{display:block;font-size:13px;color:var(--a-muted)}
.row .rv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.datebox{width:46px;flex:none;border-radius:12px;background:var(--a-primary-soft);color:var(--a-primary-on-soft);text-align:center;padding:6px 0;line-height:1.1}
.datebox b{display:block;font-size:16px}
.datebox span{font-size:11px;font-weight:700;text-transform:uppercase}
.foot-note{font-size:12px;color:var(--a-muted);text-align:center}

/* chips, search */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar,.suggest::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--a-line);background:var(--a-surface);color:var(--a-fg);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.chip .ic{width:17px;height:17px}
.chip[aria-pressed="true"]{background:var(--a-primary);color:var(--a-on-primary);border-color:var(--a-primary)}
.search{display:flex;align-items:center;gap:10px;background:var(--a-surface);border:1px solid var(--a-line);border-radius:15px;padding:0 12px;color:var(--a-muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--a-fg);padding:13px 0;outline:none}
.results{display:flex;flex-direction:column;background:var(--a-surface);border:1px solid var(--a-line);border-radius:15px;overflow:hidden}
.result{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;border-top:1px solid var(--a-line);color:var(--a-fg);text-align:left}
.result:first-child{border-top:0}
.result span{font-size:13px;color:var(--a-muted)}
.empty{font-size:14px;color:var(--a-muted);padding:14px}

/* rooms */
.room-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700;background:var(--a-accent-soft);color:var(--a-accent-on-soft);white-space:nowrap}
.pill .ic{width:16px;height:16px}
.route-opts{display:flex;align-items:center;gap:10px;margin-top:12px;min-width:0}
.ro-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--a-muted);width:40px;flex:none}
.route-opts .chips{flex:1;min-width:0;flex-wrap:wrap;overflow:visible}
.chip-sm{min-height:34px;padding:5px 11px;font-size:13px}
.map-wrap{position:relative;margin:14px -16px 0;border-top:1px solid var(--a-line);border-bottom:1px solid var(--a-line);background:#E9EAEC}
.map{width:100%;max-width:100%;height:auto;display:block}
.map-zoom{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:12px;border:0;background:var(--a-surface);color:var(--a-fg);display:grid;place-items:center;box-shadow:0 4px 14px -4px rgba(0,0,0,.35)}
.map-zoom .ic{width:20px;height:20px}
.route{stroke-dasharray:7 7;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.map-overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--a-bg)}
.mo-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px, env(safe-area-inset-right,0px)) 12px max(16px, env(safe-area-inset-left,0px));border-bottom:1px solid var(--a-line)}
.mo-head b{display:block;font-size:16px}
.mo-head span{display:block;font-size:13px;color:var(--a-muted)}
.mo-close{width:42px;height:42px;border-radius:13px;border:0;background:var(--a-surface-2);color:var(--a-fg);display:grid;place-items:center;flex:none}
.mo-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;background:#E9EAEC;-webkit-overflow-scrolling:touch}
.mo-inner{width:760px;max-width:none}
.map-big{width:760px;max-width:none}
.steps{margin:14px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.35}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--a-primary);color:var(--a-on-primary);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.note-line{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--a-muted);margin-top:12px}
.note-line .ic{width:18px;height:18px;margin-top:1px}
.src{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--a-muted)}
.src .ic{width:16px;height:16px}

/* mensa */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;border-radius:13px;border:1px solid var(--a-line);background:var(--a-surface);color:var(--a-fg)}
.day b{font-size:15px}
.day span{font-size:12px;color:var(--a-muted);font-variant-numeric:tabular-nums}
.day[aria-selected="true"]{background:var(--a-primary);color:var(--a-on-primary);border-color:var(--a-primary)}
.day[aria-selected="true"] span{color:var(--a-on-primary)}
.dishes{display:flex;flex-direction:column;gap:10px}
.dish{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.dish h3{font-size:16px;font-weight:700;line-height:1.3}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;font-weight:700;border-radius:8px;padding:4px 8px;background:var(--a-surface-2);color:var(--a-fg);display:inline-flex;align-items:center;gap:4px}
.tag .ic{width:14px;height:14px}
.tag.veg{background:var(--a-accent-soft);color:var(--a-accent-on-soft)}
.price{text-align:right;white-space:nowrap;flex:none}
.price b{font-size:18px;font-variant-numeric:tabular-nums}
.price span{display:block;font-size:12px;color:var(--a-muted)}
.allergen{font-size:13px;color:var(--a-muted);margin-top:8px}

/* chat */
.chat-head{flex:none;display:flex;align-items:center;gap:8px;padding:9px max(16px, env(safe-area-inset-right,0px)) 9px max(16px, env(safe-area-inset-left,0px));border-bottom:1px solid var(--a-line);font-size:13px;color:var(--a-muted)}
.chat-head .ic{width:17px;height:17px;color:var(--a-accent-ink)}
.chat-log{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;max-width:90%}
.msg.me{align-self:flex-end}
.msg.me p{background:var(--a-primary);color:var(--a-on-primary);padding:10px 14px;border-radius:18px 18px 5px 18px;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.avatar{width:30px;height:30px;border-radius:10px;background:var(--a-accent);color:var(--a-on-accent);display:grid;place-items:center;flex:none;margin-top:2px}
.avatar .ic{width:18px;height:18px}
.bubble{min-width:0;background:var(--a-surface);border:1px solid var(--a-line);border-radius:18px 18px 18px 5px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:15px;line-height:1.45}
.bubble p{overflow-wrap:anywhere}
.msg.unsure .bubble{border-style:dashed;border-color:var(--a-accent-ink)}
.tag-unsure{font-size:12px;font-weight:700;color:var(--a-accent-ink);display:inline-flex;gap:5px;align-items:center}
.tag-unsure .ic{width:15px;height:15px}
.src-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--a-primary-on-soft);background:var(--a-primary-soft);border-radius:8px;padding:4px 8px}
.src-chip .ic{width:15px;height:15px}
.act-btn{border:0;background:var(--a-primary);color:var(--a-on-primary);border-radius:11px;padding:9px 12px;font-size:14px;font-weight:700;display:inline-flex;gap:6px;align-items:center;min-height:40px}
.act-btn .ic{width:17px;height:17px}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--a-muted);animation:blink 1.1s infinite}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.suggest{flex:none;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px max(16px, env(safe-area-inset-right,0px)) 8px max(16px, env(safe-area-inset-left,0px))}
.suggest .chip{font-size:13.5px}
.composer{flex:none;display:flex;gap:8px;padding:8px max(12px, env(safe-area-inset-right,0px)) 10px max(12px, env(safe-area-inset-left,0px));border-top:1px solid var(--a-line);background:var(--a-bg)}
.composer input{flex:1;min-width:0;border:1px solid var(--a-line);background:var(--a-surface);border-radius:15px;padding:12px 14px;font:inherit;font-size:16px;color:var(--a-fg)}
.send{width:50px;border-radius:15px;border:0;background:var(--a-accent);color:var(--a-on-accent);display:grid;place-items:center;flex:none}

/* discover */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--a-surface-2);border-radius:15px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:11px;padding:10px;font-weight:700;color:var(--a-muted);min-height:42px}

(function(){
'use strict';

/* ================= Branding ================= */
const BASE = {name:'Hochschule Musterstadt', city:'Musterstadt', logo:null, primary:'#14213D', accent:'#E8572A', background:'#F7F5F0'};
const PRESETS = [
  {name:'Campi', primary:'#14213D', accent:'#E8572A', background:'#F7F5F0'},
  {name:'Blau und Gelb', primary:'#0B4F9C', accent:'#F2B705', background:'#F3F6FA'},
  {name:'Grün', primary:'#0E5E46', accent:'#F28C28', background:'#F4F7F3'},
  {name:'Bordeaux', primary:'#7A1E3A', accent:'#D9A441', background:'#FAF6F3'},
  {name:'Petrol', primary:'#00616E', accent:'#E5486A', background:'#F2F7F7'},
  {name:'Dunkel', primary:'#3D7BFD', accent:'#FFB020', background:'#121418'}
];
const DRAFT_KEY = 'campi-draft-v1', LOG_KEY = 'campi-demo-log-v1', AFTER_SAVE_KEY = 'campi-after-save', LOCAL_KEY = 'campi-branding-v1';

function cleanBranding(o){
  const b = Object.assign({}, BASE);
  if(o && typeof o === 'object'){
    if(typeof o.name === 'string' && o.name.trim()) b.name = o.name.slice(0,60);
    if(typeof o.city === 'string' && o.city.trim()) b.city = o.city.slice(0,40);
    if(typeof o.logo === 'string' && /^data:image\/(png|jpeg|webp|gif|svg\+xml);base64,[A-Za-z0-9+/=]+$/.test(o.logo)) b.logo = o.logo;
    ['primary','accent','background'].forEach(k => { const h = normHex(o[k]); if(h) b[k] = h; });
  }
  return b;
}
let SAVED_AT = null;
function readShared(){
  try {
    const raw = JSON.parse(document.getElementById('branding-data').textContent);
    if(raw && typeof raw.savedAt === 'string' && !isNaN(Date.parse(raw.savedAt))) SAVED_AT = raw.savedAt;
    return cleanBranding(raw);
  }
  catch(e){ return cleanBranding(null); }
}
function fmtTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE', {day:'numeric', month:'numeric', year:'numeric'}) + ', ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0') + ' Uhr';
}
function ssGet(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
function ssSet(k, v){ try { sessionStorage.setItem(k, v); } catch(e){} }

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

/* ================= Color helpers ================= */
function normHex(h){
  if(typeof h !== 'string') return null;
  const m = h.trim().match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if(!m) return null;
  let s = m[1];
  if(s.length === 3) s = s.split('').map(c => c + c).join('');
  return '#' + s.toUpperCase();
}
function rgb(h){ const n = parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function hex(a){ return '#' + a.map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase(); }
function mix(a,b,t){ const x = rgb(a), y = rgb(b); return hex(x.map((v,i) => v + (y[i]-v)*t)); }
function lum(h){
  const w = [0.2126,0.7152,0.0722];
  return rgb(h).reduce((s,v,i) => { v/=255; v = v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); return s + v*w[i]; }, 0);
}
function contrast(a,b){ const l1 = lum(a), l2 = lum(b); return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05); }
const INK_DARK = '#15171C', INK_LIGHT = '#FFFFFF';
function onColor(bg){ return contrast(bg, INK_LIGHT) >= contrast(bg, INK_DARK) ? INK_LIGHT : INK_DARK; }
function ensure(c, against, min){
  if(contrast(c, against) >= min) return c;
  const target = lum(against) > 0.35 ? '#000000' : '#FFFFFF';
  for(let t = 0.06; t <= 1.0001; t += 0.06){ const m = mix(c, target, t); if(contrast(m, against) >= min) return m; }
  return target === '#000000' ? INK_DARK : INK_LIGHT;
}

  const bg = b.background, dark = lum(bg) < 0.2;
  const fg = ensure(dark ? '#F2F3F6' : mix('#15171C', b.primary, 0.12), bg, 9);
  const surface = dark ? mix(bg,'#FFFFFF',0.07) : (lum(bg) > 0.92 ? '#FFFFFF' : mix(bg,'#FFFFFF',0.7));
  const surface2 = dark ? mix(bg,'#FFFFFF',0.13) : mix(bg, b.primary, 0.07);
  const line = mix(bg, fg, dark ? 0.17 : 0.12);

  const primaryInk = ensure(ensure(b.primary, surface, 4.6), bg, 4.6);
  const accentInk = ensure(ensure(b.accent, surface, 4.6), bg, 4.6);
  const primarySoft = mix(surface, b.primary, dark ? 0.24 : 0.1);
  const accentSoft = mix(surface, b.accent, dark ? 0.24 : 0.15);
  const onPrimary = onColor(b.primary);

    '--a-primary': b.primary, '--a-on-primary': onPrimary, '--a-primary-ink': primaryInk,
    '--a-primary-soft': primarySoft, '--a-primary-on-soft': ensure(primaryInk, primarySoft, 4.6),
    '--a-accent': b.accent, '--a-on-accent': onColor(b.accent), '--a-accent-ink': accentInk,
    '--a-accent-soft': accentSoft, '--a-accent-on-soft': ensure(accentInk, accentSoft, 4.6),
    '--a-bg': bg, '--a-surface': surface, '--a-surface-2': surface2, '--a-fg': fg, '--a-muted': muted, '--a-line': line,
    '--a-hero-muted': ensure(mix(onPrimary, b.primary, 0.25), b.primary, 4.6),
    dark

function detectDeviceLang(){
  const list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'de']);
  for(const l of list){ const k = String(l).slice(0, 2).toLowerCase(); if(LANGS.includes(k)) return k; }
  return 'de';
}
const LANG_KEY = 'campi-sprache-v1';
let LANG = (() => { const s = lsGet(LANG_KEY); return LANGS.includes(s) ? s : detectDeviceLang(); })();
function t(key, vars, lang){
  const L = lang || LANG;
  let s = (STR[L] && STR[L][key]) || STR.de[key] || key;
  if(vars) s = s.replace(/\{(\w+)\}/g, (m, k) => vars[k] !== undefined ? vars[k] : m);
  return s;
}
function tl(key, lang){ return t(key, null, lang).split('|'); }
/* content objects: {de:'…', en:'…'} or plain strings */
function L(o, lang){ if(o === null || o === undefined) return ''; if(typeof o === 'string') return o; const l = lang || LANG; return o[l] || o.de || o.en || ''; }
function ordinal(n, lang){
  if(lang === 'en'){ const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  if(lang === 'fr') return n === 1 ? '1er' : n + 'e';
  return String(n);
}
function floorLabel(f, lang){
  if(f === 0) return t('floor0', null, lang);
  if(f < 0) return t('floorU', null, lang);
  return t('floorN', {n: f, o: ordinal(f, lang || LANG)}, lang);
}

  de: {help_btn:'Hilfe und Tipps', help_title:'Hilfe & Tipps', help_sub:'So verstehst du Campi und holst das meiste heraus.', help_areas:'Das kann Campi', help_a_start:'Dein Tag auf einen Blick: nächste Vorlesung, Raumänderungen, Mensa und Termine.', help_a_rooms:'Raum per Nummer oder Name suchen und den Weg auf dem Lageplan sehen, auf Wunsch live mit deinem Standort.', help_a_chat:'Stell Fragen in deinen eigenen Worten und deiner Sprache, z. B. zu Fristen, WLAN oder Öffnungszeiten. Antworten mit Quelle.', help_a_mensa:'Speiseplan der Woche mit Preisen und Filtern für vegan, vegetarisch und glutenfrei.', help_a_disc:'{studi}: Fristen, Termine und Anlaufstellen. {stadt}: Tipps für {city}.', help_tips:'Tipps für den Alltag', help_t_ask:'Frag einfach drauflos', help_t_ask_s:'Ganze Sätze, Stichworte, auch mit Tippfehlern: Campi versteht dich auf Deutsch, Englisch, Spanisch, Italienisch, Französisch und Türkisch. Probier es aus:', help_t_code:'Raumnummern lesen', help_t_code_s:'Der Buchstabe vorne steht für den Campus: S = Stadtmitte, F = Flandernstraße, G = Göppingen. Die erste Ziffer nach dem Punkt ist meist das Stockwerk (0 = Erdgeschoss). Tipp die Nummer einfach in die Raumsuche.', help_t_campus:'Campus wechseln', help_t_campus_s:'Tippe auf der Startseite auf den Namen deines Campus. Räume, Mensa und Tipps passen sich an.', help_t_lang:'Sprache wechseln', help_t_lang_s:'Tippe oben rechts auf das Sprachkürzel. Die ganze App wechselt die Sprache, Campi antwortet in der Sprache deiner Frage.', help_t_name:'Mit Namen begrüßt werden', help_t_name_s:'Tippe auf den Stift neben der Begrüßung. Dein Name bleibt nur auf deinem Gerät.', help_t_live:'Live-Karte nutzen', help_t_live_s:'Unter {rooms} › {live} siehst du dich selbst auf dem Weg zum Raum. Dafür fragt Campi einmal nach deinem Standort; der Lageplan funktioniert auch ohne.', help_t_unsure:'Wenn Campi unsicher ist', help_t_unsure_s:'Antworten mit gestricheltem Rahmen sind nicht geprüft. Campi nennt dir dann die Stelle der Hochschule, die weiterhilft, und zeigt dir den Weg dorthin.', help_app_done:'Du nutzt Campi schon als App vom Home-Bildschirm. Alles bereit.', help_faq:'Häufige Fragen', help_f1:'Ist Campi die offizielle App der Hochschule?', help_f1a:'Nein. Campi ist ein inoffizieller Prototyp aus einem Studienprojekt. Verbindlich sind immer die Angaben der Hochschule Esslingen.', help_f2:'Wie aktuell sind die Angaben?', help_f2a:'Speiseplan, Fristen und Veranstaltungen werden täglich von den offiziellen Seiten übernommen, mit Stand und Quelle. Vorlesungen und einzelne Räume sind Beispiele.', help_f3:'Was passiert mit meinen Daten?', help_f3a:'Nur im App-Test und in der Pilotphase, und nur nach deiner Einwilligung, wird anonym erfasst, wie Campi genutzt wird, zum Beispiel welche Seiten du öffnest. Dein Name bleibt auf deinem Gerät, dein Standort wird nur mit Zustimmung und gerundet gespeichert.', help_f4:'Wie beende ich die Pilotphase?', help_f4a:'Ganz unten auf der Startseite: „{end}“.', help_more:'Noch etwas unklar?', help_more_s:'Frag Campi direkt, zum Beispiel „Wie finde ich einen Raum?“', help_ask_btn:'Frag Campi', help_card_t:'Neu bei Campi?', help_card_s:'Hilfe & Tipps: So nutzt du die App am besten.', help_open:'Hilfe öffnen', g_kicker:'Einmaliger Tipp', g_title:'Campi wie eine App nutzen', g_intro:'Leg Campi auf deinen Home-Bildschirm. Dann öffnest du es mit einem Tipp, im Vollbild und ohne Adressleiste, wie eine App. Das dauert 20 Sekunden.', g_tabs:'Dein Gerät', g_ios:'iPhone', g_android:'Android', g_desktop:'Computer', g_ios1:'Tippe auf „Teilen“', g_ios1s:'Das Quadrat mit dem Pfeil nach oben: in Safari unten in der Mitte, auf dem iPad oben rechts.', g_ios2:'Wähle „Zum Home-Bildschirm“', g_ios2s:'Siehst du es nicht, scroll in der Liste etwas nach unten.', g_ios3:'Tippe oben rechts auf „Hinzufügen“', g_ios3s:'Campi liegt jetzt als Symbol auf deinem Home-Bildschirm. Öffne es ab jetzt dort.', g_ios_note:'In Chrome oder einem anderen Browser liegt „Teilen“ oben rechts neben der Adresse.', g_and1:'Tippe oben rechts auf das Menü ⋮', g_and1s:'Die drei Punkte neben der Adresszeile.', g_and2:'Wähle „App installieren“ oder „Zum Startbildschirm hinzufügen“', g_and2s:'Je nach Browser heißt der Eintrag etwas anders.', g_and3:'Bestätige mit „Installieren“ oder „Hinzufügen“', g_and3s:'Campi liegt jetzt als Symbol auf deinem Startbildschirm. Öffne es ab jetzt dort.', g_android_note:'Samsung Internet: Menü ≡ unten rechts, dann „Seite hinzufügen zu“ und „Startbildschirm“.', g_desk1:'Chrome oder Edge: auf das Installieren-Symbol klicken', g_desk1s:'Rechts in der Adressleiste, oder im Menü ⋮ auf „Installieren“.', g_desk2:'Safari auf dem Mac: „Ablage“ › „Zum Dock hinzufügen“', g_desk2s:'Campi erscheint dann im Dock wie ein Programm.', g_desk3:'Firefox: ein Lesezeichen anlegen', g_desk3s:'Mit Strg + D (Mac: ⌘ + D). Firefox kann Websites nicht als App installieren.', g_desktop_note:'Am besten probierst du Campi aber auf deinem Handy aus.', g_direct:'Jetzt installieren', g_again:'Du findest diese Anleitung jederzeit wieder unter „Hilfe & Tipps“ (das Fragezeichen oben rechts) und unten auf der Startseite.', g_ok:'Verstanden, weiter zur App', g_link:'Campi als App nutzen', g_btn:'So geht’s', ask_hint:'Frag Campi alles, was du wissen willst', ask_examples:'Was gibt es heute zu essen?|Wo ist die Bibliothek?|Wie komme ich ins WLAN?|Was ist heute los?|Wo kann ich parken?', task_now:'Deine Aufgabe', name_title:'Wie sollen wir dich nennen?', name_label:'Dein Vorname', name_hint:'Wird nur auf diesem Gerät gespeichert und nicht übertragen.', name_save:'Speichern', name_clear:'Ohne Namen', name_edit:'Namen ändern', name_add:'Namen eintragen', no_events:'Gerade liegen keine aktuellen Veranstaltungen vor.', events_cal:'Veranstaltungskalender der Hochschule', mensa_src_live:'Quelle: Studierendenwerk Stuttgart (über OpenMensa) · Stand {stand}', no_menu_day:'Für diesen Tag liegt kein Speiseplan vor.', closed_day:'An diesem Tag ist die Mensa geschlossen.', live_src:'Fristen und Termine: Stand {stand}', brand_sub:'Inoffizieller Prototyp', live_here:'Du bist am Ziel: {b}', step_walk_live:'Etwa {m} zu Fuß bis {b}, rund {min} Min.', cafe_src:'Quelle: Studierendenwerk Stuttgart, Stand Oktober 2026', more:'Mehr', today:'Heute', mensa_closed_t:'Keine Mensa mit warmen Gerichten', seats:'{n} Sitzplätze', closed_on:'Geschlossen: {d}', menu_link:'Aktueller Speiseplan',
    walk_min:'{n} Min. zu Fuß', bus_min:'{n} Min. mit dem Bus', pos_approx:'Die Gebäudeposition ist angenähert.', map_tiles_fail:'Kartenbilder konnten nicht geladen werden. Gebäude und Standort siehst du trotzdem.',
    st_geo_pilot:'Freiwillig: Meinen Standort verwenden, solange Campi geöffnet ist, und auf etwa 10 m gerundet speichern.',
    chat_intro:'Hallo {name}, ich bin Campi, dein Campus-Assistent für die {uni}. Frag mich zu Räumen, Mensa, Fristen oder zum Leben in {city}. Ich antworte in deiner Sprache, nur aus geprüften Quellen, und zeige dir immer, woher die Antwort stammt.',
    st_text:'Campi ist der Prototyp einer App für Studierende der Hochschule Esslingen, kein offizielles Angebot der Hochschule. Du löst drei kleine Aufgaben und beantwortest danach ein paar kurze Fragen. Getestet wird die App, nicht du. Gebäude und Öffnungszeiten sind echt, einzelne Räume, Gerichte und Termine sind Beispieldaten.',
    rooms_src:'Quelle: Gebäudeübersichten der Hochschule Esslingen · einzelne Räume sind Beispieldaten', mensa_src:'Quelle: Studierendenwerk Stuttgart, Stand Oktober 2026 · Gerichte sind Beispieldaten', footnote:'Prototyp · Räume, Gerichte und Termine teils Beispieldaten'},
  en: {help_btn:'Help and tips', help_title:'Help & tips', help_sub:'How Campi works and how to get the most out of it.', help_areas:'What Campi can do', help_a_start:'Your day at a glance: next lecture, room changes, Mensa and events.', help_a_rooms:'Search for a room by number or name and see the way on the campus map, live with your location if you like.', help_a_chat:'Ask questions in your own words and language, e.g. about deadlines, Wi-Fi or opening hours. Answers come with a source.', help_a_mensa:'This week’s menu with prices and filters for vegan, vegetarian and gluten-free.', help_a_disc:'{studi}: deadlines, events and contacts. {stadt}: tips for {city}.', help_tips:'Everyday tips', help_t_ask:'Just ask', help_t_ask_s:'Full sentences or keywords, even with typos: Campi understands you in German, English, Spanish, Italian, French and Turkish. Try it:', help_t_code:'Reading room numbers', help_t_code_s:'The letter at the front stands for the campus: S = Stadtmitte, F = Flandernstraße, G = Göppingen. The first digit after the dot is usually the floor (0 = ground floor). Just type the number into the room search.', help_t_campus:'Switch campus', help_t_campus_s:'Tap the name of your campus on the start page. Rooms, Mensa and tips adapt.', help_t_lang:'Change language', help_t_lang_s:'Tap the language code at the top right. The whole app switches, and Campi answers in the language of your question.', help_t_name:'Be greeted by name', help_t_name_s:'Tap the pencil next to the greeting. Your name stays on your device only.', help_t_live:'Use the live map', help_t_live_s:'Under {rooms} › {live} you can see yourself on the way to the room. Campi asks for your location once; the campus map works without it too.', help_t_unsure:'When Campi isn’t sure', help_t_unsure_s:'Answers with a dashed border are not verified. Campi then tells you which university office can help and shows you the way there.', help_app_done:'You’re already using Campi as an app from your home screen. All set.', help_faq:'Frequently asked questions', help_f1:'Is Campi the university’s official app?', help_f1a:'No. Campi is an unofficial prototype from a student project. What Hochschule Esslingen publishes is always what counts.', help_f2:'How up to date is the information?', help_f2a:'The menu, deadlines and events are taken from the official websites every day, with date and source. Lectures and some rooms are examples.', help_f3:'What happens to my data?', help_f3a:'Only in the app test and the pilot phase, and only after you agree, Campi records anonymously how it is used, for example which pages you open. Your name stays on your device; your location is only saved with your consent and rounded.', help_f4:'How do I leave the pilot phase?', help_f4a:'At the very bottom of the start page: “{end}”.', help_more:'Still unsure about something?', help_more_s:'Ask Campi directly, for example “How do I find a room?”', help_ask_btn:'Ask Campi', help_card_t:'New to Campi?', help_card_s:'Help & tips: how to get the most out of the app.', help_open:'Open help', g_kicker:'One-time tip', g_title:'Use Campi like an app', g_intro:'Add Campi to your home screen. Then you open it with one tap, full screen and without the address bar, just like an app. It takes 20 seconds.', g_tabs:'Your device', g_ios:'iPhone', g_android:'Android', g_desktop:'Computer', g_ios1:'Tap “Share”', g_ios1s:'The square with the arrow pointing up: at the bottom centre in Safari, top right on the iPad.', g_ios2:'Choose “Add to Home Screen”', g_ios2s:'If you can’t see it, scroll down the list a little.', g_ios3:'Tap “Add” in the top right', g_ios3s:'Campi is now an icon on your home screen. Open it from there from now on.', g_ios_note:'In Chrome or another browser, “Share” is at the top right next to the address.', g_and1:'Tap the menu ⋮ in the top right', g_and1s:'The three dots next to the address bar.', g_and2:'Choose “Install app” or “Add to Home screen”', g_and2s:'The name differs slightly between browsers.', g_and3:'Confirm with “Install” or “Add”', g_and3s:'Campi is now an icon on your home screen. Open it from there from now on.', g_android_note:'Samsung Internet: menu ≡ at the bottom right, then “Add page to” and “Home screen”.', g_desk1:'Chrome or Edge: click the install icon', g_desk1s:'On the right of the address bar, or “Install” in the ⋮ menu.', g_desk2:'Safari on a Mac: “File” › “Add to Dock”', g_desk2s:'Campi then appears in the Dock like a program.', g_desk3:'Firefox: add a bookmark', g_desk3s:'With Ctrl + D (Mac: ⌘ + D). Firefox can’t install websites as apps.', g_desktop_note:'It works best if you try Campi on your phone, though.', g_direct:'Install now', g_again:'You can find these instructions again any time under “Help & tips” (the question mark at the top right) and at the bottom of the start page.', g_ok:'Got it, on to the app', g_link:'Use Campi as an app', g_btn:'How it works', ask_hint:'Ask Campi anything you want to know', ask_examples:'What’s for lunch today?|Where is the library?|How do I get on the Wi-Fi?|What’s on today?|Where can I park?', task_now:'Your task', name_title:'What should we call you?', name_label:'Your first name', name_hint:'Only saved on this device and never sent anywhere.', name_save:'Save', name_clear:'No name', name_edit:'Change name', name_add:'Add your name', no_events:'No current events right now.', events_cal:'University event calendar', mensa_src_live:'Source: Studierendenwerk Stuttgart (via OpenMensa) · updated {stand}', no_menu_day:'There’s no menu for this day.', closed_day:'The Mensa is closed on this day.', live_src:'Deadlines and events: updated {stand}', brand_sub:'Unofficial prototype', live_here:'You’ve arrived: {b}', step_walk_live:'About {m} on foot to {b}, roughly {min} min', cafe_src:'Source: Studierendenwerk Stuttgart, October 2026', more:'More', today:'Today', mensa_closed_t:'No Mensa with hot meals', seats:'{n} seats', closed_on:'Closed: {d}', menu_link:'Current menu',
    walk_min:'{n} min on foot', bus_min:'{n} min by bus', pos_approx:'The building position is approximate.', map_tiles_fail:'Map images couldn’t be loaded. You can still see the buildings and your position.',
    st_geo_pilot:'Optional: use my location while Campi is open and store it rounded to about 10 m.',
    chat_intro:'Hi {name}, I’m Campi, your campus assistant for {uni}. Ask me about rooms, the Mensa, deadlines or life in {city}. I answer in your language, only from verified sources, and always show you where the answer comes from.',
    st_text:'Campi is a prototype app for students at Esslingen University, not an official university service. You will solve three small tasks and then answer a few short questions. We are testing the app, not you. Buildings and opening hours are real; some rooms, dishes and dates are sample data.',
    rooms_src:'Source: Esslingen University building overviews · some rooms are sample data', mensa_src:'Source: Studierendenwerk Stuttgart, October 2026 · dishes are sample data', footnote:'Prototype · some rooms, dishes and dates are sample data'},
  es: {help_btn:'Ayuda y consejos', help_title:'Ayuda y consejos', help_sub:'Cómo funciona Campi y cómo sacarle el máximo partido.', help_areas:'Lo que puede hacer Campi', help_a_start:'Tu día de un vistazo: próxima clase, cambios de aula, comedor y eventos.', help_a_rooms:'Busca un aula por número o nombre y mira el camino en el plano, en vivo con tu ubicación si quieres.', help_a_chat:'Haz preguntas con tus propias palabras y en tu idioma, p. ej. sobre plazos, wifi u horarios. Las respuestas llevan fuente.', help_a_mensa:'El menú de la semana con precios y filtros vegano, vegetariano y sin gluten.', help_a_disc:'{studi}: plazos, eventos y contactos. {stadt}: consejos para {city}.', help_tips:'Consejos para el día a día', help_t_ask:'Pregunta sin más', help_t_ask_s:'Frases completas o palabras clave, incluso con erratas: Campi te entiende en alemán, inglés, español, italiano, francés y turco. Pruébalo:', help_t_code:'Leer números de aula', help_t_code_s:'La letra del principio indica el campus: S = Stadtmitte, F = Flandernstraße, G = Göppingen. La primera cifra después del punto suele ser la planta (0 = planta baja). Escribe el número en la búsqueda de aulas.', help_t_campus:'Cambiar de campus', help_t_campus_s:'Toca el nombre de tu campus en la página de inicio. Aulas, comedor y consejos se adaptan.', help_t_lang:'Cambiar de idioma', help_t_lang_s:'Toca el código de idioma arriba a la derecha. Toda la app cambia de idioma y Campi responde en el idioma de tu pregunta.', help_t_name:'Que te salude por tu nombre', help_t_name_s:'Toca el lápiz junto al saludo. Tu nombre se queda solo en tu dispositivo.', help_t_live:'Usar el mapa en vivo', help_t_live_s:'En {rooms} › {live} te ves a ti mismo de camino al aula. Campi pide tu ubicación una vez; el plano también funciona sin ella.', help_t_unsure:'Cuando Campi no está seguro', help_t_unsure_s:'Las respuestas con borde discontinuo no están verificadas. Campi te indica entonces qué oficina de la universidad puede ayudarte y te muestra el camino.', help_app_done:'Ya usas Campi como app desde tu pantalla de inicio. Todo listo.', help_faq:'Preguntas frecuentes', help_f1:'¿Es Campi la app oficial de la universidad?', help_f1a:'No. Campi es un prototipo no oficial de un proyecto de estudiantes. Lo que vale siempre es la información de la Hochschule Esslingen.', help_f2:'¿Qué tan actual es la información?', help_f2a:'El menú, los plazos y los eventos se toman cada día de las webs oficiales, con fecha y fuente. Las clases y algunas aulas son ejemplos.', help_f3:'¿Qué pasa con mis datos?', help_f3a:'Solo en la prueba de la app y en la fase piloto, y solo con tu consentimiento, se registra de forma anónima cómo se usa Campi, por ejemplo qué páginas abres. Tu nombre se queda en tu dispositivo; tu ubicación solo se guarda con tu permiso y redondeada.', help_f4:'¿Cómo salgo de la fase piloto?', help_f4a:'Al final de la página de inicio: “{end}”.', help_more:'¿Algo no queda claro?', help_more_s:'Pregúntale a Campi directamente, por ejemplo “¿Cómo encuentro un aula?”', help_ask_btn:'Pregunta a Campi', help_card_t:'¿Nuevo en Campi?', help_card_s:'Ayuda y consejos: cómo sacar el máximo partido a la app.', help_open:'Abrir ayuda', g_kicker:'Consejo único', g_title:'Usa Campi como una app', g_intro:'Añade Campi a tu pantalla de inicio. Así lo abres con un toque, a pantalla completa y sin barra de direcciones, como una app. Tardas 20 segundos.', g_tabs:'Tu dispositivo', g_ios:'iPhone', g_android:'Android', g_desktop:'Ordenador', g_ios1:'Toca “Compartir”', g_ios1s:'El cuadrado con la flecha hacia arriba: en Safari abajo en el centro, en el iPad arriba a la derecha.', g_ios2:'Elige “Añadir a pantalla de inicio”', g_ios2s:'Si no lo ves, desplázate un poco hacia abajo en la lista.', g_ios3:'Toca “Añadir” arriba a la derecha', g_ios3s:'Campi ya es un icono en tu pantalla de inicio. Ábrelo desde ahí a partir de ahora.', g_ios_note:'En Chrome u otro navegador, “Compartir” está arriba a la derecha, junto a la dirección.', g_and1:'Toca el menú ⋮ arriba a la derecha', g_and1s:'Los tres puntos junto a la barra de direcciones.', g_and2:'Elige “Instalar aplicación” o “Añadir a pantalla de inicio”', g_and2s:'El nombre cambia un poco según el navegador.', g_and3:'Confirma con “Instalar” o “Añadir”', g_and3s:'Campi ya es un icono en tu pantalla de inicio. Ábrelo desde ahí a partir de ahora.', g_android_note:'Samsung Internet: menú ≡ abajo a la derecha, luego “Añadir página a” y “Pantalla de inicio”.', g_desk1:'Chrome o Edge: haz clic en el icono de instalar', g_desk1s:'A la derecha de la barra de direcciones, o “Instalar” en el menú ⋮.', g_desk2:'Safari en Mac: “Archivo” › “Añadir al Dock”', g_desk2s:'Campi aparece entonces en el Dock como un programa.', g_desk3:'Firefox: guarda un marcador', g_desk3s:'Con Ctrl + D (Mac: ⌘ + D). Firefox no puede instalar webs como apps.', g_desktop_note:'Aun así, lo mejor es probar Campi en tu móvil.', g_direct:'Instalar ahora', g_again:'Encontrarás estas instrucciones siempre en “Ayuda y consejos” (el signo de interrogación arriba a la derecha) y al final de la página de inicio.', g_ok:'Entendido, ir a la app', g_link:'Usar Campi como app', g_btn:'Cómo se hace', ask_hint:'Pregunta a Campi todo lo que quieras saber', ask_examples:'¿Qué hay hoy de comer?|¿Dónde está la biblioteca?|¿Cómo me conecto al wifi?|¿Qué planes hay hoy?|¿Dónde puedo aparcar?', task_now:'Tu tarea', name_title:'¿Cómo quieres que te llamemos?', name_label:'Tu nombre', name_hint:'Solo se guarda en este dispositivo y no se envía.', name_save:'Guardar', name_clear:'Sin nombre', name_edit:'Cambiar nombre', name_add:'Añadir tu nombre', no_events:'Ahora mismo no hay eventos actuales.', events_cal:'Calendario de eventos de la universidad', mensa_src_live:'Fuente: Studierendenwerk Stuttgart (vía OpenMensa) · actualizado {stand}', no_menu_day:'No hay menú para este día.', closed_day:'Ese día la Mensa está cerrada.', live_src:'Plazos y eventos: actualizado {stand}', brand_sub:'Prototipo no oficial', live_here:'Has llegado: {b}', step_walk_live:'Unos {m} a pie hasta {b}, unos {min} min', cafe_src:'Fuente: Studierendenwerk Stuttgart, octubre de 2026', more:'Más', today:'Hoy', mensa_closed_t:'Sin Mensa con platos calientes', seats:'{n} plazas', closed_on:'Cerrado: {d}', menu_link:'Menú actual',
    walk_min:'{n} min a pie', bus_min:'{n} min en autobús', pos_approx:'La posición del edificio es aproximada.', map_tiles_fail:'No se pudieron cargar las imágenes del mapa. Aun así ves los edificios y tu posición.',
    st_geo_pilot:'Opcional: usar mi ubicación mientras Campi esté abierta y guardarla redondeada a unos 10 m.',
    chat_intro:'Hola {name}, soy Campi, tu asistente de campus para la {uni}. Pregúntame por aulas, la Mensa, plazos o la vida en {city}. Respondo en tu idioma, solo con fuentes verificadas, y siempre te muestro de dónde viene la respuesta.',
    st_text:'Campi es el prototipo de una app para estudiantes de la Hochschule Esslingen; no es un servicio oficial de la universidad. Resolverás tres pequeñas tareas y luego responderás unas preguntas breves. Se prueba la app, no a ti. Los edificios y horarios son reales; algunas aulas, platos y fechas son datos de ejemplo.',
    rooms_src:'Fuente: planos de edificios de la Hochschule Esslingen · algunas aulas son de ejemplo', mensa_src:'Fuente: Studierendenwerk Stuttgart, octubre de 2026 · los platos son de ejemplo', footnote:'Prototipo · algunas aulas, platos y fechas son de ejemplo'},
  it: {help_btn:'Aiuto e consigli', help_title:'Aiuto e consigli', help_sub:'Come funziona Campi e come sfruttarlo al meglio.', help_areas:'Cosa sa fare Campi', help_a_start:'La tua giornata a colpo d’occhio: prossima lezione, cambi d’aula, mensa ed eventi.', help_a_rooms:'Cerca un’aula per numero o nome e guarda il percorso sulla mappa, se vuoi in tempo reale con la tua posizione.', help_a_chat:'Fai domande con parole tue e nella tua lingua, ad es. su scadenze, Wi-Fi o orari. Le risposte hanno una fonte.', help_a_mensa:'Il menù della settimana con prezzi e filtri vegano, vegetariano e senza glutine.', help_a_disc:'{studi}: scadenze, eventi e contatti. {stadt}: consigli per {city}.', help_tips:'Consigli per tutti i giorni', help_t_ask:'Chiedi e basta', help_t_ask_s:'Frasi intere o parole chiave, anche con errori di battitura: Campi ti capisce in tedesco, inglese, spagnolo, italiano, francese e turco. Provalo:', help_t_code:'Leggere i numeri delle aule', help_t_code_s:'La lettera iniziale indica il campus: S = Stadtmitte, F = Flandernstraße, G = Göppingen. La prima cifra dopo il punto di solito è il piano (0 = piano terra). Scrivi il numero nella ricerca aule.', help_t_campus:'Cambiare campus', help_t_campus_s:'Tocca il nome del tuo campus nella pagina iniziale. Aule, mensa e consigli si adattano.', help_t_lang:'Cambiare lingua', help_t_lang_s:'Tocca il codice della lingua in alto a destra. Tutta l’app cambia lingua e Campi risponde nella lingua della tua domanda.', help_t_name:'Farsi salutare per nome', help_t_name_s:'Tocca la matita accanto al saluto. Il tuo nome resta solo sul tuo dispositivo.', help_t_live:'Usare la mappa live', help_t_live_s:'In {rooms} › {live} vedi te stesso mentre vai verso l’aula. Campi chiede una volta la tua posizione; la mappa funziona anche senza.', help_t_unsure:'Quando Campi non è sicuro', help_t_unsure_s:'Le risposte con bordo tratteggiato non sono verificate. Campi ti indica allora l’ufficio dell’università che può aiutarti e ti mostra la strada.', help_app_done:'Usi già Campi come app dalla schermata Home. Tutto pronto.', help_faq:'Domande frequenti', help_f1:'Campi è l’app ufficiale dell’università?', help_f1a:'No. Campi è un prototipo non ufficiale di un progetto di studenti. Fanno sempre fede le informazioni della Hochschule Esslingen.', help_f2:'Quanto sono aggiornate le informazioni?', help_f2a:'Menù, scadenze ed eventi vengono presi ogni giorno dai siti ufficiali, con data e fonte. Le lezioni e alcune aule sono esempi.', help_f3:'Cosa succede ai miei dati?', help_f3a:'Solo nel test dell’app e nella fase pilota, e solo con il tuo consenso, viene registrato in forma anonima come si usa Campi, ad esempio quali pagine apri. Il tuo nome resta sul tuo dispositivo; la posizione viene salvata solo con il tuo consenso e arrotondata.', help_f4:'Come esco dalla fase pilota?', help_f4a:'In fondo alla pagina iniziale: “{end}”.', help_more:'Qualcosa non è chiaro?', help_more_s:'Chiedi direttamente a Campi, per esempio “Come trovo un’aula?”', help_ask_btn:'Chiedi a Campi', help_card_t:'Nuovo su Campi?', help_card_s:'Aiuto e consigli: come usare l’app al meglio.', help_open:'Apri l’aiuto', g_kicker:'Consiglio una tantum', g_title:'Usa Campi come un’app', g_intro:'Aggiungi Campi alla schermata Home. Così lo apri con un tocco, a schermo intero e senza barra degli indirizzi, come un’app. Bastano 20 secondi.', g_tabs:'Il tuo dispositivo', g_ios:'iPhone', g_android:'Android', g_desktop:'Computer', g_ios1:'Tocca “Condividi”', g_ios1s:'Il quadrato con la freccia verso l’alto: in Safari in basso al centro, sull’iPad in alto a destra.', g_ios2:'Scegli “Aggiungi alla schermata Home”', g_ios2s:'Se non lo vedi, scorri un po’ verso il basso nell’elenco.', g_ios3:'Tocca “Aggiungi” in alto a destra', g_ios3s:'Ora Campi è un’icona sulla schermata Home. Da adesso aprilo da lì.', g_ios_note:'In Chrome o in un altro browser, “Condividi” è in alto a destra accanto all’indirizzo.', g_and1:'Tocca il menu ⋮ in alto a destra', g_and1s:'I tre puntini accanto alla barra degli indirizzi.', g_and2:'Scegli “Installa app” o “Aggiungi a schermata Home”', g_and2s:'Il nome cambia un po’ a seconda del browser.', g_and3:'Conferma con “Installa” o “Aggiungi”', g_and3s:'Ora Campi è un’icona sulla schermata Home. Da adesso aprilo da lì.', g_android_note:'Samsung Internet: menu ≡ in basso a destra, poi “Aggiungi pagina a” e “Schermata Home”.', g_desk1:'Chrome o Edge: clicca sull’icona di installazione', g_desk1s:'A destra nella barra degli indirizzi, oppure “Installa” nel menu ⋮.', g_desk2:'Safari su Mac: “File” › “Aggiungi al Dock”', g_desk2s:'Campi compare nel Dock come un programma.', g_desk3:'Firefox: aggiungi un segnalibro', g_desk3s:'Con Ctrl + D (Mac: ⌘ + D). Firefox non può installare siti come app.', g_desktop_note:'Il modo migliore, però, è provare Campi sul telefono.', g_direct:'Installa ora', g_again:'Trovi sempre queste istruzioni in “Aiuto e consigli” (il punto interrogativo in alto a destra) e in fondo alla pagina iniziale.', g_ok:'Ho capito, vai all’app', g_link:'Usa Campi come app', g_btn:'Come fare', ask_hint:'Chiedi a Campi tutto quello che vuoi sapere', ask_examples:'Cosa si mangia oggi?|Dov’è la biblioteca?|Come mi collego al Wi-Fi?|Cosa succede oggi?|Dove posso parcheggiare?', task_now:'Il tuo compito', name_title:'Come vuoi che ti chiamiamo?', name_label:'Il tuo nome', name_hint:'Viene salvato solo su questo dispositivo e non viene inviato.', name_save:'Salva', name_clear:'Senza nome', name_edit:'Cambia nome', name_add:'Aggiungi il tuo nome', no_events:'Al momento non ci sono eventi aggiornati.', events_cal:'Calendario eventi dell’università', mensa_src_live:'Fonte: Studierendenwerk Stuttgart (tramite OpenMensa) · aggiornato {stand}', no_menu_day:'Per questo giorno non c’è un menù.', closed_day:'In questo giorno la mensa è chiusa.', live_src:'Scadenze ed eventi: aggiornato {stand}', brand_sub:'Prototipo non ufficiale', live_here:'Sei arrivato: {b}', step_walk_live:'Circa {m} a piedi fino a {b}, circa {min} min', cafe_src:'Fonte: Studierendenwerk Stuttgart, ottobre 2026', more:'Altro', today:'Oggi', mensa_closed_t:'Nessuna mensa con piatti caldi', seats:'{n} posti a sedere', closed_on:'Chiuso: {d}', menu_link:'Menù attuale',
    walk_min:'{n} min a piedi', bus_min:'{n} min in autobus', pos_approx:'La posizione dell’edificio è approssimativa.', map_tiles_fail:'Impossibile caricare le immagini della mappa. Vedi comunque gli edifici e la tua posizione.',
    st_geo_pilot:'Facoltativo: usare la mia posizione mentre Campi è aperta e salvarla arrotondata a circa 10 m.',
    chat_intro:'Ciao {name}, sono Campi, il tuo assistente di campus per la {uni}. Chiedimi di aule, mensa, scadenze o della vita a {city}. Rispondo nella tua lingua, solo da fonti verificate, e ti mostro sempre da dove viene la risposta.',
    st_text:'Campi è il prototipo di un’app per gli studenti della Hochschule Esslingen, non un servizio ufficiale dell’università. Risolverai tre piccoli compiti e poi risponderai ad alcune domande brevi. Si testa l’app, non te. Edifici e orari sono reali; alcune aule, piatti e date sono dati di esempio.',
    rooms_src:'Fonte: planimetrie degli edifici della Hochschule Esslingen · alcune aule sono di esempio', mensa_src:'Fonte: Studierendenwerk Stuttgart, ottobre 2026 · i piatti sono di esempio', footnote:'Prototipo · alcune aule, piatti e date sono di esempio'},
  fr: {help_btn:'Aide et astuces', help_title:'Aide et astuces', help_sub:'Comment fonctionne Campi et comment en tirer le meilleur.', help_areas:'Ce que Campi sait faire', help_a_start:'Ta journée en un coup d’œil : prochain cours, changements de salle, Mensa et événements.', help_a_rooms:'Cherche une salle par numéro ou par nom et vois le chemin sur le plan, en direct avec ta position si tu veux.', help_a_chat:'Pose tes questions avec tes mots et dans ta langue, par ex. sur les délais, le wifi ou les horaires. Les réponses indiquent leur source.', help_a_mensa:'Le menu de la semaine avec les prix et des filtres végan, végétarien et sans gluten.', help_a_disc:'{studi} : délais, événements et contacts. {stadt} : bons plans à {city}.', help_tips:'Astuces du quotidien', help_t_ask:'Demande simplement', help_t_ask_s:'Phrases entières ou mots-clés, même avec des fautes de frappe : Campi te comprend en allemand, anglais, espagnol, italien, français et turc. Essaie :', help_t_code:'Lire les numéros de salle', help_t_code_s:'La lettre au début indique le campus : S = Stadtmitte, F = Flandernstraße, G = Göppingen. Le premier chiffre après le point est en général l’étage (0 = rez-de-chaussée). Tape simplement le numéro dans la recherche de salle.', help_t_campus:'Changer de campus', help_t_campus_s:'Touche le nom de ton campus sur la page d’accueil. Salles, Mensa et bons plans s’adaptent.', help_t_lang:'Changer de langue', help_t_lang_s:'Touche le code de langue en haut à droite. Toute l’app change de langue, et Campi répond dans la langue de ta question.', help_t_name:'Être salué par ton prénom', help_t_name_s:'Touche le crayon à côté du message d’accueil. Ton prénom reste uniquement sur ton appareil.', help_t_live:'Utiliser la carte en direct', help_t_live_s:'Dans {rooms} › {live}, tu te vois sur le chemin de la salle. Campi demande une fois ta position ; le plan fonctionne aussi sans.', help_t_unsure:'Quand Campi n’est pas sûr', help_t_unsure_s:'Les réponses avec un cadre en pointillés ne sont pas vérifiées. Campi t’indique alors le service de l’université qui peut t’aider et te montre le chemin.', help_app_done:'Tu utilises déjà Campi comme une app depuis ton écran d’accueil. Tout est prêt.', help_faq:'Questions fréquentes', help_f1:'Campi est-elle l’app officielle de l’université ?', help_f1a:'Non. Campi est un prototype non officiel issu d’un projet étudiant. Seules les informations de la Hochschule Esslingen font foi.', help_f2:'Les informations sont-elles à jour ?', help_f2a:'Le menu, les délais et les événements sont repris chaque jour des sites officiels, avec date et source. Les cours et certaines salles sont des exemples.', help_f3:'Que deviennent mes données ?', help_f3a:'Uniquement pendant le test de l’app et la phase pilote, et seulement avec ton accord, Campi enregistre anonymement comment l’app est utilisée, par exemple les pages que tu ouvres. Ton prénom reste sur ton appareil ; ta position n’est enregistrée qu’avec ton accord et arrondie.', help_f4:'Comment quitter la phase pilote ?', help_f4a:'Tout en bas de la page d’accueil : « {end} ».', help_more:'Quelque chose n’est pas clair ?', help_more_s:'Demande directement à Campi, par exemple « Comment trouver une salle ? »', help_ask_btn:'Demande à Campi', help_card_t:'Nouveau sur Campi ?', help_card_s:'Aide et astuces : comment tirer le meilleur de l’app.', help_open:'Ouvrir l’aide', g_kicker:'Astuce à lire une fois', g_title:'Utilise Campi comme une app', g_intro:'Ajoute Campi à ton écran d’accueil. Tu l’ouvres alors d’un geste, en plein écran et sans barre d’adresse, comme une app. Ça prend 20 secondes.', g_tabs:'Ton appareil', g_ios:'iPhone', g_android:'Android', g_desktop:'Ordinateur', g_ios1:'Touche « Partager »', g_ios1s:'Le carré avec la flèche vers le haut : en bas au centre dans Safari, en haut à droite sur l’iPad.', g_ios2:'Choisis « Sur l’écran d’accueil »', g_ios2s:'Si tu ne le vois pas, fais défiler un peu la liste.', g_ios3:'Touche « Ajouter » en haut à droite', g_ios3s:'Campi est maintenant une icône sur ton écran d’accueil. Ouvre-le désormais depuis là.', g_ios_note:'Dans Chrome ou un autre navigateur, « Partager » se trouve en haut à droite, à côté de l’adresse.', g_and1:'Touche le menu ⋮ en haut à droite', g_and1s:'Les trois points à côté de la barre d’adresse.', g_and2:'Choisis « Installer l’application » ou « Ajouter à l’écran d’accueil »', g_and2s:'Le nom varie un peu selon le navigateur.', g_and3:'Confirme avec « Installer » ou « Ajouter »', g_and3s:'Campi est maintenant une icône sur ton écran d’accueil. Ouvre-le désormais depuis là.', g_android_note:'Samsung Internet : menu ≡ en bas à droite, puis « Ajouter la page à » et « Écran d’accueil ».', g_desk1:'Chrome ou Edge : clique sur l’icône d’installation', g_desk1s:'À droite dans la barre d’adresse, ou « Installer » dans le menu ⋮.', g_desk2:'Safari sur Mac : « Fichier » › « Ajouter au Dock »', g_desk2s:'Campi apparaît alors dans le Dock comme un programme.', g_desk3:'Firefox : ajoute un marque-page', g_desk3s:'Avec Ctrl + D (Mac : ⌘ + D). Firefox ne peut pas installer de sites comme apps.', g_desktop_note:'Le mieux reste d’essayer Campi sur ton téléphone.', g_direct:'Installer maintenant', g_again:'Tu retrouves ces instructions à tout moment dans « Aide et astuces » (le point d’interrogation en haut à droite) et en bas de la page d’accueil.', g_ok:'Compris, vers l’app', g_link:'Utiliser Campi comme app', g_btn:'Comment faire', ask_hint:'Demande à Campi tout ce que tu veux savoir', ask_examples:'On mange quoi aujourd’hui ?|Où est la bibliothèque ?|Comment avoir le wifi ?|Que se passe-t-il ?|Où me garer ?', task_now:'Ta mission', name_title:'Comment veux-tu qu’on t’appelle ?', name_label:'Ton prénom', name_hint:'Enregistré uniquement sur cet appareil, jamais envoyé.', name_save:'Enregistrer', name_clear:'Sans prénom', name_edit:'Changer le prénom', name_add:'Ajouter ton prénom', no_events:'Pas d’événements à jour pour le moment.', events_cal:'Agenda de l’université', mensa_src_live:'Source : Studierendenwerk Stuttgart (via OpenMensa) · mis à jour {stand}', no_menu_day:'Pas de menu pour ce jour.', closed_day:'La Mensa est fermée ce jour-là.', live_src:'Délais et événements : mis à jour {stand}', brand_sub:'Prototype non officiel', live_here:'Tu es arrivé : {b}', step_walk_live:'Environ {m} à pied jusqu’à {b}, soit environ {min} min', cafe_src:'Source : Studierendenwerk Stuttgart, octobre 2026', more:'Plus', today:'Aujourd’hui', mensa_closed_t:'Pas de Mensa avec plats chauds', seats:'{n} places assises', closed_on:'Fermé : {d}', menu_link:'Menu actuel',
    walk_min:'{n} min à pied', bus_min:'{n} min en bus', pos_approx:'La position du bâtiment est approximative.', map_tiles_fail:'Les images de la carte n’ont pas pu être chargées. Tu vois quand même les bâtiments et ta position.',
    st_geo_pilot:'Facultatif : utiliser ma position tant que Campi est ouverte et l’enregistrer arrondie à environ 10 m.',
    chat_intro:'Salut {name}, je suis Campi, ton assistant de campus pour la {uni}. Pose-moi des questions sur les salles, la Mensa, les délais ou la vie à {city}. Je réponds dans ta langue, uniquement à partir de sources vérifiées, et je te montre toujours d’où vient la réponse.',
    st_text:'Campi est le prototype d’une application pour les étudiants de la Hochschule Esslingen, pas un service officiel de l’université. Tu vas réaliser trois petites tâches puis répondre à quelques questions courtes. On teste l’application, pas toi. Les bâtiments et horaires sont réels ; certaines salles, certains plats et certaines dates sont des exemples.',
    rooms_src:'Source : plans des bâtiments de la Hochschule Esslingen · certaines salles sont des exemples', mensa_src:'Source : Studierendenwerk Stuttgart, octobre 2026 · les plats sont des exemples', footnote:'Prototype · certaines salles, certains plats et certaines dates sont des exemples'},

const X = (de, en, es, it, fr, tr) => ({de, en, es, it, fr, tr});
function offLL(base, e, n){ return [+(base[0] + n / 111320).toFixed(6), +(base[1] + e / (111320 * Math.cos(base[0] * Math.PI / 180))).toFixed(6)]; }

/* opening hours in OSM style ('Mo-Th 11:15-14:15; Fr 11:15-14:00'), shown in every language */
const OH_DAYS = {de:'Mo|Di|Mi|Do|Fr|Sa|So', en:'Mon|Tue|Wed|Thu|Fri|Sat|Sun', es:'lun|mar|mié|jue|vie|sáb|dom', it:'lun|mar|mer|gio|ven|sab|dom', fr:'lun|mar|mer|jeu|ven|sam|dim', tr:'Pzt|Sal|Çar|Per|Cum|Cmt|Paz'};
const OH_CODES = ['Mo','Tu','We','Th','Fr','Sa','Su'];
function fmtClock(s, lang){
  const [h, m] = s.split(':');
  if(lang === 'fr') return (+h) + 'h' + m;
  if(lang === 'tr') return h.padStart(2, '0') + ':' + m;
  return (+h) + ':' + m;
}
function fmtOH(spec, lang, sep){
  if(!spec) return '';
  const l = lang || LANG, days = OH_DAYS[l].split('|');
  const day = c => days[OH_CODES.indexOf(c)] || c;
  return spec.split(';').map(part => {
    const m = part.trim().match(/^([A-Za-z,\-]+)\s+(.+)$/); if(!m) return part.trim();
    const ds = m[1].split(',').map(r => r.includes('-') ? r.split('-').map(day).join('–') : day(r)).join(', ');
    const ts = m[2].split(',').map(r => r.split('-').map(x => fmtClock(x, l)).join('–')).join(', ');
    return ds + ' ' + ts + (l === 'de' ? ' Uhr' : '');
  }).join(sep || ' · ');
}

const DIRS = {N:X('Nord','north','norte','nord','nord','kuzey'), S:X('Süd','south','sur','sud','sud','güney'), E:X('Ost','east','este','est','est','doğu'), W:X('West','west','oeste','ovest','ouest','batı')};
/* entrance names, already in the grammatical form the step text needs ("bis zum …", "to the …", "{e} kadar") */
function entranceName(en, lang){
  const l = lang || LANG, d = L(DIRS[en.dir], l), b = en.b, geb = en.lvl === 'geb', bf = !!en.bf;
  switch(l){
    case 'en': return (bf ? 'step-free ' : '') + d + ' entrance of ' + (geb ? 'building ' : 'section ') + b;
    case 'es': return 'entrada ' + d + (bf ? ' accesible' : '') + (geb ? ' del edificio ' : ' de la sección ') + b;
    case 'it': return 'ingresso ' + d + (bf ? ' senza barriere' : '') + (geb ? ' dell’edificio ' : ' del settore ') + b;
    case 'fr': return 'entrée ' + d + (bf ? ' accessible' : '') + (geb ? ' du bâtiment ' : ' de la partie ') + b;
    case 'tr': return b + (geb ? ' binasının ' : ' bölümünün ') + d + ' ' + (bf ? 'engelsiz ' : '') + 'girişine';
    default: return (bf ? 'barrierefreien ' : '') + 'Eingang ' + d + ' von ' + (geb ? 'Gebäude ' : 'Bauteil ') + b;
  }
}

function ortId(campus, kind, key){ return campus + ':' + kind + ':' + key; }
function applyOrte(rows){
  (rows || []).forEach(o => {

    const [c, kind, key] = o.id.split(':'); const cp = CAMPUS[c]; if(!cp) return;
    const ll = [+o.lat, +o.lon];
    if(kind === 'b' && cp.buildings[key]){ cp.buildings[key].ll = ll; cp.buildings[key].est = false; }
    else if(kind === 's' && cp.starts[key]) cp.starts[key].ll = ll;
  });
}

/* ================= Aktuelle Daten aus daten.json =================
   Ein GitHub-Workflow (.github/workflows/daten-aktualisieren.yml) schreibt jede Nacht um 1 Uhr deutscher Zeit
   den Speiseplan (Studierendenwerk Stuttgart über OpenMensa), Fristen und Veranstaltungen in daten.json.
   Claude übersetzt dabei die Gerichte und prüft Fristen und Termine auf hs-esslingen.de.
   Fehlt die Datei oder ist sie fehlerhaft, zeigt die App die eingebauten Beispieldaten. */
const LIVE = {ok:false, stand:null, quelle:'', mensa:false, fristen:false, termine:false, tr:{}, typen:{}, mensaStand:null, via:''};
const ISO_RE = /^\d{4}-\d{2}-\d{2}$/;
const DISH_TYPES = ['vegan', 'vegetarisch', 'fleisch', 'fisch'];
function isoDay(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function cleanX(o, max){
  max = max || 200;
  if(typeof o === 'string') return o.trim() ? {de: o.trim().slice(0, max)} : null;
  if(!o || typeof o !== 'object' || typeof o.de !== 'string' || !o.de.trim()) return null;
  const out = {};
  LANGS.forEach(l => { if(typeof o[l] === 'string' && o[l].trim()) out[l] = o[l].trim().slice(0, max); });
  return out;
}
function isOH(s){ return typeof s === 'string' && s.length < 120 && /^([A-Za-z]{2}([-,][A-Za-z]{2})*\s+\d{2}:\d{2}-\d{2}:\d{2}(,\d{2}:\d{2}-\d{2}:\d{2})*)(;\s*[A-Za-z]{2}([-,][A-Za-z]{2})*\s+\d{2}:\d{2}-\d{2}:\d{2}(,\d{2}:\d{2}-\d{2}:\d{2})*)*$/.test(s.trim()); }
function cleanUrl(u){ return typeof u === 'string' && /^https:\/\/[^\s"<>]+$/.test(u) && u.length < 300 ? u : null; }
function applyDaten(j){
  if(!j || typeof j !== 'object' || j.version !== 1 || typeof j.stand !== 'string' || isNaN(Date.parse(j.stand))) return false;
  /* menus */
  ['SM', 'FL'].forEach(k => {
    const m = j.mensa && j.mensa[k], cm = CAMPUS[k].mensa; if(!m || !cm) return;
    const tage = {};
    (Array.isArray(m.tage) ? m.tage : []).slice(0, 21).forEach(tg => {
      if(!tg || !ISO_RE.test(tg.datum)) return;
      const dishes = (Array.isArray(tg.gerichte) ? tg.gerichte : []).slice(0, 24).map((g, i) => {
        const n = g && cleanX(g.name, 160); if(!n) return null;
        const p = Number(g.preis), pb = Number(g.preis_bedienstete);
        return {id: 'live' + i, n, k: cleanX(g.kategorie, 60), t: DISH_TYPES.includes(g.typ) ? g.typ : null,
          p: isFinite(p) && p > 0 && p < 50 ? p : null, pb: isFinite(pb) && pb > 0 && pb < 50 ? pb : null,
          a: (Array.isArray(g.allergene) ? g.allergene : []).filter((a, x, arr) => ALG[a] && arr.indexOf(a) === x).slice(0, 14), live: true};
      }).filter(Boolean);
      tage[tg.datum] = {closed: tg.geschlossen === true, dishes};
    });
    if(Object.keys(tage).length){ cm.live = tage; LIVE.mensa = true; }
    if(isOH(m.oeffnungszeiten)) cm.open = m.oeffnungszeiten.trim();
    if(isOH(m.essensausgabe)) cm.serve = m.essensausgabe.trim();
    if(typeof m.geschlossen === 'string' && m.geschlossen.length < 80) cm.closed = m.geschlossen;
  });
  /* deadlines */
  if(Array.isArray(j.fristen)){
    j.fristen.slice(0, 12).forEach(f => {
      if(!f || typeof f.key !== 'string' || !/^[a-z_]{2,40}$/.test(f.key)) return;
      const von = ISO_RE.test(f.von) ? f.von : null, bis = ISO_RE.test(f.bis) ? f.bis : null, tt = cleanX(f.titel, 120);
      if(!tt || !(von || bis)) return;
      const old = DEADLINES.find(d => d.key === f.key);
      const entry = {key: f.key, von, bis, t: tt, wo: cleanX(f.hinweis, 160) || (old && old.wo) || null, url: cleanUrl(f.quelle), live: true};
      if(old) Object.assign(old, entry); else DEADLINES.push(entry);
      LIVE.fristen = true;
    });
  }
  /* events */
  if(Array.isArray(j.termine)){

      return {when: e.datum, time: /^\d{2}:\d{2}$/.test(e.zeit) ? e.zeit : '', c: CAMPUS[e.campus] ? e.campus : null, n, s: cleanX(e.ort, 160) || {de: ''}, url: cleanUrl(e.url), live: true};

  if(j.uebersetzungen && typeof j.uebersetzungen === 'object') Object.keys(j.uebersetzungen).slice(0, 3000).forEach(k => { const x = cleanX(Object.assign({de: k}, j.uebersetzungen[k]), 160); if(x) LIVE.tr[k] = x; });
  if(j.typen && typeof j.typen === 'object') Object.keys(j.typen).slice(0, 3000).forEach(k => { if(DISH_TYPES.includes(j.typen[k])) LIVE.typen[k] = j.typen[k]; });
  LIVE.ok = LIVE.mensa || LIVE.fristen || LIVE.termine;
  LIVE.stand = j.stand; LIVE.quelle = typeof j.quelle === 'string' ? j.quelle.slice(0, 200) : '';

/* where to look: config.js (datenUrl), daten.json next to the page, and on GitHub Pages the newest copy in the repository */
function datenQuellen(){
  const out = [];
  const cfg = window.CAMPI_CONFIG && typeof window.CAMPI_CONFIG === 'object' ? window.CAMPI_CONFIG : {};
  if(typeof cfg.datenUrl === 'string' && /^https:\/\//.test(cfg.datenUrl)) out.push(cfg.datenUrl);
  if(/^https?:$/.test(location.protocol)) out.push('daten.json');
  const h = location.hostname;
  if(/\.github\.io$/i.test(h)){
    const user = h.split('.')[0], seg = location.pathname.split('/').filter(Boolean)[0];
    const repo = seg && !/\.html?$/i.test(seg) ? seg : h;
    out.push('https://raw.githubusercontent.com/' + encodeURIComponent(user) + '/' + encodeURIComponent(repo) + '/HEAD/daten.json');
  }
  return out;
}
/* the newest data set wins; a later, newer one (e.g. from the claude.ai database) replaces it */
function offerDaten(j, via){
  if(!j || j.version !== 1 || typeof j.stand !== 'string' || isNaN(Date.parse(j.stand))) return false;
  if(LIVE.stand && Date.parse(j.stand) <= Date.parse(LIVE.stand)) return false;
  if(!applyDaten(j)) return false;
  LIVE.via = via || '';
  if(state.mode === 'app' && ['start', 'mensa', 'discover', 'chat'].includes(state.tab)) renderScreen(true);
  return true;
}
async function loadDaten(){
  let best = null;
  for(const url of datenQuellen()){
    try {
      const r = await fetch(url, {cache: 'no-cache'});
      if(!r.ok) continue;
      const j = await r.json();
      if(j && j.version === 1 && typeof j.stand === 'string' && !isNaN(Date.parse(j.stand)) && (!best || Date.parse(j.stand) > Date.parse(best.stand))) best = j;
      if(best && isoDay(new Date(best.stand)) === isoDay(new Date())) break;
    } catch(e){}
  }
  if(best) offerDaten(best, 'daten.json');
}
/* claude.ai: Claude researches menu, events and deadlines every morning and writes them into this page's database
   (collection "live": info, mensa_SM, mensa_FL). Only signed-in viewers can read it; everyone else gets the other sources. */
async function loadDb(){
  if(!window.claude || typeof window.claude.use !== 'function') return;
  let db = null;
  try { db = await window.claude.use('db'); } catch(e){ db = null; }
  if(!db) return;
  try {
    db.collection('live').onSnapshot(snap => {
      const parts = {};
      snap.docs.forEach(d => { if(d.exists) parts[d.id] = d.data(); });
      const info = parts.info;
      if(!info || typeof info !== 'object') return;
      const j = Object.assign({}, info, {mensa: {}});
      ['SM', 'FL'].forEach(k => { const m = parts['mensa_' + k]; if(m && typeof m === 'object') j.mensa[k] = m; });
      offerDaten(JSON.parse(JSON.stringify(j)), 'claude');
    }, () => {});
  } catch(e){}
}

/* ---------- menu straight from OpenMensa (Studierendenwerk Stuttgart), always the current state ---------- */
const OM_IDS = {SM: 396, FL: 397}, OM_KEY = 'campi-openmensa-v1', OM_TTL = 3 * 36e5;

  ['Krebstiere', /krebs|krusten/i], ['Weichtiere', /weichtier|mollus/i], ['Milch', /milch|lakto|lacto|laktose/i], ['Ei', /(^|[^a-zäöü])eier?([^a-zäöü]|$)|h(u|ü)hnerei/i],
  ['Fisch', /(^|[^a-zäöü])fisch/i], ['Senf', /senf/i], ['Sellerie', /sellerie/i], ['Soja', /soja/i], ['Sesam', /sesam/i], ['Sulfite', /sulfit|schwefel/i], ['Lupine', /lupine/i]];
const OM_FISH = /fisch|lachs|seelachs|thunfisch|forelle|kabeljau|zander|pangasius|hering|makrele|scholle|dorsch|garnele|shrimp|scampi|calamar|tintenfisch|meeresfr/i;
const OM_MEAT = /fleisch|schwein|rind|kalb|lamm|hähnchen|haehnchen|huhn|hühn|geflügel|gefluegel|pute|truthahn|(^|[^a-zäöü])ente|hirsch|wildragout|hack|speck|schinken|wurst|würst|salami|bacon|gyros|döner|doener|leberkäse|schnitzel|frikadelle|bolognese|chicken|maultasche/i;
function omClean(x, max){ return typeof x === 'string' ? x.replace(/[<>]/g, '').replace(/\s*\((?:\s*[0-9A-Za-zÄÖÜäöü]{1,3}\s*,)*\s*[0-9A-Za-zÄÖÜäöü]{1,3}\s*\)/g, '').replace(/\s+/g, ' ').replace(/\s+([,.;:])/g, '$1').trim().slice(0, max) : ''; }
function omType(name, cat, notes){
  const h = notes.join(' | '), all = name + ' | ' + cat + ' | ' + h, head = name + ' | ' + cat;
  if(/vegan/i.test(all) && !/(nicht|kein)\s+vegan/i.test(all)) return 'vegan';
  if(/vegetari|fleischlos|veggie/i.test(all)) return 'vegetarisch';
  if(OM_FISH.test(head) || /meeresfr/i.test(h)) return 'fisch';
  if(OM_MEAT.test(head) || /schwein|rind|geflügel|gefluegel|lamm|kalb|wild|fleisch/i.test(h)) return 'fleisch';

function omDays(list){

    if(!dy || !ISO_RE.test(dy.date)) return;
    const meals = Array.isArray(dy.meals) ? dy.meals : [];

      const de = omClean(m && m.name, 160); if(!de) return null;
      const notes = (Array.isArray(m.notes) ? m.notes : []).filter(n => typeof n === 'string');
      const cat = omClean(m.category, 60), pr = m.prices || {};
      const p = Number(pr.students), pb = Number(pr.employees);
      const a = []; notes.forEach(n => OM_ALG.forEach(([k, re]) => { if(re.test(n) && !a.includes(k)) a.push(k); }));
      return {id: 'om' + i, de, cat, t: LIVE.typen[de] || omType(de, cat, notes), p: p > 0 && p < 50 ? p : null, pb: pb > 0 && pb < 50 ? pb : null, a, live: true};
    }).filter(Boolean)};

/* put the OpenMensa days into the menus, reusing translations from the morning data */
function mergeOpenMensa(){
  if(!OM) return;
  ['SM', 'FL'].forEach(k => {
    const cm = CAMPUS[k].mensa, days = OM.data[k]; if(!cm || !days) return;
    const known = {};
    Object.values(cm.live || {}).forEach(d => (d.dishes || []).forEach(x => { if(x.n && x.n.de) known[x.n.de] = x; }));
    const live = Object.assign({}, cm.live || {});
    Object.keys(days).forEach(iso => {
      const d = days[iso];
      live[iso] = {closed: d.closed, dishes: d.dishes.map(x => {
        const old = known[x.de];
        const n = old ? old.n : (LIVE.tr[x.de] || {de: x.de});
        const kat = x.cat ? ((old && old.k && old.k.de === x.cat) ? old.k : (LIVE.tr[x.cat] || {de: x.cat})) : null;
        return {id: x.id, n, k: kat, t: LIVE.typen[x.de] || (old && old.t) || x.t, p: x.p, pb: x.pb, a: x.a, live: true};

async function loadOpenMensa(){

}

const ADJ = {};
FL_PLAN.edges.forEach(e => { const a = FL_PLAN.nodes[e[0]], b = FL_PLAN.nodes[e[1]], d = Math.hypot(a[0]-b[0], a[1]-b[1]); (ADJ[e[0]] = ADJ[e[0]] || []).push([e[1], d]); (ADJ[e[1]] = ADJ[e[1]] || []).push([e[0], d]); });
function shortest(from){
  const nodes = FL_PLAN.nodes, dist = {}, prev = {}, todo = new Set(Object.keys(nodes));
  Object.keys(nodes).forEach(k => dist[k] = Infinity); dist[from] = 0;
  while(todo.size){
    let u = null; todo.forEach(k => { if(u === null || dist[k] < dist[u]) u = k; });
    if(dist[u] === Infinity) break;
    todo.delete(u);
    (ADJ[u] || []).forEach(([v, d]) => { if(todo.has(v) && dist[u] + d < dist[v]){ dist[v] = dist[u] + d; prev[v] = u; } });
  }
  return {dist, prev};
}
const SP_CACHE = {};
function haversine(a, b){
  const R = 6371000, toR = Math.PI / 180, dLat = (b[0] - a[0]) * toR, dLon = (b[1] - a[1]) * toR;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * toR) * Math.cos(b[0] * toR) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function bearing(a, b){
  const toR = Math.PI / 180, y = Math.sin((b[1] - a[1]) * toR) * Math.cos(b[0] * toR);
  const x = Math.cos(a[0] * toR) * Math.sin(b[0] * toR) - Math.sin(a[0] * toR) * Math.cos(b[0] * toR) * Math.cos((b[1] - a[1]) * toR);
  return (Math.atan2(y, x) / toR + 360) % 360;
}
function walkMinutes(m){ return Math.max(1, Math.round(m / 75)); }
/* route on the Flandernstraße plan, straight-line estimate on the other campuses */
function routeTo(roomId, startId, barrierefrei){
  const r = ROOMS[roomId], c = CAMPUS[r.c];
  if(c.plan){
    const P = c.plan, bld = c.buildings[r.b];
    let cands = bld.ent.slice();
    if(barrierefrei){
      const own = cands.filter(e => P.entrances[e].bf);
      cands = own.length ? own : Object.keys(c.buildings).filter(k => c.buildings[k].group === bld.group).reduce((a, k) => a.concat(c.buildings[k].ent), []).filter((e, i, arr) => P.entrances[e].bf && arr.indexOf(e) === i);
    }
    const node = (c.starts[startId] || c.starts[c.defStart]).node;
    const sp = SP_CACHE[node] || (SP_CACHE[node] = shortest(node));
    let best = cands[0]; cands.forEach(e => { if(sp.dist[e] < sp.dist[best]) best = e; });
    const path = [best]; while(path[0] !== node && sp.prev[path[0]]) path.unshift(sp.prev[path[0]]);
    const meters = Math.max(10, Math.round(sp.dist[best] * P.mpp / 10) * 10);
    return {plan:true, entrance:best, path, meters, minutes: walkMinutes(meters)};
  }
  const st = c.starts[startId] || c.starts[c.defStart], to = c.buildings[r.b].ll;
  const air = haversine(st.ll, to), meters = Math.max(10, Math.round(air * 1.25 / 10) * 10);
  return {plan:false, air: Math.round(air / 10) * 10, meters, minutes: walkMinutes(meters)};
}

/* text folding for search and chat: lower case, no accents, ı -> i, ß -> ss */
function fold(s){ return String(s).toLowerCase().replace(/œ/g, 'oe').replace(/ß/g, 'ss').replace(/ı/g, 'i').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’'`´]/g, "'"); }
function norm(s){ return fold(s); }
function roomKeys(r){
  const keys = [];
  if(r.nr){ const k = r.nr.replace(/\./g, ''), l = CAMPUS[r.c].letter.toLowerCase(); keys.push(k, k.replace(/^0/, ''), l + k, l + k.replace(/^0/, '')); }
  LANGS.forEach(l => keys.push(fold(roomName(r, l)).replace(/[\s.]/g, '')));
  (r.al || []).forEach(a => keys.push(fold(a).replace(/[\s.]/g, '')));
  return keys;
}
function roomMatches(q){
  const n = fold(q).replace(/[\s.]/g, '');
  if(!n) return [];
  const hits = ROOM_LIST.filter(r => roomKeys(r).some(k => k.includes(n))).map(r => r.id);
  return hits.sort((a, b) => (ROOMS[b].c === state.campus) - (ROOMS[a].c === state.campus));
}
function roomResults(q){
  if(!q.trim()) return '';
  const ids = roomMatches(q).slice(0, 8);
  if(!ids.length) return '<div class="results"><p class="empty">' + esc(t('no_room', {ex: C().ex})) + '</p></div>';
  return '<div class="results">' + ids.map(id => { const r = ROOMS[id]; return '<button class="result" type="button" data-act="room" data-room="' + id + '"><b>' + esc(roomName(r)) + '</b><span>' + esc((r.code ? r.code + ' · ' : '') + L(CAMPUS[r.c].short)) + '</span></button>'; }).join('') + '</div>';
}
